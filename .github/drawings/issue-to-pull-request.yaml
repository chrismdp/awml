# An issue the maintainer labels build becomes a pull request. The repository is public, so
# everything here sits in one scope: what matters is who may act. Only people with write access,
# and the repository's own app, can add a label, so the label is the decision. The build says on
# the issue that it has started. Claude drafts with a read-only token, and as part of its draft
# redraws the examples the change alters and pictures those that look different. The app then
# pushes the branch and the pictures and opens the pull request. The build runs no checks of its
# own: CI judges the commit when the pull request opens, as it judges every pull request, and
# land-a-pull-request, fix-review-findings and retry-a-build each wake on CI finishing, reading
# GitHub rather than anything this workflow writes.
awml: "0.8"
title: An issue becomes a pull request
description: |
  The factory's build: a labelled issue becomes a draft, and the app pushes it and opens a pull
  request. CI, not the build, judges it.
scopes:
  - { id: public, label: "public: anyone who reads the repository", processing: any }
parts:
  - { id: comment, kind: trigger, label: "The build label is added to an issue", wait: PT1H }
  - { id: dispatch, kind: trigger, label: "retry-a-build starts the build again for an issue", wait: PT1H }
  - { id: thread, kind: connector, label: "The issue and its comments, which anyone can open or write", in: public, untrusted: true }
  - { id: who, kind: code, op: sort, label: "Sort by rule: is the label build?", in: public }
  - { id: approve, kind: review, label: "The build label is the yes of someone with write access to the issue as it reads then", in: public }
  - { id: still, kind: code, op: sort, cleans: true, label: "Sort by GitHub's record, passing on only the issue's number: does the issue still carry the build label, and is its lastEditedAt, from GraphQL, older than the label's last labelled event?", in: public }
  - { id: token, kind: connector, label: "The repository, through its own Actions token", in: public }
  - { id: app, kind: connector, label: "The repository, through its own GitHub App", in: public }
  - { id: started, kind: code, op: do, label: "Post a new comment on the issue that the build has started, linking the run", in: public }
  - { id: startnote, kind: outside, label: "Comment on the issue: Allow", in: public }
  - { id: keep, kind: code, op: sort, cleans: true, label: "Keep only the issue's text, unedited since the label was last added, and the comments of the owner, members and collaborators, by GitHub's record of who wrote each", in: public }
  - { id: bring, kind: code, op: bring-in, label: "Bring in the approved text and comments, and the failed tests' log of CI's latest pull_request run on the issue's branch, if it has one", in: public }
  - { id: asked, kind: context, label: "The issue's text, unedited since the label was last added, and its people's comments", in: public }
  - { id: failed, kind: context, label: "Why the last try failed: the failed tests' log of CI's latest run on the branch", in: public, untrusted: true }
  - { id: repo, kind: context, label: "The spec, guide, code, AGENTS.md and REVIEW.md, from main", in: public }
  - { id: build, kind: ai, op: draft, label: "Write the change test first, then redraw the examples it alters and picture, before and after, those that look different", in: public }
  - { id: patch, kind: context, label: "The change, as a patch, with its pictures, Claude's note and its description for the pull request", in: public }
  - { id: guard, kind: code, op: sort, label: "Sort by git alone: does the draft touch .github/ or Claude Code's own files?", in: public }
  - { id: offer, kind: code, op: do, cleans: true, label: "Offer the draft in a new comment on the issue from fixed text: gh run download <run> -n change, the git apply command, and that the artifact lasts 30 days, quoting none of it", in: public }
  - { id: offered, kind: outside, label: "Comment on the issue with the commands: Allow", in: public }
  - { id: push, kind: code, op: do, label: "Push the branch and its pictures as the app", in: public }
  - { id: standing, kind: approval, label: "The maintainer's standing approval: the app's pushes to the issue's own branch only, up to three builds an issue, accepted by the maintainer in #160, under rule 4", in: public }
  - { id: branch, kind: outside, label: "Push the issue's branch and its pictures: Ask", in: public }
  - { id: open, kind: code, op: do, label: "Open a pull request that says Closes #n, unless one is open from the branch already", in: public }
  - { id: standingpr, kind: approval, label: "The maintainer's standing approval: one open pull request an issue, from its own branch, accepted by the maintainer in #160, under rule 4", in: public }
  - { id: pr, kind: outside, label: "Open the pull request: Ask", in: public }
  - { id: listed, kind: surface, label: "The repository's branches and pull requests, where each push is listed with its commit", in: public }
  - { id: strangers, kind: comment, label: "Anyone can open an issue or comment. The issue reaches Claude only as the text a person with write access approved by adding the label, and only the comments of the owner, members and collaborators are passed on" }
  - { id: label, kind: comment, label: "Only people with write access and the repository's app can add a label, and GitHub holds that, not a prompt, so a stranger's comment starts nothing. The draft step's token can only read, so it can't push (awml #26)" }
  - { id: noinputs, kind: comment, label: "A retry's dispatch carries the issue's number and nothing the build trusts. The build checks the label and the issue's last edit itself, and reads CI's failed log from GitHub (#160 rule 2)" }
  - { id: pinned, kind: comment, label: "Decided in #160's follow-up: a try drafts from the issue's text as it reads now, only if it hasn't been edited since the build label was last added, by comparing the issue's last edit with the label event. An edited issue waits for a person to add the label again (awml #120)" }
  - { id: nochecks, kind: comment, label: "Decided in #160's follow-up: the build runs no checks of its own. It always pushes and opens the pull request, CI judges it, and retry-a-build wakes when CI's tests fail (#160 rule 4)" }
  - { id: logtext, kind: comment, label: "CI's failed log is the output of the branch's code, which a fix commit drafted from review findings may have changed, so the next draft reads it as untrusted. Nothing in the run stops it, so the app's push and pull request go under standing approvals" }
  - { id: startcomment, kind: comment, label: "Decided in #160's follow-up: one new comment when the build starts, linking the run. It's never edited or parsed. The pull request links to the issue by Closes #n (#160 rule 5)" }
  - { id: seen, kind: comment, label: "Only a change to what a drawing or a page shows is pictured, and a picture that looks the same before and after is left out. A moving image only for something that moves" }
  - { id: layout, kind: comment, label: "The description is Claude's note, escaped, then what changed, the decisions the issue didn't settle, the pictures, and Closes #n. No record line and no digests: nothing reads the description back (#160)" }
  - { id: reused, kind: comment, label: "The branch is reused, so a new try's push updates the open pull request, and no earlier one needs closing (#160's follow-up)" }
  - { id: ownfiles, kind: comment, label: "Decided in #160's follow-up: the build works as the fixer does. A draft touching .github/ or Claude Code's own settings, .claude/, .mcp.json or a CLAUDE.md, isn't pushed: it's offered in a new comment, and the build stops without a retry, since nothing is pushed for CI to fail. No session loads settings or servers from the tree" }
  - { id: rendered, kind: comment, label: "The label approves the issue as the maintainer saw it, so the issue and its people's comments are read as GitHub renders them, bodyHTML from GraphQL, never the Markdown behind them: an HTML comment or other text the page hides never reaches Claude (#150)" }
  - { id: starts, kind: comment, label: "GitHub starts other workflows from the app's pull request, but not from the Actions token's, so CI runs when the pull request opens" }
lines:
  - { from: comment, to: who, kind: start, label: "the label" }
  - { from: who, to: approve, kind: start, label: "[build]" }
  - { from: thread, to: approve, kind: data, label: "the issue" }
  - { from: approve, to: started, kind: start, label: "[yes]" }
  - { from: dispatch, to: still, kind: start, label: "the issue's number" }
  - { from: thread, to: still, kind: data, label: "the issue's labels and last edit" }
  - { from: still, to: started, kind: start, label: "[labelled, unedited since]" }
  - { from: started, to: startnote, kind: data }
  - { from: startnote, to: token, kind: data }
  - { from: started, to: keep, kind: start }
  - { from: thread, to: keep, kind: data, label: "the issue's text and comments" }
