implementations:
  actions:
    label: "GitHub Actions, build.yml"
    blocks:
      - { id: github, label: "GitHub: issues, branches and pull requests", parts: [comment, dispatch, thread, who, approve, token, app, repo, startnote, offered, standing, branch, standingpr, pr, listed] }
      - { id: startjob, label: "Actions job: post the start comment, checking out nothing and running only gh", platform: actions-code, parts: [still, started] }
      - { id: draftjob, label: "Actions job: draft, with a read-only token", platform: actions-code, parts: [keep, bring, asked, failed] }
      - { id: agentjob, label: "Claude Code, claude-opus-5-5, on the maintainer's subscription", platform: actions-agent, in: draftjob, parts: [build] }
      - { id: openjob, label: "Actions job: push and open, running nothing from the change", platform: actions-code, parts: [patch, guard, offer, push, open] }
    comments:
      - { id: scrub, label: "Claude Code holds the maintainer's login token for its own calls, and strips it, with any other credential, from the commands it runs, which run in its sandbox, tests included. The job runs nothing of its own beside the secret (awml #121, #160)", in: agentjob, ties: [build] }
      - { id: reads, label: "Read is limited to the workspace and the session's own input folder, with Read(//proc/**) denied, and Edit and Write are denied on .git/**. Git after the session runs with core.hooksPath=/dev/null and core.fsmonitor=false (#160)", in: agentjob, ties: [build] }
      - { id: hashed, label: "The patch is an artifact within this run only, because the job split keeps the app's token away from the change's code. The draft job gives its sha256 as an output, the open job checks it, and everything the session wrote is scanned for a token before it's uploaded. It's uploaded with retention-days: 30, so an offered draft can be downloaded for 30 days (#160 rule 6)", in: openjob, ties: [patch] }
      - { id: runname, label: "Each run's name carries the issue's number, so retry-a-build counts a try as a build.yml run for the issue since the label was last added (#160's follow-up)", in: startjob, ties: [started] }
