# An issue the maintainer labels build becomes a pull request. The repository is public, so
# everything here sits in one scope: what matters is who may act. The label is the decision when
# someone with write access, or the repository's own app, added it last, by GitHub's record and
# each adder's permission, since someone with triage can add a label too. The build says on
# the issue that it has started. Claude drafts with a read-only token, and as part of its draft
# redraws the examples the change alters and pictures those that look different. The app then
# pushes the branch and the pictures and opens the pull request. The build runs no checks of its
# own: CI judges the commit when the pull request opens, as it judges every pull request, and
# land-a-pull-request and fix-review-findings each wake on CI finishing, reading
# GitHub rather than anything this workflow writes.
awml: "0.11"
title: An issue becomes a pull request
description: |
  The factory's build: a labelled issue becomes a draft, and the app pushes it and opens a pull
  request. CI, not the build, judges it.
scopes:
  - { id: public, label: "public: anyone who reads the repository", processing: any }
parts:
  - { id: comment, kind: trigger, label: "The build label is added to an issue", wait: PT1H }
  - id: thread
    kind: connector
    label: "The public issue and comments"
    in: public
    untrusted: true
    description: >-
      Anyone can open an issue or write a comment.
  - id: who
    kind: code
    op: sort
    label: "Is it the build label?"
    in: public
    description: >-
      The label must be build.
  - id: approve
    kind: review
    label: "A writer approves the issue as it reads"
    in: public
    description: >-
      Adding the build label approves the issue as it reads then. The person who adds it must have
      write access.
  - id: still
    kind: code
    op: sort
    cleans: true
    label: "Did a writer or the app last add the build label?"
    in: public
    description: >-
      GitHub's record must name someone with write access, checked by their permission, or the app's
      bot as the last adder. Only the issue's number passes on.
  - { id: token, kind: connector, label: "The repository's Actions token", in: public }
  - id: app
    kind: connector
    label: "The repository's GitHub App"
    in: public
    description: >-
      GitHub starts other workflows from the app's pull request, but not from the Actions token's. CI
      therefore runs when the pull request opens.
  - id: started
    kind: code
    op: do
    label: "Say the build started"
    in: public
    description: >-
      Decided in #160's follow-up: make one new comment when the build starts and link the run. Never
      edit or parse it. The pull request links to the issue with Closes #n (#160 rule 5). In the
      GitHub Actions implementation, each run's name carries the issue's number so a person can find
      its builds. Failed tests go to the fixer. No build count starts another build (awml#212).
  - { id: startnote, kind: outside, label: "Comment on the issue: Allow", in: public }
  - id: refused
    kind: code
    op: do
    cleans: true
    label: "Say write access is needed"
    in: public
    description: >-
      The new comment says the build label must be added by someone with write access. It uses fixed
      text and links the run.
  - id: keep
    kind: code
    op: sort
    cleans: true
    label: "Keep only what's approved"
    in: public
    description: >-
      Keep the issue's text only if it is unedited since the build label was last added. Keep comments
      of people with admin, maintain or write permission on the repository, checked by each author's
      collaborator permission. Never include a member who can only read. Of the app's own comments,
      keep only the fixer's referrals, identified by the fixed text they open with. They must predate
      the last label addition and be unedited since. A rebuild reads the referral beside its answer,
      never the app's status notes or the Claude text they quote (#204). The label approves the issue
      as the maintainer saw it. Read the issue and its people's comments as GitHub renders them, using
      bodyHTML from GraphQL. Never read the Markdown behind them. HTML comments and other text the
      page hides never reach Claude (#150).
  - { id: bring, kind: code, op: bring-in, label: "Approved text and comments", in: public }
  - id: asked
    kind: context
    label: "The approved issue and comments"
    in: public
    description: >-
      Decided in #160's follow-up: draft from the issue's current text only if it is unedited since
      the build label was last added. Compare the issue's last edit with the label event. An edited
      issue waits for a person to add the label again (awml #120).
  - id: repo
    kind: context
    label: "Main's spec, guide, code and rules"
    in: public
    description: >-
      The rules are AGENTS.md and REVIEW.md.
  - id: build
    kind: ai
    op: draft
    label: "Write the change and its pictures"
    in: public
    description: >-
      Write the change test first. Redraw the examples it alters. Picture only changes to what a
      drawing or page shows, before and after. Leave out a picture that looks the same before and
      after. Use a moving image only for something that moves. In the GitHub Actions implementation,
      Claude Code holds the maintainer's login token for its own calls. It strips that token and every
      other credential from commands it runs. Commands, including tests, run in its sandbox. The job
      runs nothing of its own beside the secret (awml #121, #160). In the GitHub Actions
      implementation, read is limited to the workspace and the session's own input folder.
      Read(//proc/**) is denied. Edit, which covers writing a file, is denied on .git/**. Git after
      the session uses core.hooksPath=/dev/null and core.fsmonitor=false (#160).
  - id: patch
    kind: context
    label: "The draft change"
    in: public
    description: >-
      In the GitHub Actions implementation, the patch is an artifact within this run only. The job
      split keeps the app's token away from the change's code. The draft job gives its sha256 as an
      output and the open job checks it. Scan everything the session wrote for a token before upload.
      Upload with retention-days: 30, so an offered draft can be downloaded for 30 days (#160 rule 6).
  - id: guard
    kind: code
    op: sort
    label: "Does the draft touch the factory's own files?"
    in: public
    description: >-
      Use git alone. Decided in #160's follow-up: the build works as the fixer does. Never push a
      draft touching .github/ or Claude Code's own settings: .claude/, .mcp.json or a CLAUDE.md. Offer
      it in a new comment and stop, since nothing is pushed for CI to judge. No session loads settings
      or servers from the tree.
  - id: offer
    kind: code
    op: do
    cleans: true
    label: "Offer the draft's download and apply commands"
    in: public
    description: >-
      The new comment uses fixed text and quotes none of the draft. It gives gh run download <run> -n
      change, the git apply command and the artifact's 30-day lifetime.
  - { id: offered, kind: outside, label: "Comment on the issue with the commands: Allow", in: public }
  - { id: push, kind: code, op: do, label: "Push the branch and its pictures", in: public }
  - id: standing
    kind: approval
    label: "The maintainer's standing approval: pushes to the issue's own branch"
    in: public
    description: >-
      The maintainer accepted this standing approval in #160 under rule 4. It covers only builds
      started by the label. Automatic rebuilds were removed in #212.
  - { id: branch, kind: outside, label: "Push the issue's branch and its pictures: Ask", in: public }
  - id: open
    kind: code
    op: do
    label: "Open or update the pull request"
    in: public
    description: >-
      The pull request says Closes #n. Its description starts with Claude's escaped note. Then it
      gives what changed, decisions the issue did not settle, pictures and Closes #n. It carries no
      record line or digests. Nothing reads it back (#160). Reuse the branch, so a new try's push
      updates the open pull request's commits. Give an existing pull request this try's title and
      description before the push starts CI. Reviews judge the new commit against what it says, and a
      squash keeps the new title. No earlier pull request needs closing (#160's follow-up).
  - id: standingpr
    kind: approval
    label: "The maintainer's standing approval: one open pull request for each issue"
    in: public
    description: >-
      The maintainer accepted this standing approval in #160 under rule 4.
  - { id: pr, kind: outside, label: "Open the pull request: Ask", in: public }
  - { id: stopped, kind: code, op: do, cleans: true, label: "Say the build stopped before opening a pull request", in: public,
      description: "The new comment uses fixed text and links the run." }
  - { id: stopnote, kind: outside, label: "Comment on the issue: Allow", in: public }
  - id: listed
    kind: surface
    label: "The repository's branches and pull requests"
    in: public
    description: >-
      Each push is listed with its commit.
  - { id: label, kind: comment, label: "A stranger's comment starts nothing: the build label counts only when GitHub's record says its last adder has write access, by their permission, or is the app's bot, since someone with triage can add a label too. The start job checks, saying so on the issue if not, and the draft checks again. The draft step's token can only read, so it can't push (awml #26)" }
  - { id: nochecks, kind: comment, label: "The build runs no checks of its own. It pushes and opens the pull request, CI judges it, and the fixer wakes for failed tests or Important review findings, fixing that pull request within its two-commit cap (awml#212)" }
  - { id: silent, kind: comment, label: "A draft or open job that fails leaves no pull request, so CI never runs and the fixer never wakes. A last job says so on the issue, so the build never stops unseen" }
lines:
  - { from: comment, to: who, kind: start, label: "the label" }
  - { from: who, to: approve, kind: start, label: "[build]" }
  - { from: thread, to: approve, kind: data, label: "the issue" }
  - { from: approve, to: still, kind: start, label: "[yes]" }
  - { from: thread, to: still, kind: data, label: "the build label's last adder" }
  - { from: still, to: started, kind: start, label: "[added with write access]" }
  - { from: started, to: startnote, kind: data }
  - { from: still, to: refused, kind: start, label: "[added without write access]" }
  - { from: refused, to: startnote, kind: data, label: "write access required, with the run link" }
  - { from: startnote, to: token, kind: data }
  - { from: started, to: keep, kind: start }
  - { from: thread, to: keep, kind: data, label: "the issue's text and comments" }
  - { from: keep, to: bring, kind: start, label: "the approved text and its people's comments" }
  - { from: bring, to: asked, kind: data, label: "the approved issue text and comments" }
  - { from: bring, to: build, kind: start }
  - { from: asked, to: build, kind: data }
  - { from: repo, to: build, kind: data }
  - { from: build, to: patch, kind: data, label: "the patch, pictures, Claude's note and pull request description" }
  - { from: build, to: guard, kind: start, label: "the change" }
  - { from: patch, to: guard, kind: data }
  - { from: guard, to: offer, kind: start, label: "[touches .github/ or Claude's files]" }
  - { from: offer, to: offered, kind: data, label: "download and apply commands, with the 30-day lifetime" }
  - { from: offered, to: token, kind: data }
  - { from: guard, to: push, kind: start, label: "[touches neither]" }
  - { from: patch, to: push, kind: data, label: "the branch and its pictures" }
  - { from: push, to: standing, kind: start }
  - { from: standing, to: branch, kind: data, label: "[within limits]" }
  - { from: branch, to: app, kind: data }
  - { from: standing, to: listed, kind: data, label: "each push, as made" }
  - { from: push, to: open, kind: start, label: "[pushed]" }
  - { from: patch, to: open, kind: data, label: "the description" }
  - { from: open, to: standingpr, kind: start }
  - { from: standingpr, to: pr, kind: data, label: "[within limits]" }
  - { from: pr, to: app, kind: data }
  - { from: standingpr, to: listed, kind: data, label: "each pull request, as opened" }
  - { from: build, to: stopped, kind: start, label: "[the draft failed]" }
  - { from: push, to: stopped, kind: start, label: "[the push or the pull request failed]" }
  - { from: stopped, to: stopnote, kind: data, label: "build stopped before a pull request, with the run link" }
  - { from: stopnote, to: token, kind: data }
  - { from: label, to: comment, kind: tie }
  - { from: label, to: refused, kind: tie }
  - { from: nochecks, to: push, kind: tie }
  - { from: silent, to: stopped, kind: tie }
implementations:
  actions:
    label: "GitHub Actions, build.yml"
    blocks:
      - { id: github, label: "GitHub: issues, branches and pull requests", parts: [comment, thread, who, approve, token, app, repo, startnote, offered, stopnote, standing, branch, standingpr, pr, listed] }
      - { id: startjob, label: "Actions job: post the start comment, checking out nothing and running only gh", platform: actions-code, parts: [still, started, refused] }
      - { id: draftjob, label: "Actions job: draft, with a read-only token", platform: actions-code, parts: [keep, bring, asked] }
      - { id: agentjob, label: "Claude Code, claude-opus-5-5, on the maintainer's subscription", platform: actions-agent, in: draftjob, parts: [build] }
      - { id: stoppedjob, label: "Actions job: say the build stopped, checking out nothing and running only gh", platform: actions-code, parts: [stopped] }
      - { id: openjob, label: "Actions job: push and open, running nothing from the change", platform: actions-code, parts: [patch, guard, offer, push, open] }
