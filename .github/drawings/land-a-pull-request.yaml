# A factory pull request lands once CI has judged its head commit. GitHub starts this when CI's
# pull_request run finishes on a build/issue-* branch. People merge their own pull requests. It reads everything from GitHub and git at that moment: the head
# commit's checks, the reviews' findings and Classify's verdict among them, the branch's commits
# since main, and the build rule run on that commit. The rule can only move Classify's verdict
# towards ask. Ship merges, pinned to the commit judged. Show merges the same way, then tells the
# person who added the label what to look at. Ask requests their review and doesn't merge: they
# merge from their own account, which is their yes. Nothing sets a pull request to merge by itself
# later, and main's own rule holds every merge until CI has passed.
awml: "0.11"
title: A pull request lands once CI has run
description: |
  The factory's landing: when CI finishes on a factory branch, a code rule reads the head commit's
  checks and the commit itself, and ships, shows or asks.
scopes:
  - { id: public, label: "public: anyone who reads the repository", processing: any }
parts:
  - id: cidone
    kind: trigger
    label: "CI finishes on a factory branch"
    wait: PT1H
    description: >-
      Decided in #160's follow-up: handle only build/issue-* branches of this repository and only
      pull_request runs, which run once per commit. People merge their own pull requests.
  - { id: token, kind: connector, label: "The repository's Actions token", in: public, ref: issue-to-pull-request.yaml#token }
  - { id: app, kind: connector, label: "The repository's GitHub App", in: public, ref: issue-to-pull-request.yaml#app }
  - id: checks
    kind: context
    label: "Reviews and classification on the head commit"
    in: public
    ref: ci-a-commit.yaml#checks
    description: >-
      The review jobs' checks are Bug review, Security review and Classify. They carry both reviews'
      findings and Classify's verdict.
  - id: tested
    kind: context
    label: "Test checks on the head commit"
    in: public
    ref: ci-a-commit.yaml#tested
    untrusted: true
    description: >-
      The test jobs' checks are test (1.22) and test (stable). They carry the output of the change's
      own code.
  - id: commits
    kind: context
    label: "The head and commits since main"
    in: public
    untrusted: true
    description: >-
      Read the pull request's head commit and the branch's commits since main from git. The commits
      and test checks carry text the change's own code can steer. Only the rule's outcome and its own
      fixed reasons pass on. Link Classify's reasons and never quote them.
  - id: rules
    kind: context
    label: "Main's build rule"
    in: public
    description: >-
      Derive permission to merge from the head commit's checks and the build rule run on that commit,
      read when CI finishes. Read no record line, digest or artifact from the build (#160 rules 2 and
      3).
  - id: ready
    kind: code
    op: sort
    label: "Do the head's required checks pass?"
    in: public
    description: >-
      Use GitHub's record to check that the pull request is open and its head is still CI's commit.
      Every required check must have finished and passed, with both reviews done. Find who last added
      the issue's build label and whether it is still on. Exit quietly if a required check failed or
      is unfinished, or the head moved. Failed tests and Important review findings go to the fixer. It
      posts a new comment if it gives up after two fix commits (awml#212).
  - id: judge
    kind: code
    op: sort
    cleans: true
    label: "Does the rule say ship, show or ask?"
    in: public
    description: >-
      Apply the rule to Classify's verdict. Only the commit's sha, the outcome, the labeller's login
      and the rule's own reasons from fixed text pass on. The rule moves a verdict only towards ask.
      Ask follows from the rule's tests on paths, size, binaries and symlinks, any commit since main
      that is not the factory's, or Classify saying ask. A fix commit on the branch or Nits left
      unfixed means at least show (#160). The maintainer decided that ship and show merge without a
      person once both reviews finish and Classify says ship or show. This rule step cleans the
      reviews' and Classify's text before the merge. GitHub's label record shows whether the build
      label was taken off the issue. If it was, a person stepped in. Ask instead of shipping or
      showing, saying the build label was taken off the issue, so a person decides. Ask whoever last
      added the label if they can write, otherwise the owner. In the GitHub Actions implementation,
      the rule judges the head commit itself, read with git into a worktree at its merge-base with main. It never reads a patch from an artifact. A missing Classify check means ask. These pass to
      the land job as job outputs (#153).
  - id: ship
    kind: code
    op: do
    label: "Merge the change as shipped"
    in: public
    description: >-
      Merge now, pinned with --match-head-commit to the commit judged. The merge message says it
      shipped.
  - id: showmerge
    kind: code
    op: do
    label: "Merge the change as shown"
    in: public
    description: >-
      Merge now, pinned with --match-head-commit to the commit judged. The merge message says it is
      shown.
  - { id: mainauto, kind: outside, label: "Merge a change the rule passes into main: Allow", in: public }
  - id: show
    kind: code
    op: do
    label: "Tell the labeller what to look at"
    in: public
    description: >-
      Make a new comment for the person who added the label because a person must act. Say what to
      look at, using the rule's reasons and a link to Classify's check. Escape < in any text, break
      mentions and cap its length (#160 rule 5).
  - { id: showout, kind: outside, label: "Comment on the merged pull request: Allow", in: public }
  - id: ask
    kind: code
    op: do
    label: "Ask for the labeller's review"
    in: public
    description: >-
      Give the person who added the label the rule's reasons and a link to Classify's check. Do not
      merge.
  - { id: askout, kind: outside, label: "Request a review, in a new comment: Allow", in: public }
  - id: person
    kind: person
    op: do
    label: "Review and merge the pull request"
    in: public
    description: >-
      Review the pull request, whose CI passed, then merge it.
  - { id: account, kind: connector, label: "The reviewer's repository account", in: public }
  - id: main
    kind: outside
    label: "Merge a change that was asked about into main: Ask"
    in: public
    description: >-
      Main's rule holds every merge, the app's and the maintainer's, until CI passes. Only the
      maintainer can skip it to push a release. The app cannot.
  - { id: afterci, kind: comment, label: "GitHub starts land.yml on workflow_run when CI finishes on a factory branch. It runs main's code, never checks out the branch, and reads the commit with git as data. Its reading job has no concurrency group, since a stranger's pull request from the same branch starts a run too, and GitHub keeps only one run waiting in a group, so a newer one would displace the real one's; each run only reads GitHub, afresh, and leaves quietly when there's nothing to do. Its landing job's group is keyed on the pull request and never cancelled, so nothing stops it between the merge and its comment (#153)" }
  - { id: pinned, kind: comment, label: "The merge names the commit it judged, so GitHub refuses it if anyone pushed since. No auto-merge anywhere in the factory, so nothing set for an older commit can carry over to a new one (#153, #160)" }
  - { id: terms, kind: comment, label: "Allow, because a merge is undone with git revert, everything in it is already public on its branch, and the maintainer would not be surprised by a change the rule ships or shows. One the rule asks about is where they would be, so that merge is Ask" }
lines:
  - { from: cidone, to: ready, kind: start, label: "CI's run and its commit" }
  - { from: token, to: ready, kind: data, label: "the pull request, its head and the issue's label events" }
  - { from: checks, to: ready, kind: data }
  - { from: tested, to: ready, kind: data }
  - { from: ready, to: judge, kind: start, label: "[open, at CI's commit, every required check passed]" }
  - { from: checks, to: judge, kind: data }
  - { from: commits, to: judge, kind: data }
  - { from: rules, to: judge, kind: data }
  - { from: judge, to: ship, kind: start, label: "[ship]" }
  - { from: ship, to: mainauto, kind: data }
  - { from: judge, to: showmerge, kind: start, label: "[show]" }
  - { from: showmerge, to: mainauto, kind: data }
  - { from: mainauto, to: app, kind: data }
  - { from: showmerge, to: show, kind: start, label: "[merged]" }
  - { from: show, to: showout, kind: data }
  - { from: showout, to: token, kind: data }
  - { from: judge, to: ask, kind: start, label: "[ask]" }
  - { from: ask, to: askout, kind: data }
  - { from: askout, to: token, kind: data }
  - { from: ask, to: person, kind: start, label: "the review request" }
  - { from: account, to: person, kind: data, label: "the pull request and CI's result" }
  - { from: person, to: main, kind: data }
  - { from: main, to: account, kind: data }
  - { from: afterci, to: cidone, kind: tie }
  - { from: pinned, to: ship, kind: tie }
  - { from: terms, to: mainauto, kind: tie }
implementations:
  actions:
    label: "GitHub Actions, land.yml"
    blocks:
      - { id: github, label: "GitHub: pull requests, checks, and main's rule", parts: [cidone, token, app, checks, tested, commits, mainauto, showout, askout, account, main] }
      - { id: findjob, label: "land.yml: read the checks and the commit and apply the rule, with a token that only reads", platform: actions-code, parts: [ready, rules, judge] }
      - { id: landjob, label: "land.yml: ship, show or ask, running nothing from the change", platform: actions-code, parts: [ship, showmerge, show, ask] }
      - { id: browser, label: "The reviewer's browser", parts: [person] }
    comments:
      - { id: scoped, label: "The app's token is minted in the land job only, scoped to this repository (#153)", in: landjob, ties: [ship, showmerge] }
