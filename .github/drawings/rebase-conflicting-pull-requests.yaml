# A pull request that conflicts with main is rebased onto it. The repository is public, so
# everything sits in one scope: anyone may read the pull requests and their branches. What matters
# is who may act. Only branches in the repository itself, opened by its own people or by the build
# workflow, are touched. A plain git rebase comes first, and a clean one is pushed straight away.
# Only a real conflict starts a Claude session, which resolves it with a read-only token and hands
# back the rebased branch. The app replaces the branch only if nobody has pushed to it meanwhile, and runs no checks of its
# own: its push starts CI, which judges the rebased commit as it judges every push. When it ends, one
# comment on the pull request says what was resolved, or why it couldn't be.
#
# The actions implementation runs it on GitHub Actions. Finding the conflicting pull requests runs
# in one job, with the plain git rebase, and Claude resolves a conflict in a second. The push and the comment run in a third job on a fresh
# runner, which shares none of the second's access and runs nothing from the branch.
awml: "0.11"
title: A pull request that conflicts with main is rebased onto it
description: |
  The factory's rebase: when main moves, each of its own people's pull requests that now conflicts
  is rebased by git, or by a Claude session where git finds a real conflict, and pushed by the app.
  CI judges the result.
scopes:
  - { id: public, label: "public: anyone who reads the repository", processing: any }
parts:
  - { id: landed, kind: trigger, label: "A commit lands on main", wait: PT1H }
  - { id: token, kind: connector, label: "The repository's Actions token", in: public, ref: issue-to-pull-request.yaml#token }
  - id: app
    kind: connector
    label: "The repository's GitHub App"
    in: public
    ref: issue-to-pull-request.yaml#app
    description: >-
      GitHub starts CI from the app's push, but not from the Actions token's. CI runs on the rebased
      branch and shows on the pull request. Only the push step receives the app's secret key.
  - id: find
    kind: code
    op: bring-in
    label: "Conflicting pull requests"
    in: public
    description: >-
      Find open pull requests that GitHub flags as conflicting with main.
  - id: whose
    kind: code
    op: sort
    label: "Is this a repository branch opened by a writer or the app?"
    in: public
    description: >-
      The branch must be in this repository and its opener must be one of its own people or the build
      workflow. Never touch a fork's pull request or one a stranger opened. Every commit Claude reads
      was pushed by the repository's own people. Their text can still steer the session. It reaches
      one push to their own branch, which CI then judges.
  - id: repo
    kind: context
    label: "The branch's commits and main"
    in: public
    untrusted: true
    description: >-
      Read both from git.
  - id: plain
    kind: code
    op: other
    label: "Rebase with git alone"
    in: public
    description: >-
      Rebase onto main with hooks and fsmonitor off. Run nothing from the branch. The maintainer
      decided to make this as quick as possible. Push a clean git rebase without a Claude session.
      Start Claude only for a real conflict. CI's reviews still run on the pushed commit, since a
      resolution is new code.
  - id: prompt
    kind: context
    label: "Main's rebase prompt and AGENTS.md"
    in: public
    description: >-
      Copy both out before the session starts.
  - id: rebase
    kind: ai
    op: draft
    label: "Resolve both sides of each conflict"
    in: public
    description: >-
      Resolve the rebase's conflicts and keep both sides of each. In the GitHub Actions
      implementation, Claude Code runs commands only in its sandbox and keeps the login token from
      them. It loads no settings or servers from the branch. The job runs nothing of its own beside
      the secret (awml #121, #160). In the GitHub Actions implementation, read is limited to the
      workspace and the session's own input folder. Read(//proc/**) is denied. Edit, which covers
      writing a file, is denied on .git/**. Git after the session uses core.hooksPath=/dev/null and
      core.fsmonitor=false (#160).
  - id: bundle
    kind: context
    label: "The rebased branch bundle"
    in: public
    description: >-
      In the GitHub Actions implementation, the bundle is an artifact within this run only. The job
      split keeps the app's token away from the branch. The job that rebased gives its sha256 as an
      output and the push job checks it. Before upload, scan for a token in the added lines and the
      commits' messages, authors and committers (#160 rule 6).
  - id: guard
    kind: code
    op: sort
    label: "Is the rebase clean and within the permitted files?"
    in: public
    description: >-
      Use git alone and run nothing from the branch. Require a branch based on main, no conflict
      markers and no change to .github/ or Claude Code's own files. Decided in #160's follow-up:
      remove the check job but keep its cheap git-only guards in the push job. They run none of the
      branch's code and catch a session that pushed something other than a rebase.
  - id: push
    kind: code
    op: do
    label: "Push the rebased branch"
    in: public
    description: >-
      Use --force-with-lease at the commit the find step saw. GitHub refuses the push if anyone pushed
      meanwhile. The draft step's token only reads, so it cannot push (awml #26).
  - id: standing
    kind: approval
    label: "The maintainer's standing approval: one force push per conflicting branch"
    in: public
    description: >-
      The maintainer accepted this standing approval in #160 under rule 4. It covers one force push of
      a rebase onto main to each of the repository's own people's conflicting branches, after a push
      to main. The branch's commits can steer the session. The old commit stays on GitHub and the
      comment names it. One push can therefore put the branch back.
  - id: replace
    kind: outside
    label: "Replace the pull request's branch: Ask"
    in: public
    description: >-
      The check job is gone. The rebase pushes and leaves judgement to CI on the pushed commit. A bad
      push costs a CI run (#160 rule 4).
  - id: tell
    kind: code
    op: do
    cleans: true
    label: "Post the rebase's final result"
    in: public
    description: >-
      One new comment at the end notifies, saying whether the rebase was pushed or why it was not.
      Fixed text links the old and new commits. Every comment is an outside action, so escape < in
      Claude's note, break mentions and cap its length. Never edit a status comment along the way or
      leave a marker for a later run (#160 rule 5).
  - id: thread
    kind: surface
    label: "The pull request's commits and thread"
    in: public
    description: >-
      Each push is listed.
  - { id: told, kind: outside, label: "Comment on the pull request: Allow", in: public }
lines:
  - { from: landed, to: find, kind: start, label: "the push" }
  - { from: token, to: find, kind: data, label: "open pull requests and GitHub's conflict flag" }
  - { from: find, to: whose, kind: start, label: "[for each that conflicts]" }
  - { from: whose, to: plain, kind: start, label: "[the repository's own]" }
  - { from: repo, to: plain, kind: data }
  - { from: plain, to: bundle, kind: data, label: "[clean]" }
  - { from: plain, to: guard, kind: start, label: "[clean]" }
  - { from: plain, to: rebase, kind: start, label: "[a real conflict]" }
  - { from: repo, to: rebase, kind: data }
  - { from: prompt, to: rebase, kind: data }
  - { from: rebase, to: bundle, kind: data, label: "the rebased branch bundle" }
  - { from: rebase, to: guard, kind: start, label: "the rebased branch" }
  - { from: bundle, to: guard, kind: data }
  - { from: guard, to: push, kind: start, label: "[a clean rebase]" }
  - { from: bundle, to: push, kind: data, label: "the rebased branch" }
  - { from: push, to: standing, kind: start }
  - { from: standing, to: replace, kind: data, label: "[within limits]" }
  - { from: standing, to: thread, kind: data, label: "each push, as made" }
  - { from: replace, to: app, kind: data }
  - { from: push, to: tell, kind: start, label: "[pushed or refused]" }
  - { from: guard, to: tell, kind: start, label: "[not a clean rebase]" }
  - { from: rebase, to: tell, kind: start, label: "[gave up]" }
  - { from: tell, to: told, kind: data, label: "the result, commit links and Claude's note" }
  - { from: told, to: token, kind: data }
implementations:
  actions:
    label: "GitHub Actions, resolve.yml"
    blocks:
      - { id: github, label: "GitHub: pull requests, branches, comments", parts: [landed, token, app, repo, standing, replace, thread, told] }
      - { id: findjob, label: "Actions job: find and rebase with git, with a read-only token", platform: actions-code, parts: [find, whose, plain] }
      - { id: draftjob, label: "Actions job: resolve a conflict, with a read-only token", platform: actions-code, parts: [prompt] }
      - { id: agentjob, label: "Claude Code, claude-sonnet-5-5, on the maintainer's subscription", platform: actions-agent, in: draftjob, parts: [rebase] }
      - { id: pushjob, label: "Actions job: guard, push and comment, running nothing from the branch", platform: actions-code, parts: [bundle, guard, push, tell] }
