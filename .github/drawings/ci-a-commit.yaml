# Every pull request into main is checked each time it's opened or pushed to, and every commit
# that lands on main is checked, so each commit has one CI run. A pull request from a branch of this
# repository, opened by its own people or the app, is also reviewed, as jobs of the same run. The tests run on the
# oldest Go that go.mod allows and on the newest. Beside them, three fresh Claude sessions read the
# pull request's patch against main, one reviewing it for bugs and one for security. On a factory
# branch, once both reviews have passed, a third session classifies the change: ship, show or ask.
# None of them runs any of the change's code. Each job's result is its check on the commit, so the
# commit as pushed has one judge, and every other workflow reads that judge's verdict from GitHub.
# A fork's pull request, or one a stranger opened, gets no review: its review jobs fail at a gate
# that holds no secret, so a person reviews and merges it, and a hand merge never sees green
# reviews that didn't run, as it would if they were skipped.
awml: "0.11"
title: A commit is checked
description: |
  CI for the factory: the tests, Bug review and Security review side by side, then Classify on a
  factory branch, all on the commit as pushed. Their checks on the commit are what landing and
  fixing read.
scopes:
  - { id: public, label: "public: anyone who reads the repository", processing: any }
parts:
  - id: pushed
    kind: trigger
    label: "A pull request opens or changes, or main receives a commit"
    wait: PT1H
    description: >-
      Decided in #160's follow-up: CI runs on pull_request for every branch but main, when a pull
      request opens or receives a push. Push events start CI only for main. Each commit has one run.
      The build pushes before it opens its pull request, so CI first runs when it opens.
  - { id: token, kind: connector, label: "The repository's Actions token", in: public, ref: issue-to-pull-request.yaml#token }
  - id: commit
    kind: context
    label: "The pushed commit and pull request"
    in: public
    untrusted: true
    description: >-
      This is the commit as pushed, with its pull request's title and description if it has one.
  - id: tests
    kind: code
    op: check
    label: "Do the tests pass on the oldest and newest Go?"
    in: public
    description: >-
      Run tests, vet, the examples and wasm parity on Go 1.22 and on the newest Go.
  - id: record
    kind: code
    op: do
    label: "Post each test job's result"
    in: public
    description: >-
      Each result becomes the job's check on the commit.
  - id: whose
    kind: code
    op: sort
    cleans: true
    label: "Is this a repository branch opened by a writer or the app?"
    in: public
    description: >-
      The gate holds no secret. It requires a pull_request run from a branch of this repository,
      opened by someone with write access or the app. Otherwise the review fails here. Past it,
      sessions read only trusted people's and models' text. A push to main runs only the tests.
  - id: bring
    kind: code
    op: bring-in
    label: "The patch and binary file list"
    in: public
    description: >-
      Read the patch against main as data. Write the list of changed binary files to the job's own
      file, which the prompts point at. Text in the patch or description cannot forge it (#153).
  - id: patch
    kind: context
    label: "The patch on its base"
    in: public
    description: >-
      The patch is applied to the commit of main the branch starts from. It is made read-only and
      includes the binary file list.
  - id: repo
    kind: context
    label: "Main's review prompts and rules"
    in: public
    description: >-
      The rules are AGENTS.md and REVIEW.md. Copy out main's prompts and rules before any session
      starts, so the patch cannot rewrite what it is held to. GitHub runs the pull request's own
      ci.yml. Someone with write access can change how their pull request is reviewed. They are
      trusted, and the app never pushes .github/ (#160).
  - id: review
    kind: ai
    op: check
    label: "Any bugs that survive a second look?"
    in: public
    description: >-
      Use fresh context. Keep only findings that survive a second look.
  - { id: secreview, kind: ai, op: check, label: "Are there any security flaws?", in: public }
  - id: post
    kind: code
    op: do
    label: "Post the review's result"
    in: public
    description: >-
      Once a review is done, its findings become the job's own check on the commit. An Important
      finding fails it. Before posting a session's text, escape <, break mentions and cap its length.
      Refuse text containing anything like a token. It carries no marker for a workflow to parse (#160
      rule 5).
  - id: classify
    kind: ai
    op: sort
    label: "How risky is the change?"
    in: public
    description: >-
      Classify moved here from the build. Landing reads its verdict from a check on the commit instead
      of the build's artifact. Its check always passes, so its verdict never wakes the fixer. Classify
      runs only for the app's pull request from a factory branch, once both gated reviews passed. It
      therefore needs no gate of its own (#160).
  - id: postclass
    kind: code
    op: do
    label: "Post Classify's verdict and reasons"
    in: public
    description: >-
      The job's own check always passes.
  - id: checks
    kind: context
    label: "Reviews and classification on the head commit"
    in: public
    description: >-
      The review jobs' checks are Bug review, Security review and Classify. They carry both reviews'
      findings and Classify's verdict.
  - id: tested
    kind: context
    label: "Test checks on the head commit"
    in: public
    untrusted: true
    description: >-
      The test jobs' checks are test (1.22) and test (stable). They carry the output of the change's
      own code.
  - { id: onejudge, kind: comment, label: "One judge: these checks on the commit as pushed. Nothing merges without the tests and both reviews passing on the head commit, and land and fix read only these, never a record a workflow passed on (#160 rules 1 and 2)" }
  - { id: forks, kind: comment, label: "A fork's pull request, or one a stranger opened between two branches here, gets no review: its author could steer the sessions, which hold the maintainer's login token. Its review jobs still run, and fail at the gate before any secret is given, since GitHub counts a skipped required check as passed. The test jobs hold no secret and a token that only reads. Keeping the check on who opened it was agreed in #160's follow-up" }
  - { id: norun, kind: comment, label: "The sessions read the patch as data and run none of the change's code. No job that holds the Claude token runs tests, make or go run, since the runner has sudo and its memory holds the job's secrets (#160)" }
  - { id: findings, kind: comment, label: "The reviews' findings and Classify's verdict are trusted because of the gate: past it, the sessions read only the patch and text of someone with write access or the app. A fork's or a stranger's pull request gets no review and so no findings. The test jobs' checks carry the output of the change's own code, a fork's too, so they stay untrusted" }
lines:
  - { from: pushed, to: tests, kind: start, label: "the commit" }
  - { from: pushed, to: whose, kind: start, label: "the commit" }
  - { from: commit, to: tests, kind: data, label: "the commit's code" }
  - { from: tests, to: record, kind: start, label: "[pass or fail]" }
  - { from: record, to: tested, kind: data, label: "each test job's result" }
  - { from: whose, to: bring, kind: start, label: "[opened by someone with write access or the app]" }
  - { from: token, to: bring, kind: data, label: "the patch and the pull request's text" }
  - { from: commit, to: whose, kind: data, label: "who opened it, and its patch" }
  - { from: bring, to: patch, kind: data, label: "the patch applied to its base, with the binary file list" }
  - { from: bring, to: review, kind: start }
  - { from: bring, to: secreview, kind: start }
  - { from: patch, to: review, kind: data }
  - { from: repo, to: review, kind: data }
  - { from: patch, to: secreview, kind: data }
  - { from: repo, to: secreview, kind: data }
  - { from: review, to: post, kind: start, label: "its findings" }
  - { from: secreview, to: post, kind: start, label: "its findings" }
  - { from: post, to: checks, kind: data, label: "the review's findings and result" }
  - { from: post, to: classify, kind: start, label: "[both reviews passed, on the app's pull request from a factory branch]" }
  - { from: patch, to: classify, kind: data, label: "the patch" }
  - { from: repo, to: classify, kind: data }
  - { from: checks, to: classify, kind: data, label: "both reviews' findings" }
  - { from: classify, to: postclass, kind: start, label: "ship, show or ask, with its reasons" }
  - { from: postclass, to: checks, kind: data, label: "Classify's verdict and reasons" }
  - { from: onejudge, to: checks, kind: tie }
  - { from: forks, to: tests, kind: tie }
  - { from: norun, to: review, kind: tie }
  - { from: findings, to: checks, kind: tie }
  - { from: findings, to: tested, kind: tie }
implementations:
  actions:
    label: "GitHub Actions, ci.yml"
    blocks:
      - { id: github, label: "GitHub: commits, pull requests and checks", parts: [pushed, token, commit, record, checks, tested] }
      - { id: testjob, label: "Actions jobs test (1.22) and test (stable): run the commit's code, with no secret and a token that only reads", platform: actions-code, parts: [tests] }
      - { id: reviewjob, label: "Actions jobs Bug review, Security review and Classify, one session each, with a token that only reads, running nothing from the change", platform: actions-code, parts: [whose, bring, patch, repo, post, postclass] }
      - { id: agent, label: "Claude Code, claude-opus-5-5, on the maintainer's subscription, a fresh session in each job", platform: actions-agent, in: reviewjob, parts: [review, secreview, classify] }
    comments:
      - { id: apart, label: "Each session has its own empty home folder and output folder, reads inputs made read-only, runs in --permission-mode default with one Edit(//dir/file.json) rule for its own findings, and has no Bash (#153, #160)", in: agent, ties: [review, secreview, classify] }
      - { id: reads, label: "Read is limited to the workspace and the session's own input folder, with Read(//proc/**) denied, and Edit, which covers writing a file, is denied on .git/**. Each session keeps the login token from its commands (awml #121)", in: agent, ties: [review, secreview, classify] }
      - { id: ownjob, label: "Each job's own check carries its result and its summary, so no job needs a token that writes checks, and nothing passes between jobs: no artifact here (#160 rule 6)", in: reviewjob, ties: [post, postclass] }
