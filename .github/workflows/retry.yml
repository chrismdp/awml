# When CI's tests fail on a build's pull request, this starts the build again for the branch's
# issue, up to three builds since the label was last added. It reads only GitHub: the CI run that
# woke it, the build runs named for the issue, the label's events and the issue's last edit. It
# hands the build nothing but the issue's number, and the build reads why the last try failed from
# CI itself. Once a commit on the branch isn't the factory's, a person has taken the branch over:
# it's never built over again, and a new comment on the issue says so. Otherwise, after three builds,
# or if the issue was edited since the label went on, a new comment on the issue says a person must
# act. Each is said once, on the first failure of CI's tests since it came to hold, never a re-run.
# Drawn in .github/drawings/retry-a-build.yaml
name: Retry a build

# On workflow_run GitHub runs main's copy of this, whatever the branch holds. It checks out nothing
# and runs only gh. The Actions token starts the build, since build.yml takes a dispatch from it,
# and comments.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ["build/issue-*"]

jobs:
  # Decides, reading only GitHub, what this CI run means for its issue. It takes no turns in a
  # concurrency group: a stranger's pull request from the same branch starts CI, and so this
  # workflow, too, and GitHub keeps only one run waiting in a group, so a newer one would displace
  # the real one's. A stranger's run leaves here, quietly.
  retry:
    # A first sift on the event's text. The tries step reads the run back from the API before it
    # trusts any of it.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      decision: ${{ steps.tries.outputs.decision }}
      issue: ${{ steps.tries.outputs.issue }}
    steps:
      # Only pull_request runs count, which run once per commit, and only from a branch of this
      # repository, since a fork's branch can carry a build's name. The tests own a run where both
      # they and a review failed. The run must be at the branch's head, or a newer run decides. A try
      # is a build.yml run for the issue, by its name, started since the build label was last added.
      # It passes on only the issue's number and a decision.
      - name: "Sort by GitHub's record: is the run at the branch's head, is the issue unedited since the label, and how many builds have run since?"
        id: tries
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN: ${{ github.event.workflow_run.id }}
        run: |
          leave() { echo "$1"; echo "decision=none" >> "$GITHUB_OUTPUT"; exit 0; }
          case "$CI_RUN" in ''|*[!0-9]*) echo "CI's run isn't a number: $CI_RUN"; exit 1 ;; esac
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN")"
          jq -e --arg repository "$GITHUB_REPOSITORY" '.path == ".github/workflows/ci.yml" and
              .event == "pull_request" and .status == "completed" and
              .head_repository.full_name == $repository' <<< "$run" > /dev/null ||
            leave "Run $CI_RUN isn't CI's finished run on a pull request from this repository."
          head_sha="$(jq -r .head_sha <<< "$run")"
          branch="$(jq -r .head_branch <<< "$run")"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || leave "CI's commit isn't a commit id."
          [[ "$branch" =~ ^build/issue-[0-9]+$ ]] || leave "This isn't a build's branch."
          issue="${branch#build/issue-}"
          # A stranger may open a pull request of their own from the build's branch, so CI's run must
          # be for the app's own, by the run's own list of pull requests.
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=$GITHUB_REPOSITORY_OWNER:$branch&base=main&state=open" |
            jq -r --arg repository "$GITHUB_REPOSITORY" '[.[] | select(.user.login == "awml-factory[bot]" and .user.type == "Bot" and
              .head.repo.full_name == $repository) | .number] | first // empty')"
          case "$pr" in
            '') leave "No open pull request of the app's is on $branch." ;;
            *[!0-9]*) echo "The pull request's number isn't a number: $pr"; exit 1 ;;
          esac
          jq -e --argjson pr "$pr" '[.pull_requests[]?.number] | index($pr) != null' <<< "$run" > /dev/null ||
            leave "CI's run isn't for the app's #$pr, so it's left alone."
          may_write() {
            [[ "$1" =~ ^[A-Za-z0-9-]{1,39}$ ]] || return 1
            [ "$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$1/permission" \
              --jq '(.permission | IN("admin", "write")) or (.role_name | IN("admin", "maintain", "write"))' 2> /dev/null)" = true ]
          }
          # The run's list of pull requests holds the app's even when a stranger's pull request from
          # the same branch started it, so the person who started the run must be trusted too.
          actor="$(jq -r '.triggering_actor.login // ""' <<< "$run")"
          if ! { [ "$actor" = "awml-factory[bot]" ] && [ "$(jq -r '.triggering_actor.type // ""' <<< "$run")" = Bot ]; } &&
            ! may_write "$actor"; then
            leave "CI's run was started by someone who may not write here, so it's left alone."
          fi

          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN/jobs?per_page=100" --jq '.jobs[]' |
            jq -s . > "$RUNNER_TEMP/jobs.json"
          jq -e '[.[] | select((.name | startswith("test (")) and .conclusion == "failure")] | length > 0' \
            "$RUNNER_TEMP/jobs.json" > /dev/null || leave "CI's tests didn't fail, so there's nothing to retry."
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/$branch" --jq .commit.sha)"
          [ "$current" = "$head_sha" ] || leave "$branch has moved on since CI ran, so a newer run decides."

          owner="${GITHUB_REPOSITORY%%/*}"
          name="${GITHUB_REPOSITORY#*/}"
          state="$(gh api graphql -F owner="$owner" -F name="$name" -F number="$issue" -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                issue(number: $number) { lastEditedAt labels(first: 100) { nodes { name } } }
              }
            }' --jq .data.repository.issue)"
          # A rename doesn't change lastEditedAt, so the issue's renamed events count as edits too.
          events="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$issue/events?per_page=100" \
            --jq '.[] | select((.event == "labeled" and .label.name == "build") or .event == "renamed") | {event, created_at}' | jq -s .)"
          labelled="$(jq -r '[.[] | select(.event == "labeled")] | last | .created_at // ""' <<< "$events")"
          renamed="$(jq -r '[.[] | select(.event == "renamed")] | last | .created_at // ""' <<< "$events")"
          edited="$(jq -r '.lastEditedAt // ""' <<< "$state")"
          if [[ "$renamed" > "$edited" ]]; then edited="$renamed"; fi
          jq -e '[.labels.nodes[].name] | index("build")' <<< "$state" > /dev/null && [ -n "$labelled" ] ||
            leave "Issue #$issue no longer carries the build label, so whoever took it off decides."
          echo "issue=$issue" >> "$GITHUB_OUTPUT"

          # Each outcome that needs a person is said once. told_already SINCE [SHA...] holds if this
          # is a re-run, the same run again, or if an earlier CI run of this repository's on the
          # branch, created since SINCE and before this one, and on one of the commits given if any
          # are, failed its tests, when retry said so already.
          attempt="$(jq -r '.run_attempt // 1' <<< "$run")"
          created="$(jq -r .created_at <<< "$run")"
          told_already() {
            local since="$1" heads earlier
            shift
            [ "$attempt" = 1 ] || return 0
            heads="$(jq -nc '$ARGS.positional' --args "$@")"
            while read -r earlier; do
              case "$earlier" in ''|*[!0-9]*) continue ;; esac
              if gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$earlier/jobs?per_page=100" --jq '.jobs[]' |
                jq -se '[.[] | select((.name | startswith("test (")) and .conclusion == "failure")] | length > 0' > /dev/null; then
                return 0
              fi
            done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=$branch&event=pull_request${since:+&created=%3E%3D$since}&per_page=100" \
              --jq '.workflow_runs[]' |
              jq -r --arg repository "$GITHUB_REPOSITORY" --arg since "$since" --arg created "$created" --argjson id "$CI_RUN" \
                --argjson heads "$heads" \
                'select(.id != $id and .event == "pull_request" and .head_repository.full_name == $repository and
                  .conclusion == "failure" and .created_at >= $since and .created_at < $created and
                  ($heads == [] or (.head_sha | IN($heads[])))) | .id')
            return 1
          }

          # A commit since main that isn't the factory's, by the same author and committer test as the
          # build rule's, means a person has taken the branch over: the build is never started over
          # it, whatever else holds, so this comes first. Told once, however many commits the person
          # pushed at once: unless a run on a commit from the first such one on was told already.
          factory() { [[ "$1" =~ ^([0-9]+\+)?awml-factory\[bot\]@users\.noreply\.github\.com$ ]]; }
          gh api --paginate "repos/$GITHUB_REPOSITORY/compare/main...$head_sha" \
            --jq '.commits[] | [.commit.author.email, .commit.committer.email, .sha] | @tsv' > "$RUNNER_TEMP/commits.tsv"
          taken=()
          while IFS=$'\t' read -r author committer sha; do
            if [ "${#taken[@]}" -gt 0 ] || ! factory "$author" || ! factory "$committer"; then
              taken+=("$sha")
            fi
          done < "$RUNNER_TEMP/commits.tsv"
          if [ "${#taken[@]}" -gt 0 ]; then
            if told_already "" "${taken[@]}"; then
              echo "A person took $branch over, and was told when its tests first failed since."
              echo "decision=none" >> "$GITHUB_OUTPUT"
            else
              echo "decision=takenover" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # Told once: unless a run since the edit was told already.
          if [ -n "$edited" ] && ! [[ "$edited" < "$labelled" ]]; then
            echo "Issue #$issue was edited or renamed at $edited, after the label was added at $labelled."
            if told_already "$edited"; then
              echo "A person was told when the tests first failed since."
              echo "decision=none" >> "$GITHUB_OUTPUT"
            else
              echo "decision=edited" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?created=%3E%3D$labelled&per_page=100" \
            --jq '.workflow_runs[]' |
            jq -s --arg title "Build of issue $issue" --arg since "$labelled" \
              '[.[] | select(.display_title == $title and .head_branch == "main" and
                (.event | IN("issues", "workflow_dispatch")) and .created_at >= $since)]' > "$RUNNER_TEMP/builds.json"
          builds="$(jq length "$RUNNER_TEMP/builds.json")"
          echo "Issue #$issue has had $builds builds since the label was added at $labelled."
          if [ "$builds" -lt 3 ]; then
            # A re-run is the same run again, which started the build already.
            if [ "$attempt" != 1 ]; then
              echo "This is a re-run of a run that started the build already."
              echo "decision=none" >> "$GITHUB_OUTPUT"
            else
              echo "decision=again" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          # Told once: on the first CI run since the last build started whose tests failed, whatever
          # commit it's on, the build's own, a fix's or one resolve.yml moved.
          last="$(jq -r 'map(.created_at) | sort | last // ""' "$RUNNER_TEMP/builds.json")"
          if told_already "$last"; then
            echo "A person was told when the tests first failed since the last build."
            echo "decision=none" >> "$GITHUB_OUTPUT"
          else
            echo "decision=report" >> "$GITHUB_OUTPUT"
          fi

  # Acts on the issue the retry job chose, one run at a time on it, never cancelled.
  act:
    needs: retry
    if: contains(fromJSON('["again", "report", "edited", "takenover"]'), needs.retry.outputs.decision)
    concurrency:
      group: retry-issue-${{ needs.retry.outputs.issue }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      issues: write
    steps:
      - name: Start the build again, with only the issue's number
        id: again
        if: needs.retry.outputs.decision == 'again'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.retry.outputs.issue }}
        run: |
          case "$ISSUE" in ''|*[!0-9]*) echo "The issue must be a number: $ISSUE"; exit 1 ;; esac
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main -f issue="$ISSUE"

      # New comments, from fixed text, since a person must act.
      - name: Say in a new comment that a person must act
        id: report
        if: contains(fromJSON('["report", "edited", "takenover"]'), needs.retry.outputs.decision)
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.retry.outputs.issue }}
          DECISION: ${{ needs.retry.outputs.decision }}
          CI_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          case "$ISSUE" in ''|*[!0-9]*) echo "The issue must be a number: $ISSUE"; exit 1 ;; esac
          [[ "$CI_URL" =~ ^https://github\.com/[A-Za-z0-9._/-]+$ ]] || CI_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions"
          if [ "$DECISION" = takenover ]; then
            printf '**A person has taken this build'"'"'s branch over**, with a commit that isn'"'"'t the factory'"'"'s, so the build won'"'"'t try again over it. To build it afresh, remove the build label and add it again. [CI'"'"'s run](%s)\n' \
              "$CI_URL" > "$RUNNER_TEMP/comment.md"
          elif [ "$DECISION" = report ]; then
            printf '**The build failed three times and needs a person.** CI'"'"'s tests failed on its pull request again. To try again, remove the build label and add it again. [CI'"'"'s run](%s)\n' \
              "$CI_URL" > "$RUNNER_TEMP/comment.md"
          else
            printf '**This issue was edited or renamed since the build label was added**, so the build won'"'"'t try again from text nobody approved. To build it as it reads now, remove the build label and add it again. [CI'"'"'s run](%s)\n' \
              "$CI_URL" > "$RUNNER_TEMP/comment.md"
          fi
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
