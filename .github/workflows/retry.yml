# When CI's tests fail on a build's pull request, this starts the build again for the branch's
# issue, up to three builds since the label was last added. It reads only GitHub: the CI run that
# woke it, the build runs named for the issue, the label's events and the issue's last edit. It
# hands the build nothing but the issue's number, and the build reads why the last try failed from
# CI itself. After three builds, or if the issue was edited since the label went on, a new comment
# on the issue says a person must act.
# Drawn in .github/drawings/retry-a-build.yaml
name: Retry a build

# On workflow_run GitHub runs main's copy of this, whatever the branch holds. It checks out nothing
# and runs only gh. The Actions token starts the build, since build.yml takes a dispatch from it,
# and comments.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ["build/issue-*"]

concurrency:
  group: retry-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  retry:
    # A first sift on the event's text. The tries step reads the run back from the API before it
    # trusts any of it.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: read
    steps:
      # Only pull_request runs count, which run once per commit, and only from a branch of this
      # repository, since a fork's branch can carry a build's name. The tests own a run where both
      # they and a review failed. The run must be at the branch's head, or a newer run decides. A try
      # is a build.yml run for the issue, by its name, started since the build label was last added.
      # It passes on only the issue's number and a decision.
      - name: "Sort by GitHub's record: is the run at the branch's head, is the issue unedited since the label, and how many builds have run since?"
        id: tries
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN: ${{ github.event.workflow_run.id }}
        run: |
          leave() { echo "$1"; echo "decision=none" >> "$GITHUB_OUTPUT"; exit 0; }
          case "$CI_RUN" in ''|*[!0-9]*) echo "CI's run isn't a number: $CI_RUN"; exit 1 ;; esac
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN")"
          jq -e --arg repository "$GITHUB_REPOSITORY" '.path == ".github/workflows/ci.yml" and
              .event == "pull_request" and .status == "completed" and
              .head_repository.full_name == $repository' <<< "$run" > /dev/null ||
            leave "Run $CI_RUN isn't CI's finished run on a pull request from this repository."
          head_sha="$(jq -r .head_sha <<< "$run")"
          branch="$(jq -r .head_branch <<< "$run")"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || leave "CI's commit isn't a commit id."
          [[ "$branch" =~ ^build/issue-[0-9]+$ ]] || leave "This isn't a build's branch."
          issue="${branch#build/issue-}"

          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN/jobs?per_page=100" --jq '.jobs[]' |
            jq -s . > "$RUNNER_TEMP/jobs.json"
          jq -e '[.[] | select((.name | startswith("test (")) and .conclusion == "failure")] | length > 0' \
            "$RUNNER_TEMP/jobs.json" > /dev/null || leave "CI's tests didn't fail, so there's nothing to retry."
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/$branch" --jq .commit.sha)"
          [ "$current" = "$head_sha" ] || leave "$branch has moved on since CI ran, so a newer run decides."

          owner="${GITHUB_REPOSITORY%%/*}"
          name="${GITHUB_REPOSITORY#*/}"
          state="$(gh api graphql -F owner="$owner" -F name="$name" -F number="$issue" -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                issue(number: $number) { lastEditedAt labels(first: 100) { nodes { name } } }
              }
            }' --jq .data.repository.issue)"
          # A rename doesn't change lastEditedAt, so the issue's renamed events count as edits too.
          events="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$issue/events?per_page=100" \
            --jq '.[] | select((.event == "labeled" and .label.name == "build") or .event == "renamed") | {event, created_at}' | jq -s .)"
          labelled="$(jq -r '[.[] | select(.event == "labeled")] | last | .created_at // ""' <<< "$events")"
          renamed="$(jq -r '[.[] | select(.event == "renamed")] | last | .created_at // ""' <<< "$events")"
          edited="$(jq -r '.lastEditedAt // ""' <<< "$state")"
          if [[ "$renamed" > "$edited" ]]; then edited="$renamed"; fi
          jq -e '[.labels.nodes[].name] | index("build")' <<< "$state" > /dev/null && [ -n "$labelled" ] ||
            leave "Issue #$issue no longer carries the build label, so whoever took it off decides."
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          if [ -n "$edited" ] && ! [[ "$edited" < "$labelled" ]]; then
            echo "Issue #$issue was edited or renamed at $edited, after the label was added at $labelled."
            echo "decision=edited" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          builds="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?created=%3E%3D$labelled&per_page=100" \
            --jq '.workflow_runs[]' |
            jq -s --arg title "Build of issue $issue" --arg since "$labelled" \
              '[.[] | select(.display_title == $title and .head_branch == "main" and
                (.event | IN("issues", "workflow_dispatch")) and .created_at >= $since)] | length')"
          echo "Issue #$issue has had $builds builds since the label was added at $labelled."
          if [ "$builds" -ge 3 ]; then
            echo "decision=report" >> "$GITHUB_OUTPUT"
          else
            echo "decision=again" >> "$GITHUB_OUTPUT"
          fi

      - name: Start the build again, with only the issue's number
        id: again
        if: steps.tries.outputs.decision == 'again'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.tries.outputs.issue }}
        run: |
          case "$ISSUE" in ''|*[!0-9]*) echo "The issue must be a number: $ISSUE"; exit 1 ;; esac
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main -f issue="$ISSUE"

      # New comments, from fixed text, since a person must act.
      - name: Say in a new comment that a person must act
        id: report
        if: steps.tries.outputs.decision == 'report' || steps.tries.outputs.decision == 'edited'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.tries.outputs.issue }}
          DECISION: ${{ steps.tries.outputs.decision }}
          CI_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          case "$ISSUE" in ''|*[!0-9]*) echo "The issue must be a number: $ISSUE"; exit 1 ;; esac
          [[ "$CI_URL" =~ ^https://github\.com/[A-Za-z0-9._/-]+$ ]] || CI_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions"
          if [ "$DECISION" = report ]; then
            printf '**The build failed three times and needs a person.** CI'"'"'s tests failed on its pull request again. To try again, remove the build label and add it again. [CI'"'"'s run](%s)\n' \
              "$CI_URL" > "$RUNNER_TEMP/comment.md"
          else
            printf '**This issue was edited or renamed since the build label was added**, so the build won'"'"'t try again from text nobody approved. To build it as it reads now, remove the build label and add it again. [CI'"'"'s run](%s)\n' \
              "$CI_URL" > "$RUNNER_TEMP/comment.md"
          fi
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
