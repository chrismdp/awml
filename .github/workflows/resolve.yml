# A pull request that conflicts with main is rebased onto it. The repository is public, so
# everything sits in one scope: anyone may read the pull requests and their branches. What matters
# is who may act. Only branches in the repository itself, opened by its own people or by the build
# workflow, are touched. A plain git rebase comes first, and a clean one is pushed straight away.
# Only a real conflict starts a Claude session, which resolves it with a read-only token and hands
# back the rebased branch. The app replaces the branch only if nobody has pushed to it meanwhile, and
# runs no checks of its own: its push starts CI, which judges the rebased commit as it judges every
# push, reviews included, since a resolution is new code. When it ends, one comment on the pull
# request says what was pushed, or why it couldn't be.
# Drawn in .github/drawings/rebase-conflicting-pull-requests.yaml
#
# Finding the conflicting pull requests runs in one job, with the plain git rebase, and Claude
# resolves a conflict in a second. The push and the comment run in a third job on a fresh runner,
# which shares none of the second's access and runs nothing from the branch. Each job that makes a
# bundle gives its sha256 as an output, and the push job checks each bundle against it.
#
# The repository's GitHub App pushes the rebased branch, because GitHub starts CI from an app's push
# but not from one by the Actions token. The push job mints the app's token, for this repository
# alone, and gives it only to the push. Comments use the Actions token. Before it works, a
# repository needs the GitHub App, its two secrets and the CLAUDE_CODE_OAUTH_TOKEN secret that
# build.yml lists.
name: Rebase conflicting pull requests

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: resolve-main
  cancel-in-progress: true

# Every step runs as bash --noprofile --norc -eo pipefail {0}, which GitHub uses only when the
# shell is named, so a command that fails in a pipe fails its step, as in the rehearsals.
defaults:
  run:
    shell: bash

jobs:
  # Finds the open pull requests GitHub flags as conflicting with main, keeps those from a branch
  # of this repository opened by its own people or the build's app, and rebases each with git
  # alone, hooks and fsmonitor off, running nothing from the branch. A clean rebase is bundled
  # for the push job, and a real conflict is left for Claude. It holds a token that only reads.
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pulls: ${{ steps.find.outputs.pulls }}
      conflicts: ${{ steps.find.outputs.conflicts }}
      digests: ${{ steps.find.outputs.digests }}
      main_sha: ${{ steps.find.outputs.main_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # A pull request is the build workflow's when a bot opened it from a build/issue- branch in
      # this repository. A branch whose commits change .github/ or Claude Code's own files is held
      # back before any rebase, since the app never pushes those, and the push job says so. The
      # rebase commits as the app's bot, so a person's commit keeps its author and stays theirs.
      - name: Find the conflicting pull requests and rebase each with git alone
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stop="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::$stop"
          trap 'echo "::$stop::"' EXIT
          if ! [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Main's commit isn't a commit id: $GITHUB_SHA"
            exit 1
          fi
          id="$(gh api "users/awml-factory%5Bbot%5D" --jq .id)"
          case "$id" in ''|*[!0-9]*) echo "The app's bot has no user id: $id"; exit 1 ;; esac
          rebased="$RUNNER_TEMP/rebased"
          mkdir -p "$rebased"
          git() {
            command git -c core.hooksPath=/dev/null -c core.fsmonitor=false \
              -c user.name="awml-factory[bot]" -c user.email="$id+awml-factory[bot]@users.noreply.github.com" "$@"
          }
          may_write() {
            [[ "$1" =~ ^[A-Za-z0-9-]{1,39}$ ]] || return 1
            [ "$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$1/permission" \
              --jq '(.permission | IN("admin", "write")) or (.role_name | IN("admin", "maintain", "write"))' 2> /dev/null)" = true ]
          }
          pulls='[]'
          while read -r number; do
            case "$number" in ''|*[!0-9]*) continue ;; esac
            mergeable=UNKNOWN
            for attempt in 1 2 3 4 5; do
              mergeable="$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json mergeable --jq .mergeable)"
              [ "$mergeable" != UNKNOWN ] && break
              sleep 2
            done
            [ "$mergeable" = CONFLICTING ] || continue

            pull="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number")"
            jq -e --arg repository "$GITHUB_REPOSITORY" '
              .base.ref == "main" and
              .head.repo.full_name == $repository and
              .head.ref != "factory-media"' <<< "$pull" > /dev/null || continue
            # The app's own bot on a build/issue- branch, by its exact login and type, or a person whose
            # permission on this repository, read from GitHub, lets them write.
            login="$(jq -r .user.login <<< "$pull")"
            if [ "$login" = "awml-factory[bot]" ] && [ "$(jq -r .user.type <<< "$pull")" = Bot ]; then
              [[ "$(jq -r .head.ref <<< "$pull")" == build/issue-* ]] || continue
            elif ! may_write "$login"; then
              continue
            fi
            branch="$(jq -r .head.ref <<< "$pull")"
            head_sha="$(jq -r .head.sha <<< "$pull")"
            if ! [[ "$branch" =~ ^[A-Za-z0-9._/-]+$ ]] || ! [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "#$number's branch or head isn't one this workflow handles."
              continue
            fi

            git fetch -q --no-tags origin "$head_sha"
            claudes='(^|/)\.claude(/|$)|(^|/)\.mcp\.json$|(^|/)CLAUDE(\.local)?\.md$|(^|/)\.npmrc$|(^|/)\.yarnrc(\.yml)?$|(^|/)node_modules(/|$)'
            # Every commit's files, not the branch's net change, since each commit would be pushed,
            # written to a file and searched there, so no grep stops early in a pipe.
            names="$(mktemp)"
            git log --format= --name-only --no-renames -z "$GITHUB_SHA..$head_sha" > "$names"
            if grep -qzE "^\.github/|$claudes" "$names"; then
              echo "#$number's commits change .github/, Claude Code's own files or npm's, which the app never pushes."
              pulls="$(jq -c --argjson number "$number" --arg branch "$branch" --arg head_sha "$head_sha" \
                '. + [{number: $number, branch: $branch, head_sha: $head_sha, clean: false, held: true}]' <<< "$pulls")"
              continue
            fi
            work="$RUNNER_TEMP/work/$number"
            git worktree add -q --detach "$work" "$head_sha"
            if git -C "$work" rebase -q "$GITHUB_SHA"; then
              git -C "$work" bundle create "$rebased/$number.bundle" "$GITHUB_SHA..HEAD"
              clean=true
            else
              git -C "$work" rebase --abort
              clean=false
            fi
            git worktree remove --force "$work"
            pulls="$(jq -c --argjson number "$number" --arg branch "$branch" --arg head_sha "$head_sha" --argjson clean "$clean" \
              '. + [{number: $number, branch: $branch, head_sha: $head_sha, clean: $clean, held: false}]' <<< "$pulls")"
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '.[].number')

          digests='{}'
          for bundle in "$rebased"/*.bundle; do
            [ -f "$bundle" ] || continue
            number="$(basename "$bundle" .bundle)"
            digests="$(jq -c --arg number "$number" --arg digest "$(sha256sum < "$bundle" | cut -c 1-64)" \
              '. + {($number): $digest}' <<< "$digests")"
          done
          {
            echo "pulls=$pulls"
            echo "conflicts=$(jq -c '[.[] | select((.clean | not) and (.held | not))]' <<< "$pulls")"
            echo "digests=$digests"
            echo "main_sha=$GITHUB_SHA"
          } | tee -a "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.find.outputs.digests != '{}'
        with:
          name: rebased
          path: ${{ runner.temp }}/rebased

  # Claude resolves each real conflict here, with a read-only token, one pull request after another.
  # Each gets a clone of its own, made before any session starts. Its session runs the whole rebase
  # itself, git included, in that clone, and hands back a bundle. So no git runs beside the login
  # token after a session, and the session's clone, whose .git its commands could change, is never
  # touched by the host's git again: a later step reads each bundle as data into a fresh
  # repository. The job runs nothing of its own beside the login token but fetching the sessions'
  # Go modules.
  draft:
    needs: find
    if: needs.find.outputs.conflicts != '[]' && needs.find.outputs.conflicts != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The host's own folder, under root's /var/lib, so nothing running as the runner's user can
    # rename it away. It holds each pull request's folder, main's prompt and sandbox settings, the
    # list of pull requests, the logs, the workspace's baseline and the checked rebases, and each
    # session may write only its own pull request's folder there.
    env:
      HOST_DIR: /var/lib/awml-host
    permissions:
      contents: read
      pull-requests: read
    outputs:
      digests: ${{ steps.check.outputs.digests }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # The session runs the branch's code, so Go's cache is neither saved nor restored.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false

      # The host's own folder is made by root under root's /var/lib, so no command a session runs, as
      # the runner's user, can rename it or a folder above it.
      - name: Keep main's prompt, AGENTS.md and sandbox settings in the host's own folder
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 700 "$HOST_DIR"
          mkdir -p "$HOST_DIR/main"
          cp .github/resolve-prompt.md AGENTS.md "$HOST_DIR/main/"
          cp .github/sandbox-settings.sh "$HOST_DIR/"

      # Each pull request gets a folder of its own: a clone of the branch, its inputs, made
      # read-only, its session's output and its session's home. The clone commits as the app's bot,
      # with no hooks, and its rebase never waits for an editor. The session's Go module cache is
      # filled here, before it starts, by fetching alone, for the branch and for main, since the
      # session runs offline. Git runs here with hooks and fsmonitor off, before any session starts.
      - name: Prepare a clone of each conflicting branch, before any session starts
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          CONFLICTS: ${{ needs.find.outputs.conflicts }}
          MAIN_SHA: ${{ needs.find.outputs.main_sha }}
        run: |
          stop="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::$stop"
          trap 'echo "::$stop::"' EXIT
          if ! [[ "$MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Main's commit isn't a commit id: $MAIN_SHA"
            exit 1
          fi
          id="$(gh api "users/awml-factory%5Bbot%5D" --jq .id)"
          case "$id" in ''|*[!0-9]*) echo "The app's bot has no user id: $id"; exit 1 ;; esac
          git() { GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 command git -c core.hooksPath=/dev/null -c core.fsmonitor=false "$@"; }
          : > "$HOST_DIR/pulls.tsv"
          mkdir -p "$HOST_DIR/check" "$HOST_DIR/resolved" "$HOST_DIR/logs" "$HOST_DIR/baseline"
          # The workspace, which the check step fetches main and each branch from, must be the very
          # folder it is now, with the same .git, since a session could move a folder above it.
          stat -c %d:%i "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.git" > "$HOST_DIR/baseline/folders"
          while IFS=$'\t' read -r number head_sha; do
            case "$number" in ''|*[!0-9]*) continue ;; esac
            [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || continue
            root="$HOST_DIR/pr-$number"
            mkdir -p "$root/in" "$root/out" "$root/home"
            git fetch -q --no-tags origin "$head_sha:refs/heads/factory-rebase-$number"
            git clone -q --no-hardlinks --no-checkout "$GITHUB_WORKSPACE" "$root/work"
            git -C "$root/work" checkout -q --detach "$head_sha"
            git -C "$root/work" config user.name "awml-factory[bot]"
            git -C "$root/work" config user.email "$id+awml-factory[bot]@users.noreply.github.com"
            git -C "$root/work" config core.hooksPath /dev/null
            git -C "$root/work" config core.fsmonitor false
            git -C "$root/work" config core.editor true
            base="$(git merge-base "$head_sha" "$MAIN_SHA")"
            git log --oneline "$base..$head_sha" > "$root/in/branch-log.txt"
            git log --oneline "$base..$MAIN_SHA" > "$root/in/main-log.txt"
            cp "$HOST_DIR/main/AGENTS.md" "$root/in/"
            gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq '"# " + .title + "\n\n" + (.body // "")' > "$root/in/pull-request.md"
            chmod -R a-w "$root/in"
            (cd "$root/work" && HOME="$root/home" GOTOOLCHAIN=local GOPROXY=https://proxy.golang.org GOVCS='*:off' go mod download)
            HOME="$root/home" GOTOOLCHAIN=local GOPROXY=https://proxy.golang.org GOVCS='*:off' go mod download
            printf '%s\t%s\n' "$number" "$head_sha" >> "$HOST_DIR/pulls.tsv"
          done < <(jq -r '.[] | [.number, .head_sha] | @tsv' <<< "$CONFLICTS")

      # Claude Code runs its commands in a sandbox, bubblewrap with socat for its network, so that it
      # can scrub its login token from them, and they can't start without both. Ubuntu's runners
      # restrict the user namespaces bubblewrap needs, so allow them on this throwaway machine, and
      # check bubblewrap works before Claude starts. Installing Claude Code runs nothing from the
      # branch.
      - name: Install Claude Code and bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # The Docker socket would let a command start a root container outside the sandbox. It's
          # root's, so taking the group's access away leaves the runner user unable to reach it.
          if [ -e /var/run/docker.sock ]; then sudo chmod 600 /var/run/docker.sock; fi
          bwrap --dev-bind / / --unshare-pid true
          npm install -g @anthropic-ai/claude-code@2.1.312

      # Each session loads only the user's settings and no MCP servers, so a settings file or a
      # .mcp.json on the branch can't set its hooks or where it sends the login token. It reads only
      # its clone and its own folders, never /proc. Its commands run in Claude Code's sandbox, set in
      # the user settings of its own home by main's .github/sandbox-settings.sh: each in a PID
      # namespace of its own, offline, and unable to write another pull request's folder or the
      # workspace's .git (#131). It runs the rebase, git included, in its own clone, and bundles the
      # result. The scrub forces the permission mode to default, so every tool the session needs is
      # allowed by name. This step runs no git, and holds no GitHub token. Each session's log goes to
      # the host's own folder, which no session can write, and its output folder is read only once it
      # holds nothing but plain files and folders.
      # The step is one { } group, which bash parses whole before it starts, and its sandbox can't
      # write the step's own script, "$0", so nothing a command writes there runs after the session.
      - name: Resolve the conflicts
        id: resolve
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          MAIN_SHA: ${{ needs.find.outputs.main_sha }}
          GIT_EDITOR: "true"
          GOPROXY: "off"
          GOFLAGS: -mod=mod
          GOTOOLCHAIN: local
          GOSUMDB: "off"
          npm_config_offline: "true"
        run: |
          {
            stop="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
            echo "::stop-commands::$stop"
            trap 'echo "::$stop::"' EXIT
            while IFS=$'\t' read -r number _; do
              root="$HOST_DIR/pr-$number"
              others=()
              for other in "$HOST_DIR"/pr-*; do
                if [ "$other" != "$root" ]; then others+=("$other"); fi
              done
              bash "$HOST_DIR/sandbox-settings.sh" "$HOST_DIR/pr-$number/home" "$root/work" clone "$0" \
                "${others[@]}" "$HOST_DIR/main" "$HOST_DIR/sandbox-settings.sh" "$HOST_DIR/pulls.tsv" \
                "$HOST_DIR/check" "$HOST_DIR/resolved" "$HOST_DIR/logs" "$HOST_DIR/baseline"
              prompt="$(sed -e "s|RESOLVE_DIR|$root/in|g" -e "s|OUT_DIR|$root/out|g" -e "s|MAIN_SHA|$MAIN_SHA|g" \
                "$HOST_DIR/main/resolve-prompt.md")"
              (cd "$root/work" && HOME="$HOST_DIR/pr-$number/home" claude -p "$prompt" --model opus --max-turns 200 --permission-mode default \
                --setting-sources user --strict-mcp-config --add-dir "$root/in" --add-dir "$root/out" \
                --disallowedTools "Read(//proc/**)" "Edit(./.git/**)" "Write(./.git/**)" \
                --allowedTools "Read(./**)" "Read(/$root/in/**)" "Read(/$root/out/**)" "Edit(./**)" "Edit(/$root/out/**)" "Glob" "Grep" \
                  "Bash(go:*)" "Bash(gofmt:*)" "Bash(make:*)" "Bash(node:*)" \
                  "Bash(git status:*)" "Bash(git diff:*)" "Bash(git log:*)" "Bash(git show:*)" \
                  "Bash(git add:*)" "Bash(git rebase:*)" "Bash(git checkout:*)" "Bash(git bundle create:*)" \
                  "Bash(ls:*)" "Bash(cp:*)" "Bash(mkdir:*)" \
                > "$HOST_DIR/logs/$number.log" 2>&1) || echo "The session on #$number ended with an error."
              cat "$HOST_DIR/logs/$number.log"
            done < "$HOST_DIR/pulls.tsv"
            exit
          }

      # Each session's bundle is read as data into a fresh repository, whose config no session ever
      # touched, with no global or system config, no hooks and no fsmonitor, beside no login token.
      # It must sit on main and carry no conflict marker. The lines its resolution adds, beyond those
      # the branch already added, and Claude's note, must carry nothing like the login token. Each
      # bundle's and note's sha256 is the job's output, which the push job checks them against.
      - name: Check each rebase, read into a fresh repository
        id: check
        if: ${{ !cancelled() }}
        env:
          CONFLICTS: ${{ needs.find.outputs.conflicts }}
          MAIN_SHA: ${{ needs.find.outputs.main_sha }}
        run: |
          stop="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::$stop"
          trap 'echo "::$stop::"' EXIT
          git() { GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 command git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c diff.external= "$@"; }
          # The long runs go to a file of their own, read whole, and are searched there: no grep
          # stops early in a pipe, so nothing feeding it dies of SIGPIPE and reads as no token.
          looks_like_token() {
            local runs
            runs="$(mktemp)"
            LC_ALL=C sed -E 's#base64,[A-Za-z0-9+/]+=*##g; s#data-points="[A-Za-z0-9+/]+=*"##g' |
              LC_ALL=C grep -aoiE 'sk-ant-|[A-Za-z0-9_-]{80,}' > "$runs" || true
            LC_ALL=C grep -qiE 'sk-ant-|[0-9]' "$runs"
          }
          if [ "$(stat -c %d:%i "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.git")" != "$(cat "$HOST_DIR/baseline/folders")" ]; then
            echo "The workspace or its .git isn't the folder it was before the sessions, so nothing is fetched from it."
            exit 1
          fi
          resolved="$HOST_DIR/resolved"
          mkdir -p "$resolved"
          digests='{}'
          while IFS=$'\t' read -r number head_sha; do
            case "$number" in ''|*[!0-9]*) continue ;; esac
            [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || continue
            root="$HOST_DIR/pr-$number"
            fresh="$HOST_DIR/check/$number"
            out="$root/out"
            bundle="$out/rebased.bundle"
            # Only the session's own folder is read, and only if it, and everything in it, is a plain
            # folder or file where it should be, so no link can lead the host's read anywhere else.
            if [ "$(realpath -e "$out" 2> /dev/null)" != "$(realpath -e "$HOST_DIR")/pr-$number/out" ] ||
              [ -n "$(find "$out" ! -type f ! -type d -print -quit)" ]; then
              echo "The session on #$number left a link or something else that isn't a plain file or folder in its folder, or none, so none of it is kept."
              continue
            fi
            mkdir -p "$fresh"
            git init -q "$fresh"
            git -C "$fresh" fetch -q --no-tags "$GITHUB_WORKSPACE" "$MAIN_SHA" "refs/heads/factory-rebase-$number"
            if [ -f "$bundle" ] &&
              git -C "$fresh" bundle verify -q "$bundle" > /dev/null 2>&1 &&
              git -C "$fresh" fetch -q "$bundle" "HEAD:refs/rebased" &&
              git -C "$fresh" merge-base --is-ancestor "$MAIN_SHA" refs/rebased &&
              ! git -C "$fresh" grep -qE '^(<<<<<<<|>>>>>>>)( |$)' refs/rebased --; then
              base="$(git -C "$fresh" merge-base "$head_sha" "$MAIN_SHA")"
              if comm -23 <(git -C "$fresh" diff --no-ext-diff --no-textconv "$MAIN_SHA" refs/rebased | LC_ALL=C grep -a '^+' | LC_ALL=C sort -u) \
                  <(git -C "$fresh" diff --no-ext-diff --no-textconv "$base" "$head_sha" | LC_ALL=C grep -a '^+' | LC_ALL=C sort -u) |
                  looks_like_token; then
                echo "The resolution of #$number adds what looks like a login token, so it isn't kept."
              else
                cp "$bundle" "$resolved/$number.bundle"
              fi
            else
              echo "The session on #$number left no rebase that sits on main without conflict markers."
            fi
            if [ -f "$out/message.md" ]; then
              if looks_like_token < "$out/message.md"; then
                echo "Claude's note on #$number carries what looks like a login token, so it isn't kept."
              else
                cp "$out/message.md" "$resolved/$number.md"
              fi
            fi
          done < "$HOST_DIR/pulls.tsv"
          for file in "$resolved"/*; do
            [ -f "$file" ] || continue
            digests="$(jq -c --arg name "$(basename "$file")" --arg digest "$(sha256sum < "$file" | cut -c 1-64)" \
              '. + {($name): $digest}' <<< "$digests")"
          done
          echo "digests=$digests" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() && steps.check.outputs.digests != '{}' }}
        with:
          name: resolved
          path: ${{ env.HOST_DIR }}/resolved

  # Guards, pushes and comments, one pull request after another, on a fresh runner that runs nothing
  # from the branches. Each bundle must have the digest the job that made it gave. The guards are
  # git's alone: the rebased branch sits on main, carries no conflict marker, and changes nothing
  # under .github/ or in Claude Code's own files, which the app never pushes. The push names the
  # head the find job saw, so GitHub refuses it if anyone pushed meanwhile. When it ends, one new
  # comment says what was pushed, with links to the old and new commits, or why it couldn't be,
  # with Claude's note escaped: < escaped, mentions broken, length capped.
  push:
    needs: [find, draft]
    if: ${{ !cancelled() && needs.find.result == 'success' && needs.find.outputs.pulls != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The Actions token only reads and comments here. The app's token pushes.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.find.outputs.main_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.find.outputs.digests != '{}'
        with:
          name: rebased
          path: ${{ runner.temp }}/rebased
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.draft.outputs.digests != '{}' && needs.draft.outputs.digests != ''
        with:
          name: resolved
          path: ${{ runner.temp }}/resolved

      - name: Make the app's token
        id: app
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Guard, push and comment on each pull request
        id: push
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          PULLS: ${{ needs.find.outputs.pulls }}
          FOUND: ${{ needs.find.outputs.digests }}
          RESOLVED: ${{ needs.draft.outputs.digests }}
          MAIN_SHA: ${{ needs.find.outputs.main_sha }}
        run: |
          stop="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::$stop"
          trap 'echo "::$stop::"' EXIT
          if ! [[ "$MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Main's commit isn't a commit id: $MAIN_SHA"
            exit 1
          fi
          [ -n "$RESOLVED" ] || RESOLVED='{}'
          git() { command git -c core.hooksPath=/dev/null -c core.fsmonitor=false "$@"; }
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          commit_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit"
          claudes='(^|/)\.claude(/|$)|(^|/)\.mcp\.json$|(^|/)CLAUDE(\.local)?\.md$|(^|/)\.npmrc$|(^|/)\.yarnrc(\.yml)?$|(^|/)node_modules(/|$)'
          names="$(mktemp)"
          failed=0
          while IFS=$'\t' read -r number branch head_sha clean held; do
            case "$number" in ''|*[!0-9]*) echo "A pull request's number isn't a number: $number"; exit 1 ;; esac
            if ! [[ "$branch" =~ ^[A-Za-z0-9._/-]+$ ]] || ! [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "#$number's branch or head isn't one this workflow handles."
              exit 1
            fi
            note=""
            if [ "$clean" = true ]; then
              bundle="$RUNNER_TEMP/rebased/$number.bundle"
              want="$(jq -r --arg n "$number" '.[$n] // ""' <<< "$FOUND")"
            else
              bundle="$RUNNER_TEMP/resolved/$number.bundle"
              want="$(jq -r --arg n "$number.bundle" '.[$n] // ""' <<< "$RESOLVED")"
              notes="$RUNNER_TEMP/resolved/$number.md"
              if [ -f "$notes" ] && [ "$(sha256sum < "$notes" | cut -c 1-64)" = "$(jq -r --arg n "$number.md" '.[$n] // ""' <<< "$RESOLVED")" ]; then
                note="$notes"
              fi
            fi
            why=""
            if [ "$held" = true ]; then
              why="The branch changes \`.github/\`, Claude Code's own files or npm's, which the app never pushes."
            elif [ -z "$want" ] || [ ! -f "$bundle" ]; then
              why="Claude couldn't resolve its conflicts with \`main\` with confidence."
            elif [ "$(sha256sum < "$bundle" | cut -c 1-64)" != "$want" ]; then
              why="The rebased branch isn't the one the job that rebased it made."
            elif ! git bundle verify -q "$bundle" > /dev/null 2>&1 || ! git fetch -q "$bundle" "HEAD:refs/rebased/$number"; then
              why="The rebased branch couldn't be read from its bundle."
            elif ! git merge-base --is-ancestor "$MAIN_SHA" "refs/rebased/$number"; then
              why="The rebased branch doesn't sit on \`main\`."
            elif git grep -qE '^(<<<<<<<|>>>>>>>)( |$)' "refs/rebased/$number" --; then
              why="The rebased branch still carries conflict markers."
            elif ! git log --format= --name-only --no-renames -z "$MAIN_SHA..refs/rebased/$number" > "$names" ||
              grep -qzE "^\.github/|$claudes" "$names"; then
              why="The branch changes \`.github/\`, Claude Code's own files or npm's, which the app never pushes."
            elif ! git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)" \
                push --force-with-lease="refs/heads/$branch:$head_sha" origin "refs/rebased/$number:refs/heads/$branch"; then
              why="The branch moved while this ran, so nothing was changed."
            fi
            {
              if [ -z "$why" ]; then
                new="$(git rev-parse "refs/rebased/$number")"
                printf '**Rebased this pull request onto `main` and pushed it.** The old head was [`%s`](%s/%s), and the new head is [`%s`](%s/%s). CI runs on it again. To put the branch back, run `git push --force origin %s:%s`. [The run](%s)\n' \
                  "${head_sha:0:12}" "$commit_url" "$head_sha" "${new:0:12}" "$commit_url" "$new" "$head_sha" "$branch" "$run_url"
              else
                failed=1
                printf '**This pull request conflicts with `main`, and the rebase couldn'"'"'t be pushed.** %s A person should rebase it by hand. [The run](%s)\n' "$why" "$run_url"
              fi
              if [ -n "$note" ]; then
                echo
                echo "### Claude's note"
                echo
                jq -Rrs '.[0:5000] | gsub("<"; "&lt;") | gsub("@(?=[A-Za-z0-9])"; "@​")' "$note" | sed 's/^/> /'
              fi
            } > "$RUNNER_TEMP/comment.md"
            gh pr comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          done < <(jq -r '.[] | [.number, .branch, .head_sha, .clean, (.held // false)] | @tsv' <<< "$PULLS")
          exit "$failed"
