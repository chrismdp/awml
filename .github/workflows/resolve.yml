# Resolves open pull requests that conflict when a commit lands on main. This is the workflow drawn
# at https://awml.io/chrismdp/rebase-conflicting-pull-requests.
#
# Only pull requests from this repository, opened by its own people or by the build workflow, are
# considered. Claude works with a read-only token and returns the rebased branch as a bundle, so it
# never holds the credentials that can push its change. The checks run in another job that can only
# read. A separate push job runs nothing from the branch and force-pushes it only if the branch
# hasn't moved. The old commit stays on GitHub and the comment names it, so the replacement can be
# undone with one push.
#
# The repository's GitHub App pushes the rebased branch, because GitHub starts CI from an app's push
# but not from one by the Actions token. So CI runs on the rebased branch and shows on the pull
# request, and main's rule holds the merge until it passes. The push job mints the app's token and
# gives it only to the push. The find job needs no token of the app's: it knows the build's pull
# requests as a bot's, from a build/issue- branch in this repository. Comments use the Actions
# token.
#
# Each pull request it redoes gets a status comment of this run's own, marked with a hidden
# <!-- factory-resolve-status -->. A job posts it as soon as the find job names the pull request,
# saying that main has moved on, that the pull request now clashes with it and that it is being
# redone on top of main, with a link to the run. That job checks out nothing and runs only gh, and
# nothing waits for it, so the rebase goes on even if it can't comment. When the push job ends, it
# edits the comment to say either that the new branch was pushed and CI is running again, or that
# the redo failed. It finds the comment by this run's link, so a later run posts a new comment and
# never edits an older run's. The comments saying how it went are still posted as well, because
# GitHub sends no notification for an edit.
#
# Before it works, a repository needs the GitHub App, its two secrets and the
# CLAUDE_CODE_OAUTH_TOKEN secret that build.yml lists.
name: Rebase conflicting pull requests

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: resolve-main
  cancel-in-progress: true

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pulls: ${{ steps.find.outputs.pulls }}
      main_sha: ${{ steps.find.outputs.main_sha }}
    steps:
      # A pull request is the build workflow's when a bot opened it from a build/issue- branch in
      # this repository, whether the bot is the app or, as before the build used the app, the
      # Actions token.
      - name: Find conflicting pull requests
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pulls='[]'
          while read -r number; do
            mergeable=UNKNOWN
            head_sha=
            for attempt in 1 2 3 4 5; do
              details="$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" \
                --json mergeable,headRefOid)"
              mergeable="$(jq -r '.mergeable' <<< "$details")"
              head_sha="$(jq -r '.headRefOid' <<< "$details")"
              [ "$mergeable" != UNKNOWN ] && break
              sleep 2
            done
            [ "$mergeable" = CONFLICTING ] || continue

            pull="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number")"
            eligible="$(jq -r --arg repository "$GITHUB_REPOSITORY" '
              .base.ref == "main" and
              .head.repo.full_name == $repository and
              .head.ref != "factory-media" and
              ((.author_association == "OWNER" or
                .author_association == "MEMBER" or
                .author_association == "COLLABORATOR") or
               (.user.type == "Bot" and (.head.ref | startswith("build/issue-"))))
            ' <<< "$pull")"
            [ "$eligible" = true ] || continue

            branch="$(jq -r '.head.ref' <<< "$pull")"
            pulls="$(jq -c --argjson number "$number" --arg branch "$branch" \
              --arg head_sha "$head_sha" \
              '. + [{number: $number, branch: $branch, head_sha: $head_sha}]' <<< "$pulls")"
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
            --jq '.[].number')

          echo "pulls=$pulls" >> "$GITHUB_OUTPUT"
          echo "main_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  # Says on each pull request that it clashes with main and is being redone, while Claude starts on
  # it. Each run posts a new comment, which the push job edits when the run ends. It checks out
  # nothing and runs only gh. No job waits for it, so if it can't comment, the rebase goes on.
  start:
    needs: find
    if: ${{ needs.find.outputs.pulls != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        pull: ${{ fromJSON(needs.find.outputs.pulls) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      # A push to main names the commit's message, whose first line has the merged pull request's
      # number when it was squashed. A run started by hand has only the commit.
      - name: Post the status comment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_MESSAGE: ${{ github.event.head_commit.message }}
          MAIN_SHA: ${{ needs.find.outputs.main_sha }}
          PR_NUMBER: ${{ matrix.pull.number }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          title="$(printf '%s\n' "$MAIN_MESSAGE" | head -n 1 | cut -c 1-200)"
          moved="$MAIN_SHA"
          [ -z "$title" ] || moved="$MAIN_SHA, \"$title\","
          {
            echo "<!-- factory-resolve-status -->"
            echo "**Redoing this pull request on top of \`main\`.** [The run]($run_url)"
            echo
            echo "\`main\` has moved on to $moved and this pull request now clashes with it."
          } > "$RUNNER_TEMP/status.md"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/status.md"

  draft:
    needs: find
    if: ${{ needs.find.outputs.pulls != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        pull: ${{ fromJSON(needs.find.outputs.pulls) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.pull.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Start the rebase and prepare its context
        id: rebase
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ needs.find.outputs.main_sha }}
          PR_NUMBER: ${{ matrix.pull.number }}
        run: |
          mkdir -p "$RUNNER_TEMP/resolve"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          pull="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          jq -r '"# " + .title + "\n\n" + (.body // "")' <<< "$pull" \
            > "$RUNNER_TEMP/resolve/pull-request.md"
          base="$(git merge-base HEAD "$MAIN_SHA")"
          git log --oneline "$base"..HEAD > "$RUNNER_TEMP/resolve/branch-log.txt"
          git log --oneline "$base".."$MAIN_SHA" > "$RUNNER_TEMP/resolve/main-log.txt"

          if git rebase "$MAIN_SHA"; then
            echo "Pull request #$PR_NUMBER no longer conflicts with main"
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
            {
              echo "Rebased this pull request onto the latest main commit."
              echo
              echo "The earlier conflict had gone away, so no manual conflict resolution was needed."
            } > "$RUNNER_TEMP/resolve/message.md"
            exit 0
          fi

          git diff --name-only --diff-filter=U > "$RUNNER_TEMP/resolve/conflicted-files.txt"
          if [ ! -s "$RUNNER_TEMP/resolve/conflicted-files.txt" ]; then
            echo "The rebase failed without leaving conflicted files"
            exit 1
          fi
          echo "conflicts=true" >> "$GITHUB_OUTPUT"

      # Claude Code scrubs its login token from the commands it runs inside bubblewrap, and stops
      # without it. Ubuntu's runners restrict the user namespaces bubblewrap needs, so allow them on
      # this throwaway machine, and check bubblewrap works before Claude starts.
      - name: Install Claude Code and bubblewrap
        if: ${{ steps.rebase.outputs.conflicts == 'true' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --dev-bind / / --unshare-pid true
          npm install -g @anthropic-ai/claude-code

      # Claude works on the branch's tree, so it loads only the user's settings and no MCP servers: a
      # settings file or a .mcp.json on the branch can't set its hooks or where it sends the login
      # token.
      - name: Resolve the conflicts
        if: ${{ steps.rebase.outputs.conflicts == 'true' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          RESOLVE_DIR: ${{ runner.temp }}/resolve
          # So a plain git rebase --continue, which Claude may run, never waits for an editor.
          GIT_EDITOR: "true"
        run: |
          prompt="$(sed "s|RESOLVE_DIR|$RESOLVE_DIR|g" .github/resolve-prompt.md)"
          claude -p "$prompt" --model opus --max-turns 200 --permission-mode acceptEdits \
            --setting-sources user --strict-mcp-config \
            --allowedTools "Read" "Edit" "Write" "Glob" "Grep" \
              "Bash(go:*)" "Bash(gofmt:*)" "Bash(make:*)" "Bash(node:*)" \
              "Bash(git status:*)" "Bash(git diff:*)" "Bash(git log:*)" \
              "Bash(git add:*)" "Bash(git rebase:*)" "Bash(git show:*)" \
              "Bash(git checkout:*)" \
              "Bash(ls:*)" "Bash(cp:*)" "Bash(mkdir:*)"

      - name: Make the bundle
        env:
          MAIN_SHA: ${{ needs.find.outputs.main_sha }}
        run: |
          if [ ! -s "$RUNNER_TEMP/resolve/message.md" ]; then
            echo "Claude did not write message.md"
            exit 1
          fi
          git_dir="$(git rev-parse --git-dir)"
          if [ -d "$git_dir/rebase-merge" ] || [ -d "$git_dir/rebase-apply" ]; then
            echo "Claude left a rebase in progress"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$MAIN_SHA" HEAD; then
            echo "The rebased branch does not descend from main"
            exit 1
          fi
          git bundle create "$RUNNER_TEMP/resolve/rebased.bundle" "$MAIN_SHA"..HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: resolve-${{ matrix.pull.number }}
          path: ${{ runner.temp }}/resolve/rebased.bundle

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: resolve-note-${{ matrix.pull.number }}
          path: ${{ runner.temp }}/resolve/message.md
          if-no-files-found: ignore

  check:
    needs: [find, draft]
    if: ${{ !cancelled() && needs.find.result == 'success' && needs.find.outputs.pulls != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        pull: ${{ fromJSON(needs.find.outputs.pulls) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Prepare the result
        run: |
          mkdir -p "$RUNNER_TEMP/result"
          echo "The workflow failed before it could check the proposed resolution." \
            > "$RUNNER_TEMP/result/result.txt"

      - uses: actions/checkout@v5
        id: checkout
        with:
          ref: ${{ needs.find.outputs.main_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        id: bundle
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: resolve-${{ matrix.pull.number }}
          path: ${{ runner.temp }}/draft

      - uses: actions/download-artifact@v4
        id: note
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: resolve-note-${{ matrix.pull.number }}
          path: ${{ runner.temp }}/note

      - name: Verify and fetch the bundle
        if: ${{ always() }}
        env:
          BUNDLE_OUTCOME: ${{ steps.bundle.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          MAIN_SHA: ${{ needs.find.outputs.main_sha }}
          NOTE_OUTCOME: ${{ steps.note.outcome }}
        run: |
          if [ "$CHECKOUT_OUTCOME" != success ]; then
            echo "The main commit could not be checked out." \
              > "$RUNNER_TEMP/result/result.txt"
            exit 1
          fi
          if [ "$BUNDLE_OUTCOME" != success ]; then
            echo "The draft job did not produce a bundle for this pull request." \
              > "$RUNNER_TEMP/result/result.txt"
            exit 1
          fi
          if [ "$NOTE_OUTCOME" != success ] || [ ! -s "$RUNNER_TEMP/note/message.md" ]; then
            echo "The draft job did not produce a resolution note for this pull request." \
              > "$RUNNER_TEMP/result/result.txt"
            exit 1
          fi

          bundle="$RUNNER_TEMP/draft/rebased.bundle"
          if ! git bundle verify "$bundle"; then
            echo "The rebased branch bundle could not be verified." \
              > "$RUNNER_TEMP/result/result.txt"
            exit 1
          fi
          if ! git fetch "$bundle" HEAD:refs/rebased; then
            echo "The rebased branch could not be fetched from its bundle." \
              > "$RUNNER_TEMP/result/result.txt"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$MAIN_SHA" refs/rebased; then
            echo "The rebased branch does not descend from the main commit." \
              > "$RUNNER_TEMP/result/result.txt"
            exit 1
          fi
          workflow_files="$(git log --format= --name-only \
            "$MAIN_SHA"..refs/rebased -- .github/workflows/ | sed '/^$/d')"
          if [ -n "$workflow_files" ]; then
            printf '%s\n' "$workflow_files"
            echo "The rebased commits change a workflow file, which this workflow doesn't push. Rebase this pull request by hand." \
              > "$RUNNER_TEMP/result/result.txt"
            exit 1
          fi
          git checkout --detach refs/rebased
          if git grep -nE '^(<<<<<<<|>>>>>>>)'; then
            echo "The proposed resolution still contains conflict markers." \
              > "$RUNNER_TEMP/result/result.txt"
            exit 1
          fi
          echo "The repository checks did not all pass." > "$RUNNER_TEMP/result/result.txt"

      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run the checks
        run: |
          go test ./...
          go vet ./...
          go run ./cmd/awml check examples/*.yaml examples/tour/*.yaml examples/platforms/*.yaml
          make test-wasm

      - name: Record the successful result
        run: echo pass > "$RUNNER_TEMP/result/result.txt"

      - name: Keep the resolution note with the result
        if: ${{ always() }}
        run: |
          if [ -s "$RUNNER_TEMP/note/message.md" ]; then
            cat "$RUNNER_TEMP/note/message.md" > "$RUNNER_TEMP/result/message.md"
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: resolve-result-${{ matrix.pull.number }}
          path: ${{ runner.temp }}/result

  push:
    needs: [find, check]
    if: ${{ !cancelled() && needs.find.result == 'success' && needs.find.outputs.pulls != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        pull: ${{ fromJSON(needs.find.outputs.pulls) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The Actions token only reads, comments and edits the status comment here. The app's token
    # pushes.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Prepare the failure reason
        run: |
          echo "The workflow failed before it could prepare a resolution." \
            > "$RUNNER_TEMP/resolve-failure.txt"

      - uses: actions/checkout@v5
        id: checkout
        with:
          ref: ${{ needs.find.outputs.main_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        id: bundle
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: resolve-${{ matrix.pull.number }}
          path: ${{ runner.temp }}/draft

      - uses: actions/download-artifact@v4
        id: result
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: resolve-result-${{ matrix.pull.number }}
          path: ${{ runner.temp }}/result

      - name: Read the check result
        id: checked
        if: ${{ always() }}
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          RESULT_OUTCOME: ${{ steps.result.outcome }}
        run: |
          if [ "$CHECKOUT_OUTCOME" != success ]; then
            echo "The main commit could not be checked out." \
              > "$RUNNER_TEMP/resolve-failure.txt"
            echo "passed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$RESULT_OUTCOME" != success ] || [ ! -s "$RUNNER_TEMP/result/result.txt" ]; then
            echo "The check job did not produce a result for this pull request." \
              > "$RUNNER_TEMP/resolve-failure.txt"
            echo "passed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$(cat "$RUNNER_TEMP/result/result.txt")" != pass ]; then
            cat "$RUNNER_TEMP/result/result.txt" > "$RUNNER_TEMP/resolve-failure.txt"
            echo "passed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "passed=true" >> "$GITHUB_OUTPUT"

      - name: Verify and fetch the bundle
        if: ${{ steps.checked.outputs.passed == 'true' }}
        env:
          BUNDLE_OUTCOME: ${{ steps.bundle.outcome }}
          MAIN_SHA: ${{ needs.find.outputs.main_sha }}
        run: |
          if [ "$BUNDLE_OUTCOME" != success ]; then
            echo "The draft job did not produce a bundle for this pull request." \
              > "$RUNNER_TEMP/resolve-failure.txt"
            exit 1
          fi

          bundle="$RUNNER_TEMP/draft/rebased.bundle"
          if ! git bundle verify "$bundle"; then
            echo "The rebased branch bundle could not be verified." \
              > "$RUNNER_TEMP/resolve-failure.txt"
            exit 1
          fi
          if ! git fetch "$bundle" HEAD:refs/rebased; then
            echo "The rebased branch could not be fetched from its bundle." \
              > "$RUNNER_TEMP/resolve-failure.txt"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$MAIN_SHA" refs/rebased; then
            echo "The rebased branch does not descend from the main commit." \
              > "$RUNNER_TEMP/resolve-failure.txt"
            exit 1
          fi

      - name: Make the app's token
        id: app
        if: ${{ steps.checked.outputs.passed == 'true' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}

      - name: Push the rebased branch
        id: push
        env:
          BRANCH: ${{ matrix.pull.branch }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          HEAD_SHA: ${{ matrix.pull.head_sha }}
        run: |
          if ! git -c core.hooksPath=/dev/null \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push --force-with-lease="refs/heads/$BRANCH:$HEAD_SHA" origin \
              "refs/rebased:refs/heads/$BRANCH"; then
            echo "The branch moved while this ran; nothing was changed." \
              > "$RUNNER_TEMP/resolve-failure.txt"
            exit 1
          fi

      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ matrix.pull.branch }}
          HEAD_SHA: ${{ matrix.pull.head_sha }}
          PR_NUMBER: ${{ matrix.pull.number }}
        run: |
          {
            echo "**Rebased this pull request onto \`main\` and force-pushed the branch.**"
            echo
            echo "- The old head was \`$HEAD_SHA\`. To put the branch back, run \`git push --force origin $HEAD_SHA:$BRANCH\`."
            echo
            echo "### How it was resolved"
            echo
            cat "$RUNNER_TEMP/result/message.md"
            echo
            printf '[The run](%s/%s/actions/runs/%s)\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body-file "$RUNNER_TEMP/comment.md"

      - name: Comment when resolution failed
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pull.number }}
        run: |
          reason="The workflow failed before it could prepare a resolution."
          if [ -s "$RUNNER_TEMP/resolve-failure.txt" ]; then
            reason="$(cat "$RUNNER_TEMP/resolve-failure.txt")"
          fi
          {
            echo "**The workflow couldn't resolve the conflicts with \`main\`.**"
            echo
            printf -- '- %s\n' "$reason"
            echo "- A maintainer should resolve this pull request by hand."
            echo
            if [ ! -s "$RUNNER_TEMP/draft/rebased.bundle" ] && \
              [ -s "$RUNNER_TEMP/result/message.md" ]; then
              echo "### Claude's note"
              echo
              cat "$RUNNER_TEMP/result/message.md"
              echo
            fi
            printf '[The run](%s/%s/actions/runs/%s)\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/resolve-failure-comment.md"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body-file "$RUNNER_TEMP/resolve-failure-comment.md"

      # The status comment this run posted says how it ended, going by whether the branch was
      # pushed. The comments above say so too, since GitHub sends no notification for an edit. The
      # comment is found by this run's link, so an older run's is never touched, and if the start
      # job posted none, there is nothing to edit.
      - name: Edit the status comment
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pull.number }}
          PUSHED: ${{ steps.push.outcome }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "<!-- factory-resolve-status -->"
            if [ "$PUSHED" = success ]; then
              echo "**Redone on top of \`main\`.** The new branch is pushed, and CI is running on it again. The comment below has the details and how to undo it. [The run]($run_url)"
            else
              echo "**The redo failed**, so this pull request needs resolving by hand. The comment below says why. [The run]($run_url)"
            fi
          } > "$RUNNER_TEMP/status.md"
          id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" |
            jq -r --arg link "($run_url)" '.[] | select(.user.login == "github-actions[bot]"
              and (.body | contains("<!-- factory-resolve-status -->")) and (.body | contains($link))) | .id' |
            tail -n 1)"
          if [ -z "$id" ]; then
            echo "This run posted no status comment on #$PR_NUMBER, so there is none to edit."
            exit 0
          fi
          jq -n --rawfile body "$RUNNER_TEMP/status.md" '{body: $body}' |
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" --input - > /dev/null
