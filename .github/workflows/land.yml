# A factory pull request lands once CI has judged its head commit. GitHub starts this when CI's
# pull_request run finishes on a build/issue-* branch. People merge their own pull requests. It reads
# everything from GitHub and git at that moment: the head commit's checks, the reviews' findings and
# Classify's verdict among them, the branch's commits since main, and the build rule run on that
# commit. The rule can only move Classify's verdict towards ask. Ship merges, pinned to the commit
# judged. Show merges the same way, then tells the person who added the label what to look at. Ask
# requests their review and doesn't merge: they merge from their own account, which is their yes.
# Nothing sets a pull request to merge by itself later, and main's own rule holds every merge until
# CI has passed.
# Drawn in .github/drawings/land-a-pull-request.yaml
name: Land a build's pull request

# GitHub runs this from main's copy, whatever the branch holds, and no job here checks out the
# branch or runs anything from it: the find job reads the head commit with git as data. The find
# job reads with a token that can't write, and passes on only the commit's sha, the outcome, the
# labeller's login and the rule's own reasons. The land job runs only gh. The app's token, for this
# repository alone, merges, so the merge starts CI on main and the rebase workflow. Review requests
# and comments use the Actions token. It needs what build.yml lists.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ["build/issue-*"]

jobs:
  # A newer CI result on a branch replaces an older one's reading, which no longer matches the
  # branch's head. A fork's pull request may name its branch build/issue-N too, so the group carries
  # the head's repository and CI's event. Only this reading job is cancelled: a land job that has
  # started is never stopped between its merge and its comment.
  find:
    concurrency:
      group: land-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      outcome: ${{ steps.judge.outputs.outcome }}
      reasons: ${{ steps.judge.outputs.reasons }}
      pr: ${{ steps.ready.outputs.pr }}
      head_sha: ${{ steps.ready.outputs.head_sha }}
      labeller: ${{ steps.ready.outputs.labeller }}
      classify: ${{ steps.ready.outputs.classify }}
    steps:
      # GitHub matches the run by its workflow's name, which another workflow could share, so the run
      # is read back from the API. A required check that failed or hasn't finished, a pull request
      # that isn't the app's or isn't open, or a head that moved, means it exits quietly: a failed
      # check is retry-a-build's or the fixer's, and a newer CI result decides a moved head. The
      # person who last added the issue's build label is the one to tell or ask, or the owner if the
      # app added it. Classify isn't required: once every job has finished, one that didn't pass is
      # read as giving no verdict.
      - name: "Sort by GitHub's record: is the pull request open at CI's commit, with every check passed?"
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN: ${{ github.event.workflow_run.id }}
        run: |
          leave() { echo "$1"; echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0; }
          case "$CI_RUN" in ''|*[!0-9]*) echo "CI's run isn't a number: $CI_RUN"; exit 1 ;; esac
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN")"
          jq -e --arg repository "$GITHUB_REPOSITORY" '.path == ".github/workflows/ci.yml" and
              .event == "pull_request" and .status == "completed" and
              .head_repository.full_name == $repository' <<< "$run" > /dev/null ||
            leave "Run $CI_RUN isn't CI's finished run on a pull request from this repository."
          head_sha="$(jq -r .head_sha <<< "$run")"
          branch="$(jq -r .head_branch <<< "$run")"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || leave "CI's commit isn't a commit id."
          [[ "$branch" =~ ^build/issue-[0-9]+$ ]] || leave "This isn't a build's branch."
          issue="${branch#build/issue-}"

          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN/jobs?per_page=100" --jq '.jobs[]' |
            jq -s . > "$RUNNER_TEMP/jobs.json"
          jq -e 'all(.[]; .status == "completed")' "$RUNNER_TEMP/jobs.json" > /dev/null ||
            leave "A check on $head_sha hasn't finished, so a later run decides."
          for name in "test (1.22)" "test (stable)" "Bug review" "Security review"; do
            jq -e --arg name "$name" '[.[] | select(.name == $name and .conclusion == "success")] | length == 1' \
              "$RUNNER_TEMP/jobs.json" > /dev/null || leave "$name didn't pass on $head_sha, so it's left to retry-a-build or the fixer."
          done
          # A Classify job that failed or was cancelled as a whole, by a timeout or a lost runner, gave
          # no verdict to trust, and its failure wakes neither the fixer nor retry, so it's read as no
          # verdict, which asks.
          if jq -e '[.[] | select(.name == "Classify" and .conclusion == "success")] | length == 1' "$RUNNER_TEMP/jobs.json" > /dev/null; then
            classify_passed=true
          else
            classify_passed=false
          fi
          classify="$(jq -r '[.[] | select(.name == "Classify")] | first | .html_url // ""' "$RUNNER_TEMP/jobs.json")"
          [[ "$classify" =~ ^https://github\.com/[A-Za-z0-9._/-]+$ ]] || classify="$(jq -r .html_url <<< "$run")"

          pull="$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=$GITHUB_REPOSITORY_OWNER:$branch&base=main&state=open" |
            jq -c --arg repository "$GITHUB_REPOSITORY" --arg branch "$branch" \
              '[.[] | select(.base.ref == "main" and .head.ref == $branch and
                .head.repo.full_name == $repository and .user.login == "awml-factory[bot]")] | first // empty')"
          [ -n "$pull" ] || leave "No open pull request of the app's is on $branch."
          [ "$(jq -r .head.sha <<< "$pull")" = "$head_sha" ] ||
            leave "The pull request has moved on since CI ran, so a newer CI result decides."
          pr="$(jq -r .number <<< "$pull")"
          case "$pr" in ''|*[!0-9]*) echo "The pull request's number isn't a number: $pr"; exit 1 ;; esac

          labeller="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$issue/events?per_page=100" \
            --jq '.[] | select(.event == "labeled" and .label.name == "build" and .actor.type == "User") | .actor.login' |
            tail -n 1)"
          [[ "$labeller" =~ ^[A-Za-z0-9-]{1,39}$ ]] || labeller="$GITHUB_REPOSITORY_OWNER"
          {
            echo "ready=true"
            echo "pr=$pr"
            echo "head_sha=$head_sha"
            echo "labeller=$labeller"
            echo "classify=$classify"
            echo "classify_passed=$classify_passed"
          } | tee -a "$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: steps.ready.outputs.ready == 'true'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # The change's code ran in CI's jobs, so no Go cache is restored here.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: steps.ready.outputs.ready == 'true'
        with:
          go-version: stable
          cache: false

      # The rule, its settings and the script that reads the checks come from main as it is now,
      # built and copied out before the head is fetched.
      - name: Build the rule from main
        id: rule
        if: steps.ready.outputs.ready == 'true'
        run: |
          go build -o "$RUNNER_TEMP/build-rule" ./internal/buildrule
          cp .github/build-rules.yml .github/read-findings.sh "$RUNNER_TEMP/"

      # The rule judges the head commit itself, not a patch: it's fetched into git's store, never
      # checked out, and its tree is read into the index of a tree of its own at the commit of main
      # it sits on, so the files on disk stay main's. The rule reads the branch's commits since then
      # with git, the reviews' findings and Classify's verdict from their checks, and asks when
      # Classify gave none. Only the outcome and the rule's own fixed reasons pass on, so
      # Classify's reasons are linked, never quoted.
      - name: "Sort by rule: ship, show or ask?"
        id: judge
        if: steps.ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ steps.ready.outputs.head_sha }}
          CLASSIFY_PASSED: ${{ steps.ready.outputs.classify_passed }}
        run: |
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The commit to judge isn't a commit id: $HEAD_SHA"
            exit 1
          fi
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            fetch --no-tags origin "$HEAD_SHA"
          base="$(git merge-base HEAD "$HEAD_SHA")"
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false worktree add -q --detach "$RUNNER_TEMP/judged" "$base"
          git -C "$RUNNER_TEMP/judged" read-tree "$HEAD_SHA"
          bash "$RUNNER_TEMP/read-findings.sh" "$CI_RUN" "$RUNNER_TEMP/checks"
          [ "$CLASSIFY_PASSED" = true ] || echo missing > "$RUNNER_TEMP/checks/verdict.txt"
          "$RUNNER_TEMP/build-rule" -repo "$RUNNER_TEMP/judged" -rules "$RUNNER_TEMP/build-rules.yml" \
            -findings "$RUNNER_TEMP/checks/findings.json" -classify "$(cat "$RUNNER_TEMP/checks/verdict.txt")" \
            -head "$HEAD_SHA" -factory "awml-factory[bot]" > "$RUNNER_TEMP/rule.txt"
          cat "$RUNNER_TEMP/rule.txt"
          outcome="$(head -n 1 "$RUNNER_TEMP/rule.txt")"
          case "$outcome" in
            ship|show|ask) ;;
            *) echo "The build rule gave an unknown outcome: $outcome"; exit 1 ;;
          esac
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          echo "reasons=$(tail -n +2 "$RUNNER_TEMP/rule.txt" | jq -Rsc 'split("\n") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"

  # Ships, shows or asks. It checks out nothing and runs only gh. The merge names the commit judged,
  # so GitHub refuses it if anyone pushed since. Comments are new ones, for the person who added
  # the label, from fixed text, the rule's reasons, cleaned, and links.
  land:
    needs: find
    if: contains(fromJSON('["ship", "show", "ask"]'), needs.find.outputs.outcome)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: land-pull-${{ needs.find.outputs.pr }}
      cancel-in-progress: false
    # The Actions token asks for reviews and comments. The app's token merges.
    permissions:
      issues: write
      pull-requests: write
    env:
      OUTCOME: ${{ needs.find.outputs.outcome }}
      REASONS: ${{ needs.find.outputs.reasons }}
      PR_NUMBER: ${{ needs.find.outputs.pr }}
      HEAD_SHA: ${{ needs.find.outputs.head_sha }}
      LABELLER: ${{ needs.find.outputs.labeller }}
      CLASSIFY: ${{ needs.find.outputs.classify }}
    steps:
      # Everything the find job passed on is checked before it's used. The reasons are the rule's
      # own text, but a path in one came from the branch, so each is cleaned as a session's text
      # is: < escaped, mentions broken, length capped.
      - name: Check what the find job passed on, and write the message and comments
        id: write
        run: |
          case "$OUTCOME" in ship|show|ask) ;; *) echo "The outcome must be ship, show or ask: $OUTCOME"; exit 1 ;; esac
          case "$PR_NUMBER" in ''|*[!0-9]*) echo "The pull request must be a number: $PR_NUMBER"; exit 1 ;; esac
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || ! [[ "$LABELLER" =~ ^[A-Za-z0-9-]{1,39}$ ]] ||
            ! [[ "$CLASSIFY" =~ ^https://github\.com/[A-Za-z0-9._/-]+$ ]]; then
            echo "The commit, the labeller or the link to Classify isn't one this workflow handles."
            exit 1
          fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -r 'def clean: gsub("[\r\n]+"; " ") | gsub("<"; "&lt;") | gsub("@(?=[A-Za-z0-9])"; "@​") | .[0:500];
            .[0:20][] | "- \(clean)"' <<< "$REASONS" > "$RUNNER_TEMP/reasons.md"
          case "$OUTCOME" in
            ship) said="Shipped" ;;
            show) said="Shown" ;;
            ask) said="Asked" ;;
          esac
          {
            echo "$said by land.yml, once CI passed on $HEAD_SHA, because:"
            echo
            cat "$RUNNER_TEMP/reasons.md"
            echo
            echo "To undo it, use the Revert button on this pull request."
          } > "$RUNNER_TEMP/merge.md"
          {
            printf '@%s, this merged once CI passed on %s, and the build rule says it'"'"'s worth a look:\n\n' "$LABELLER" "$HEAD_SHA"
            cat "$RUNNER_TEMP/reasons.md"
            echo
            printf '[Classify'"'"'s reasons](%s) · [The run](%s)\n' "$CLASSIFY" "$run_url"
          } > "$RUNNER_TEMP/show.md"
          {
            printf '@%s, CI passed on %s, but the build rule says this needs your review before it merges:\n\n' "$LABELLER" "$HEAD_SHA"
            cat "$RUNNER_TEMP/reasons.md"
            echo
            echo "Merge it from your own account if you agree."
            echo
            printf '[Classify'"'"'s reasons](%s) · [The run](%s)\n' "$CLASSIFY" "$run_url"
          } > "$RUNNER_TEMP/ask.md"

      - name: Make the app's token
        id: app
        if: env.OUTCOME == 'ship' || env.OUTCOME == 'show'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Merge, pinned to the commit judged
        id: merge
        if: env.OUTCOME == 'ship' || env.OUTCOME == 'show'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash \
            --match-head-commit "$HEAD_SHA" --body-file "$RUNNER_TEMP/merge.md"

      - name: Tell the person who added the label what to look at
        id: show
        if: env.OUTCOME == 'show'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/show.md"

      # Asking doesn't merge: the person merges from their own account, which is their yes.
      - name: Ask the person who added the label to review it
        id: ask
        if: env.OUTCOME == 'ask'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-reviewer "$LABELLER"; then
            echo "::warning::Could not ask $LABELLER to review the pull request."
          fi
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/ask.md"
