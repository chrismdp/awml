# A pull request the app opened lands once CI has run on it. GitHub starts this when CI finishes
# on it, since the app pushed the branch. If CI fails, it starts retry-a-build. If CI passes, a code rule decides whether the change is straightforward, by rules
# the maintainer wrote down, reading the reviews' findings and the classifier's verdict, which can
# send a change to review but never skip one. A straightforward change the app sets to merge by
# itself. Otherwise the person who added the label is asked to review it, and merges it from their
# own account, which is their yes. Main's own rule holds every merge until CI has passed.
# Drawn at https://awml.io/chrismdp/land-a-pull-request
name: Land a build's pull request

# GitHub runs this from main's copy, whatever the branch holds, and no job here checks out the
# branch or runs anything from it. The find job reads, with a token that can't write: it reads CI's
# result and applies the rule. The land job runs only gh: it starts retry-a-build, or writes the
# verdict into the description and sets the merge or asks for review, and edits the build's status
# comment. The app's token edits the description and sets the merge, so the merge starts CI on main
# and the rebase workflow. Review requests, comments and the retry's dispatch use the Actions
# token. It needs what build.yml lists.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ["build/issue-*"]

# A newer CI result on a branch replaces an older one, which no longer matches the branch's head.
concurrency:
  group: land-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  # Reads, and holds no token that can write. It finds the open pull request the app opened from
  # the branch, whose head is the commit CI ran on, and the build that opened it, named in the first
  # line of its description. Only the app and people with write access can edit that description,
  # and the run it names must be this repository's build workflow, which pushed exactly this commit.
  # Everything else comes from that build's own records. If CI passed, it applies Claude's patch to
  # the commit of main the build pushed it onto and judges it with the rule as it is on main now.
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      ci: ${{ steps.find.outputs.ci }}
      issue: ${{ steps.find.outputs.issue }}
      attempt: ${{ steps.find.outputs.attempt }}
      requested_by: ${{ steps.find.outputs.requested_by }}
      pr: ${{ steps.find.outputs.pr }}
      head_sha: ${{ steps.find.outputs.head_sha }}
      verdict: ${{ steps.judge.outputs.verdict }}
    steps:
      - name: Find the build's pull request
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          leave() { echo "$1"; echo "ci=none" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY" ] && [ "$CI_EVENT" = push ] ||
            leave "CI didn't run on a push to this repository."
          case "$BRANCH" in build/issue-*) issue="${BRANCH#build/issue-}" ;; *) leave "This isn't a build's branch." ;; esac
          case "$issue" in ''|*[!0-9]*) leave "This isn't a build's branch." ;; esac
          case "$HEAD_SHA" in *[!0-9a-f]*) leave "CI's commit isn't a commit id." ;; esac
          [ "${#HEAD_SHA}" -eq 40 ] || leave "CI's commit isn't a commit id."
          case "$CONCLUSION" in
            success) ci=passed ;;
            failure) ci=failed ;;
            *) leave "CI ended as $CONCLUSION, so there's nothing to do." ;;
          esac

          pull="$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=$GITHUB_REPOSITORY_OWNER:$BRANCH&state=open" |
            jq -c --arg repository "$GITHUB_REPOSITORY" --arg branch "$BRANCH" \
              '[.[] | select(.base.ref == "main" and .head.ref == $branch and
                .head.repo.full_name == $repository and .user.type == "Bot")] | first // empty')"
          [ -n "$pull" ] || leave "No open pull request of the app's is on $BRANCH."
          [ "$(jq -r .head.sha <<< "$pull")" = "$HEAD_SHA" ] ||
            leave "The pull request has moved on since CI ran, so a newer CI result decides."
          pr="$(jq -r .number <<< "$pull")"
          build_run="$(jq -r '(.body // "") | (split("\n")[0] // "") | rtrimstr("\r") |
            (capture("^<!-- factory-build run=(?<run>[0-9]+) -->$") | .run) // empty' <<< "$pull")"
          [ -n "$build_run" ] || leave "The description of #$pr names no build."
          workflow="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml" --jq .id)"
          named="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$build_run" --jq .workflow_id || true)"
          [ -n "$workflow" ] && [ "$named" = "$workflow" ] ||
            leave "The run that #$pr names isn't this repository's build."

          record="$RUNNER_TEMP/pull-request"
          gh run download "$build_run" --repo "$GITHUB_REPOSITORY" -n pull-request -D "$record" ||
            leave "The build that opened #$pr left no record."
          jq -e --argjson issue "$issue" '
              .issue == $issue and (.attempt | IN(1, 2, 3)) and
              (.requested_by | type == "string" and test("^[A-Za-z0-9._\\[\\]-]{0,64}$")) and
              (.commit | type == "string" and test("^[0-9a-f]{40}$")) and
              (.base | type == "string" and test("^[0-9a-f]{40}$"))' "$record/build.json" > /dev/null ||
            leave "The record of the build that opened #$pr isn't one."
          [ "$(jq -r .commit "$record/build.json")" = "$HEAD_SHA" ] ||
            leave "The branch has moved since the build pushed it, so it's left to whoever moved it."

          {
            echo "ci=$ci"
            echo "issue=$issue"
            echo "attempt=$(jq -r .attempt "$record/build.json")"
            echo "requested_by=$(jq -r .requested_by "$record/build.json")"
            echo "base=$(jq -r .base "$record/build.json")"
            echo "pr=$pr"
            echo "head_sha=$HEAD_SHA"
            echo "build_run=$build_run"
          } | tee -a "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.find.outputs.ci == 'passed'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        if: steps.find.outputs.ci == 'passed'
        with:
          go-version: stable

      # The rule, its settings and the description's script come from main as it is now, and the
      # patch is judged against the commit of main the build pushed it onto, which must be on main.
      # This job builds and runs nothing else.
      - name: Apply the rule
        id: judge
        if: steps.find.outputs.ci == 'passed'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.find.outputs.base }}
          BUILD_RUN: ${{ steps.find.outputs.build_run }}
        run: |
          go build -o "$RUNNER_TEMP/build-rule" ./internal/buildrule
          for name in change review; do
            gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" -n "$name" -D "$RUNNER_TEMP/$name"
          done
          git merge-base --is-ancestor "$BASE" HEAD
          git worktree add --detach "$RUNNER_TEMP/judged" "$BASE"
          git -C "$RUNNER_TEMP/judged" apply --index "$RUNNER_TEMP/change/change.patch"
          classification=()
          if [ -f "$RUNNER_TEMP/review/classification.json" ]; then
            classification=(-classification "$RUNNER_TEMP/review/classification.json")
          fi
          "$RUNNER_TEMP/build-rule" -repo "$RUNNER_TEMP/judged" -rules .github/build-rules.yml \
            -findings "$RUNNER_TEMP/review/findings.json" "${classification[@]}" > "$RUNNER_TEMP/verdict.txt"
          verdict="$(head -n 1 "$RUNNER_TEMP/verdict.txt")"
          case "$verdict" in
            review|straightforward) echo "verdict=$verdict" >> "$GITHUB_OUTPUT" ;;
            *) echo "The build rule gave an unknown verdict: $verdict"; exit 1 ;;
          esac
          cat "$RUNNER_TEMP/verdict.txt"

      # The pictures' rows were checked by the job that opened the pull request, and are checked
      # again here, since they come from an artifact.
      - name: Write the pull request's description and the merge's message
        if: steps.find.outputs.ci == 'passed'
        env:
          ATTEMPT: ${{ steps.find.outputs.attempt }}
          BUILD_RUN: ${{ steps.find.outputs.build_run }}
          CHANGE_DIR: ${{ runner.temp }}/change
          ISSUE: ${{ steps.find.outputs.issue }}
          REVIEW_DIR: ${{ runner.temp }}/review
          PICTURES: ${{ runner.temp }}/pull-request/pictures.txt
          PICTURES_LEFT_OUT: ${{ runner.temp }}/pull-request/pictures-left-out.txt
          VERDICT: ${{ runner.temp }}/verdict.txt
        run: |
          if grep -qvE '^[A-Za-z0-9._/-]+\|[A-Za-z0-9._/-]*\|[A-Za-z0-9._/-]+$' "$PICTURES"; then
            echo "The pictures' rows aren't plain paths."
            exit 1
          fi
          judged="$RUNNER_TEMP/judged-record"
          mkdir -p "$judged"
          export MEDIA_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/raw/factory-media/issue-$ISSUE/attempt-$ATTEMPT"
          .github/pull-request-body.sh > "$judged/pull-request.md"
          cat "$judged/pull-request.md"
          {
            echo "Merges by itself, because the build rule found it straightforward."
            echo
            echo "The build rule called it straightforward because:"
            echo
            tail -n +2 "$RUNNER_TEMP/verdict.txt" | while IFS= read -r line; do
              [ -n "$line" ] && printf -- '- %s\n' "$line"
            done
            echo
            echo "To undo it, use the Revert button on this pull request."
          } > "$judged/merge.md"
      - uses: actions/upload-artifact@v4
        if: steps.find.outputs.ci == 'passed'
        with:
          name: judged
          path: ${{ runner.temp }}/judged-record

  # Acts on CI's result. If CI failed, it starts retry-a-build with CI's run, whose failed log
  # retry.yml reads. If CI passed, the app writes the verdict into the description and sets a
  # straightforward change to merge, or the person who added the label is asked to review it, and
  # the status comment says which. If the rule couldn't be applied, it says so on the issue. It
  # checks out nothing and runs only gh.
  land:
    needs: find
    if: ${{ !cancelled() && (needs.find.outputs.ci == 'passed' || needs.find.outputs.ci == 'failed') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: build-auto-merge
      cancel-in-progress: false
    # The Actions token starts the retry, asks for reviews and edits the status comment. The app's
    # token edits the description and sets the merge.
    permissions:
      actions: write
      issues: write
      pull-requests: write
    env:
      CI: ${{ needs.find.outputs.ci }}
      ISSUE: ${{ needs.find.outputs.issue }}
      ATTEMPT: ${{ needs.find.outputs.attempt }}
      PR_NUMBER: ${{ needs.find.outputs.pr }}
      HEAD_SHA: ${{ needs.find.outputs.head_sha }}
      REQUESTED_BY: ${{ needs.find.outputs.requested_by }}
      VERDICT: ${{ needs.find.outputs.verdict }}
      JUDGED: ${{ needs.find.result }}
    steps:
      - name: Start retry-a-build with CI's failed log as why
        if: env.CI == 'failed'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN: ${{ github.event.workflow_run.id }}
        run: |
          case "$ISSUE" in ''|*[!0-9]*) echo "The issue must be a number: $ISSUE"; exit 1 ;; esac
          case "$ATTEMPT" in [1-3]) ;; *) echo "The attempt must be 1, 2 or 3: $ATTEMPT"; exit 1 ;; esac
          case "$CI_RUN" in ''|*[!0-9]*) echo "CI's run must be a number: $CI_RUN"; exit 1 ;; esac
          gh workflow run retry.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f issue="$ISSUE" -f attempt="$ATTEMPT" -f requested_by="$REQUESTED_BY" -f run="$CI_RUN"

      - uses: actions/download-artifact@v4
        if: env.CI == 'passed' && env.JUDGED == 'success'
        with:
          name: judged
          path: ${{ runner.temp }}/judged

      - name: Make the app's token
        id: app
        if: env.CI == 'passed' && env.JUDGED == 'success'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}

      - name: Write the verdict into the description
        if: env.CI == 'passed' && env.JUDGED == 'success'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          case "$PR_NUMBER" in ''|*[!0-9]*) echo "The pull request must be a number: $PR_NUMBER"; exit 1 ;; esac
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/judged/pull-request.md"

      - name: Ask for a review
        if: env.CI == 'passed' && env.JUDGED == 'success' && env.VERDICT == 'review'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reviewer="$REQUESTED_BY"
          case "$reviewer" in
            ''|*[!A-Za-z0-9-]*) reviewer="$GITHUB_REPOSITORY_OWNER" ;;
          esac
          if ! gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-reviewer "$reviewer"; then
            echo "::warning::Could not ask $reviewer to review the pull request."
          fi

      # CI has already passed, so GitHub may refuse to set a merge that could happen now. Then it
      # merges now instead. Either way it's only the commit that CI and the rule saw, and main's
      # rule still holds it.
      - name: Set the pull request to merge
        if: env.CI == 'passed' && env.JUDGED == 'success' && env.VERDICT == 'straightforward'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash \
            --match-head-commit "$HEAD_SHA" --body-file "$RUNNER_TEMP/judged/merge.md" ||
            gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash \
              --match-head-commit "$HEAD_SHA" --body-file "$RUNNER_TEMP/judged/merge.md"

      - name: Edit the status comment
        if: ${{ !cancelled() && env.CI == 'passed' }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$ISSUE" in ''|*[!0-9]*) echo "The issue must be a number: $ISSUE"; exit 1 ;; esac
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          here="$RUNNER_TEMP/status"
          mkdir -p "$here"
          {
            echo "<!-- factory-status -->"
            [ "$JUDGED" = success ] || JOB_STATUS=failure
            if [ "$JOB_STATUS" = success ] && [ "$VERDICT" = straightforward ]; then
              printf '**Built** in #%s, whose CI passed, and which merges by itself. [The run](%s)\n' "$PR_NUMBER" "$run_url"
            elif [ "$JOB_STATUS" = success ]; then
              printf '**Built** in #%s, whose CI passed, and which waits for a review. [The run](%s)\n' "$PR_NUMBER" "$run_url"
            else
              printf '**The build failed** after CI passed on #%s. [The run](%s)\n' "$PR_NUMBER" "$run_url"
            fi
          } > "$here/comment.md"
          id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- factory-status -->"))) | .id' |
            tail -n 1)"
          if [ -n "$id" ]; then
            jq -n --rawfile body "$here/comment.md" '{body: $body}' |
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" --input - > /dev/null
          else
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$here/comment.md"
          fi
          if [ "$JOB_STATUS" != success ]; then
            {
              printf '**The build failed after CI passed on #%s, before it set the merge or asked for a review.**\n' "$PR_NUMBER"
              echo
              echo "- The run says which step failed."
              echo "- To try again, remove the build label and add it again."
              echo
              echo "[The run]($run_url)"
            } > "$here/failure.md"
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$here/failure.md"
          fi
