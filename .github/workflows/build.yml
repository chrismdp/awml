# An issue the maintainer labels build becomes a pull request. The repository is public, so
# everything here sits in one scope: what matters is who may act. Only people with write access,
# and the repository's own app, can add a label, so the label is the decision. Claude drafts with a
# read-only token, and as part of its draft redraws the examples the change alters and pictures
# those that look different. The checks run where Claude can't reach. Two fresh Claude sessions
# that didn't write the change review it, one for bugs and one for security, and a third classifies
# its risk. The app then pushes the branch and the pictures and opens the pull request, which
# lands by land-a-pull-request once CI has run. A failed check, or an Important finding before the
# third try, goes to retry-a-build.
# Drawn at https://awml.io/chrismdp/issue-to-pull-request
name: Build from an issue
# GitHub names each build run for its issue and try, from its own inputs, so retry.yml and land.yml
# can check a run is the one they mean.
run-name: ${{ (github.event_name == 'workflow_dispatch' || github.event.label.name == 'build') && format('Build of issue {0}, try {1}', inputs.issue || github.event.issue.number, inputs.attempt || '1') || format('A label added to issue {0}', github.event.issue.number) }}

# Before it works, a repository needs:
# - a GitHub App with read and write access to contents, pull requests and issues, installed on the
#   repository, with its app id in a FACTORY_APP_ID secret and a private key in FACTORY_APP_KEY;
# - a CLAUDE_CODE_OAUTH_TOKEN secret, made with `claude setup-token`, so the runs come out of the
#   maintainer's subscription rather than a metered API key;
# - a build label;
# - "Allow auto-merge" turned on in the repository's general settings.
#
# The app pushes and opens, because GitHub starts other workflows from what an app does but not
# from what the Actions token does, so CI runs on the pull request. The open job mints the app's
# token from the app's two secrets and gives it only to the steps that push and open. Comments and
# the retry's dispatch use the Actions token.
on:
  issues:
    types: [labeled]
  # retry.yml starts each try after the first, and a person can start one by hand.
  workflow_dispatch:
    inputs:
      issue:
        description: The number of the issue to build
        required: true
      attempt:
        description: Which try this is, from 1 to 3
        default: "1"
      previous_run:
        description: The retry-a-build run that says why the last try failed
        default: ""
      requested_by:
        description: Who to ask to review the pull request, if it needs a review
        default: ""

# Each label added to an issue starts a run, and the app opens an issue with three labels at once. So
# only a build has the issue's group, and a run for any other label can't cancel the build.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || github.event.label.name == 'build') && format('build-issue-{0}', inputs.issue || github.event.issue.number) || format('build-other-label-{0}', github.run_id) }}
  cancel-in-progress: true

env:
  ISSUE: ${{ inputs.issue || github.event.issue.number }}
  ATTEMPT: ${{ inputs.attempt || '1' }}
  PREVIOUS_RUN: ${{ inputs.previous_run }}
  # Whoever added the label, or started the build by hand. A retry passes them on. A build whose
  # label the app added has the app's bot here, whose name isn't a person's, so land.yml asks the
  # owner instead.
  REQUESTED_BY: ${{ inputs.requested_by || github.event.sender.login }}

jobs:
  # Says on the issue that the build has started, before Claude drafts. The first try posts a new
  # status comment, marked with a hidden <!-- factory-status -->, and a retry edits the latest one
  # to say which try it's on and why the last failed, as the retry run that started it recorded. It
  # checks out nothing and runs only gh, so the drafting and checking jobs can stay read-only. If it
  # can't comment, the build goes on without the comment.
  start:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Post or edit the status comment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$ISSUE" in ''|*[!0-9]*) echo "The issue must be a number: $ISSUE"; exit 1 ;; esac
          case "$ATTEMPT" in [1-3]) ;; *) echo "The attempt must be 1, 2 or 3: $ATTEMPT"; exit 1 ;; esac
          case "$PREVIOUS_RUN" in *[!0-9]*) echo "The previous run must be a number: $PREVIOUS_RUN"; exit 1 ;; esac
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          here="$RUNNER_TEMP/status"
          mkdir -p "$here"
          {
            echo "<!-- factory-status -->"
            printf '**Building this issue** (try %s of 3). [The run](%s)\n' "$ATTEMPT" "$run_url"
            if [ "$ATTEMPT" -gt 1 ]; then
              reason="The reason was not recorded."
              # Only retry.yml's run from main for this issue's last try is read.
              retry="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/retry.yml" --jq .id || true)"
              if [ -n "$PREVIOUS_RUN" ] && [ -n "$retry" ] &&
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREVIOUS_RUN" |
                  jq -e --argjson workflow "$retry" --arg title "Retry of issue $ISSUE, try $((ATTEMPT - 1))" \
                    '.workflow_id == $workflow and .head_branch == "main" and .display_title == $title' > /dev/null &&
                gh run download "$PREVIOUS_RUN" --repo "$GITHUB_REPOSITORY" -n failed -D "$here/failed"; then
                reason="$(head -n 1 "$here/failed/reason.txt" 2>/dev/null | cut -c 1-200)"
                [ -n "$reason" ] || reason="The reason was not recorded."
              fi
              echo
              printf 'The last try failed because: %s\n' "$reason"
            fi
          } > "$here/comment.md"
          id=""
          if [ "$ATTEMPT" -gt 1 ]; then
            id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- factory-status -->"))) | .id' |
              tail -n 1)"
          fi
          if [ -n "$id" ]; then
            jq -n --rawfile body "$here/comment.md" '{body: $body}' |
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" --input - > /dev/null
          else
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$here/comment.md"
          fi

  # Claude works here with a read-only token, sees only the issue's text as it was when the label
  # went on and the comments of the repository's own people, and hands back a patch. Once its
  # checks pass, it redraws the examples its change alters with .github/picture-drawings.sh, which
  # puts the redrawn SVGs into the change and pictures, before and after, those that look different.
  draft:
    needs: start
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || github.event.label.name == 'build') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      issues: read
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    steps:
      - name: Check the inputs
        run: |
          case "$ISSUE" in ''|*[!0-9]*) echo "The issue must be a number: $ISSUE"; exit 1 ;; esac
          case "$ATTEMPT" in [1-3]) ;; *) echo "The attempt must be 1, 2 or 3: $ATTEMPT"; exit 1 ;; esac
          case "$PREVIOUS_RUN" in *[!0-9]*) echo "The previous run must be a number: $PREVIOUS_RUN"; exit 1 ;; esac

      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The label approves the issue as it reads then. Its author, who may be anyone, can edit it
      # later, so every try drafts from the text the label approved. The first try takes the
      # issue's title and body from the label's event, and keeps them as the asked artifact, before
      # Claude drafts. A retry reads them from the first try's run: the latest build of this issue's
      # first try from main before the retry run that started it, each run checked as the last
      # try's is. Removing and adding the label again approves the text as it reads now, as does a
      # build started by hand (awml #120). The labels and the comments of the repository's own
      # people are read as they are now. Anyone can comment, but only the comments of the owner,
      # members and collaborators are passed on, so strangers' text never reaches the draft step
      # (awml #5).
      - name: Bring in the issue's text as it was when the label went on, and the comments of the repository's own people
        id: bring
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asked="$RUNNER_TEMP/asked"
          mkdir -p "$RUNNER_TEMP/build" "$asked"
          if [ -z "$PREVIOUS_RUN" ] && [ "$GITHUB_EVENT_NAME" = issues ]; then
            jq --argjson issue "$ISSUE" '{issue: $issue, title: .issue.title, body: (.issue.body // "")}' \
              "$GITHUB_EVENT_PATH" > "$asked/asked.json"
          elif [ -z "$PREVIOUS_RUN" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" \
              --jq '{issue: .number, title, body: (.body // "")}' > "$asked/asked.json"
          else
            retry="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/retry.yml" --jq .id)"
            build="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml" --jq .id)"
            previous="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREVIOUS_RUN")"
            if ! jq -e --argjson workflow "$retry" --arg title "Retry of issue $ISSUE, try $((ATTEMPT - 1))" \
                '.workflow_id == $workflow and .head_branch == "main" and .display_title == $title' \
                <<< "$previous" > /dev/null; then
              echo "Run $PREVIOUS_RUN isn't the retry from main of issue $ISSUE, try $((ATTEMPT - 1))."
              exit 1
            fi
            first="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --branch main \
              --created "<=$(jq -r .created_at <<< "$previous")" --limit 1000 --json databaseId,displayTitle |
              jq -r --arg title "Build of issue $ISSUE, try 1" \
                '[.[] | select(.displayTitle == $title)] | first | .databaseId // empty')"
            case "$first" in ''|*[!0-9]*) echo "Found no first try of issue $ISSUE before run $PREVIOUS_RUN."; exit 1 ;; esac
            if ! gh api "repos/$GITHUB_REPOSITORY/actions/runs/$first" |
                jq -e --argjson workflow "$build" --arg title "Build of issue $ISSUE, try 1" \
                  '.workflow_id == $workflow and .head_branch == "main" and
                    (.event | IN("issues", "workflow_dispatch")) and .display_title == $title' > /dev/null; then
              echo "Run $first isn't the build from main of issue $ISSUE, try 1."
              exit 1
            fi
            if ! gh run download "$first" --repo "$GITHUB_REPOSITORY" -n asked -D "$RUNNER_TEMP/first" ||
              ! jq -e --argjson issue "$ISSUE" \
                '.issue == $issue and (.title | type == "string") and (.body | type == "string")' \
                "$RUNNER_TEMP/first/asked.json" > /dev/null; then
              echo "The first try, run $first, kept no readable record of the issue as labelled."
              echo "To build the issue as it reads now, remove the build label and add it again."
              exit 1
            fi
            jq '{issue, title, body}' "$RUNNER_TEMP/first/asked.json" > "$asked/asked.json"
          fi
          labels="$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" --jq '[.labels[].name] | join(", ")')"
          {
            jq -r --arg labels "$labels" '"# #\(.issue): \(.title)\n\nLabels: \($labels)\n\n\(.body)\n"' \
              "$asked/asked.json"
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" \
              --jq '.[] | select(.author_association == "OWNER" or .author_association == "MEMBER" or .author_association == "COLLABORATOR")
                    | "## Comment by \(.user.login), \(.created_at)\n\n\(.body)\n"'
          } > "$RUNNER_TEMP/build/issue.md"
      - uses: actions/upload-artifact@v4
        with:
          name: asked
          path: ${{ runner.temp }}/asked

      # The retry run that started this try wrote why the last one failed: the failing check's
      # output, CI's failed log or what the reviews found.
      - name: Bring in why the last try failed
        if: env.PREVIOUS_RUN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$RUNNER_TEMP/previous"
          # Only retry.yml's run from main for this issue's last try is read.
          retry="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/retry.yml" --jq .id)"
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREVIOUS_RUN" |
              jq -e --argjson workflow "$retry" --arg title "Retry of issue $ISSUE, try $((ATTEMPT - 1))" \
                '.workflow_id == $workflow and .head_branch == "main" and .display_title == $title' > /dev/null ||
            ! gh run download "$PREVIOUS_RUN" --repo "$GITHUB_REPOSITORY" -n failed -D "$previous" ||
            [ ! -s "$previous/failed.md" ]; then
            mkdir -p "$previous"
            echo "Why the last try failed was not recorded." > "$previous/failed.md"
          fi
          {
            echo "## The last try failed (attempt $((ATTEMPT - 1)) of 3)"
            echo
            cat "$previous/failed.md"
          } >> "$RUNNER_TEMP/build/issue.md"

      # Claude Code scrubs its login token from the commands it runs inside bubblewrap, and stops
      # without it. Ubuntu's runners restrict the user namespaces bubblewrap needs, so allow them on
      # this throwaway machine, and check bubblewrap works before Claude starts.
      - name: Install Claude Code and bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --dev-bind / / --unshare-pid true
          npm install -g @anthropic-ai/claude-code

      # Claude Code holds the maintainer's login token for its own calls, and strips it, with any
      # other credential, from the commands it runs, so text that steers Claude can't send it
      # anywhere. A command running as the same user could still read Claude Code's own environment
      # (awml #121).
      - name: Draft the change
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          BUILD_DIR: ${{ runner.temp }}/build
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          prompt="$(sed "s|BUILD_DIR|$BUILD_DIR|g" .github/build-prompt.md)"
          claude -p "$prompt" --model opus --max-turns 200 --permission-mode acceptEdits \
            --allowedTools "Read" "Edit" "Write" "Glob" "Grep" \
              "Bash(go:*)" "Bash(gofmt:*)" "Bash(make:*)" "Bash(node:*)" \
              "Bash(.github/picture-drawings.sh:*)" \
              "Bash(git status:*)" "Bash(git diff:*)" "Bash(git log:*)" \
              "Bash(ls:*)" "Bash(cp:*)" "Bash(mkdir:*)"

      - name: Make the patch
        id: patch
        run: |
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/build/change.patch"
          if [ -s "$RUNNER_TEMP/build/change.patch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Claude changed nothing:"; cat "$RUNNER_TEMP/build/message.md" 2>/dev/null || true
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: change
          path: |
            ${{ runner.temp }}/build/change.patch
            ${{ runner.temp }}/build/message.md
            ${{ runner.temp }}/build/pull-request.md
            ${{ runner.temp }}/build/pictures

  # Applies the patch to the main the draft started from and runs every check from AGENTS.md, with a
  # read-only token, so Claude's code never runs where a token can push.
  check:
    needs: draft
    if: needs.draft.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Prepare the result
        run: |
          mkdir -p "$RUNNER_TEMP/result"
          echo "The workflow failed before it could check the proposed change." \
            > "$RUNNER_TEMP/result/result.txt"

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: change
          path: ${{ runner.temp }}/change

      - name: Apply the change
        run: |
          if [ ! -s "$RUNNER_TEMP/change/change.patch" ]; then
            echo "The draft job did not produce a patch." > "$RUNNER_TEMP/result/result.txt"
            exit 1
          fi
          if ! git apply --index "$RUNNER_TEMP/change/change.patch" 2> "$RUNNER_TEMP/apply.log"; then
            cat "$RUNNER_TEMP/apply.log"
            echo "The proposed change could not be applied to main." \
              > "$RUNNER_TEMP/result/result.txt"
            tail -n 150 "$RUNNER_TEMP/apply.log" > "$RUNNER_TEMP/result/output.txt"
            exit 1
          fi

      # Each check's output is kept, so that a failing one's last lines go into the result.
      - name: Run the checks
        run: |
          set -o pipefail
          run_check() {
            echo "$1" > "$RUNNER_TEMP/result/result.txt"
            shift
            if ! "$@" 2>&1 | tee "$RUNNER_TEMP/check.log"; then
              tail -n 150 "$RUNNER_TEMP/check.log" > "$RUNNER_TEMP/result/output.txt"
              exit 1
            fi
          }
          run_check "The Go tests did not pass." go test ./...
          run_check "Go vet did not pass." go vet ./...
          run_check "The example checks did not pass." \
            go run ./cmd/awml check examples/*.yaml examples/tour/*.yaml examples/platforms/*.yaml
          run_check "The WebAssembly tests did not pass." make test-wasm
          echo pass > "$RUNNER_TEMP/result/result.txt"

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: result
          path: ${{ runner.temp }}/result

  # Two fresh Claude sessions review the checked change side by side, one for bugs and one for
  # security, each its own claude run. None of them sees the drafting session or the issue's
  # thread, and none can run the change's code: they read the patch, applied to main, and the
  # repository, with no tool that runs anything but git's reads. Once both are done, a rule weighs
  # their findings. If none is Important, or this is the third try, a third fresh session sorts the
  # change by risk. The prompts and REVIEW.md come from main, before the patch is applied, so a
  # change can't alter how it's reviewed. The record goes into the review artifact, which the open
  # job, retry.yml and land.yml read as data.
  review:
    needs: [draft, check]
    if: needs.check.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      opens: ${{ steps.weigh.outputs.opens }}
    steps:
      - name: Prepare the record
        run: |
          case "$ATTEMPT" in [1-3]) ;; *) echo "The attempt must be 1, 2 or 3: $ATTEMPT"; exit 1 ;; esac
          mkdir -p "$RUNNER_TEMP/review" "$RUNNER_TEMP/record"
          echo "The reviews did not finish." > "$RUNNER_TEMP/record/result.txt"

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: change
          path: ${{ runner.temp }}/change

      - name: Apply the change, keeping main's prompts and REVIEW.md
        run: |
          review="$RUNNER_TEMP/review"
          cp .github/review-bugs-prompt.md .github/review-security-prompt.md .github/classify-prompt.md "$RUNNER_TEMP/"
          cp REVIEW.md "$review/REVIEW.md"
          for file in change.patch message.md pull-request.md; do
            [ -f "$RUNNER_TEMP/change/$file" ] && cp "$RUNNER_TEMP/change/$file" "$review/"
          done
          git apply --index "$RUNNER_TEMP/change/change.patch"

      # Claude Code scrubs its login token from the commands it runs inside bubblewrap, and stops
      # without it. Ubuntu's runners restrict the user namespaces bubblewrap needs, so allow them on
      # this throwaway machine, and check bubblewrap works before Claude starts.
      - name: Install Claude Code and bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --dev-bind / / --unshare-pid true
          npm install -g @anthropic-ai/claude-code

      # Each review is its own claude run, started together, so neither sees the other's session.
      # As in the draft, each session, and the classifier's below, keeps the login token from the
      # commands it runs (awml #121).
      - name: Review the patch for bugs and for security, side by side
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          REVIEW_DIR: ${{ runner.temp }}/review
        run: |
          review() {
            prompt="$(sed "s|REVIEW_DIR|$REVIEW_DIR|g" "$RUNNER_TEMP/$1")"
            claude -p "$prompt" --model opus --max-turns 100 --permission-mode acceptEdits \
              --add-dir "$REVIEW_DIR" \
              --allowedTools "Read" "Write" "Glob" "Grep" \
                "Bash(git diff:*)" "Bash(git log:*)" "Bash(git show:*)" "Bash(git status:*)" \
              > "$RUNNER_TEMP/$1.log" 2>&1
          }
          review review-bugs-prompt.md &
          bugs=$!
          review review-security-prompt.md &
          security=$!
          status=0
          wait "$bugs" || status=1
          wait "$security" || status=1
          for log in review-bugs-prompt.md review-security-prompt.md; do
            echo "::group::$log"
            cat "$RUNNER_TEMP/$log.log"
            echo "::endgroup::"
          done
          exit "$status"

      # Each review's file must be a list of findings, each ranked. They're kept together, each
      # saying which review found it. An Important finding before the third try sends the change to
      # retry.yml; otherwise the classifier runs and the pull request opens.
      - name: Weigh the findings
        id: weigh
        run: |
          review="$RUNNER_TEMP/review"
          record="$RUNNER_TEMP/record"
          echo '[]' > "$record/findings.json"
          for kind in bug security; do
            case "$kind" in bug) file="$review/bugs.json" ;; *) file="$review/security.json" ;; esac
            if ! jq -e 'type == "array" and length <= 50 and all(.[];
                type == "object" and
                (.severity | IN("Important", "Nit", "Pre-existing")) and
                (.file | type == "string") and (.line | type == "number" and . >= 0) and
                (.title | type == "string") and (.detail | type == "string"))' "$file" > /dev/null; then
              echo "The $kind review left no readable record of its findings." | tee "$record/result.txt"
              exit 1
            fi
            jq --arg kind "$kind" --slurpfile found "$file" \
              '. + [$found[0][] | {review: $kind, severity, file, line: (.line | floor), title, detail}]' \
              "$record/findings.json" > "$record/merged.json"
            mv "$record/merged.json" "$record/findings.json"
          done
          cp "$record/findings.json" "$review/findings.json"
          jq . "$record/findings.json"
          important="$(jq '[.[] | select(.severity == "Important")] | length' "$record/findings.json")"
          if [ "$important" -gt 0 ] && [ "$ATTEMPT" != 3 ]; then
            if [ "$important" -eq 1 ]; then
              echo "The reviews found 1 Important finding." > "$record/result.txt"
            else
              echo "The reviews found $important Important findings." > "$record/result.txt"
            fi
            echo "opens=false" >> "$GITHUB_OUTPUT"
          else
            echo "The classifier did not finish." > "$record/result.txt"
            echo "opens=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sort the change by risk
        if: steps.weigh.outputs.opens == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          REVIEW_DIR: ${{ runner.temp }}/review
        run: |
          prompt="$(sed "s|REVIEW_DIR|$REVIEW_DIR|g" "$RUNNER_TEMP/classify-prompt.md")"
          claude -p "$prompt" --model opus --max-turns 100 --permission-mode acceptEdits \
            --add-dir "$REVIEW_DIR" \
            --allowedTools "Read" "Write" "Glob" "Grep" \
              "Bash(git diff:*)" "Bash(git log:*)" "Bash(git show:*)" "Bash(git status:*)"

      - name: Read the classifier's verdict
        if: steps.weigh.outputs.opens == 'true'
        run: |
          record="$RUNNER_TEMP/record"
          if ! jq -e '(.needs_review | type == "boolean") and
              (.reasons | type == "array" and length >= 1 and all(.[]; type == "string"))' \
              "$RUNNER_TEMP/review/classification.json" > /dev/null; then
            echo "The classifier left no readable verdict." | tee "$record/result.txt"
            exit 1
          fi
          jq '{needs_review, reasons: .reasons[0:5]}' "$RUNNER_TEMP/review/classification.json" \
            > "$record/classification.json"
          echo pass > "$record/result.txt"
          jq . "$record/classification.json"

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: review
          path: ${{ runner.temp }}/record

  # Pushes the branch and the pictures and opens the pull request, once the checks pass and the
  # classifier has run, and closes the build's earlier pull request for the issue if it opened a new
  # one. It runs none of the proposed code. It applies the patch to main as it is now, not the main
  # the draft started from, so a change that landed on main meanwhile, such as one to a workflow
  # the app may not push, isn't pushed back as part of this one. If the patch no longer applies,
  # the retry job sends it to retry.yml. The checks ran on the older main, but land.yml waits for CI
  # on the newer one before anything merges.
  open:
    needs: [draft, check, review]
    if: ${{ always() && needs.draft.result == 'success' && needs.draft.outputs.changed == 'true' && needs.check.result == 'success' && needs.review.result == 'success' && needs.review.outputs.opens == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The Actions token only reads and edits the status comment here. The app's token pushes and
    # opens the pull request.
    permissions:
      contents: read
      issues: write
    outputs:
      applies: ${{ steps.commit.outputs.applies }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: change
          path: ${{ runner.temp }}/change
      - uses: actions/download-artifact@v4
        with:
          name: result
          path: ${{ runner.temp }}/result
      - uses: actions/download-artifact@v4
        with:
          name: review
          path: ${{ runner.temp }}/review

      - name: Read the check result
        run: |
          if [ "$(cat "$RUNNER_TEMP/result/result.txt" 2> /dev/null)" != pass ]; then
            echo "The check job did not pass."
            exit 1
          fi

      # The draft job ran the change's own code, so its pictures are taken on trust only as far as
      # this: every path is checked, and only PNG files under the size cap are kept. If any picture
      # fails, all are left out and the description says why, since the change itself is still good.
      - name: Check the pictures
        id: pictures
        run: |
          pictures="$RUNNER_TEMP/change/pictures"
          media="$RUNNER_TEMP/media"
          mkdir -p "$media"
          : > "$RUNNER_TEMP/pictures.txt"
          : > "$RUNNER_TEMP/pictures-left-out.txt"
          leave_out() {
            echo "::warning::$1"
            echo "$1" > "$RUNNER_TEMP/pictures-left-out.txt"
            : > "$RUNNER_TEMP/pictures.txt"
            rm -rf "$media"
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          }
          safe_path() {
            case "$1" in ''|/*|*..*|*[!A-Za-z0-9._/-]*) return 1 ;; esac
          }
          take() {
            safe_path "$1" && case "$1" in *.png) ;; *) return 1 ;; esac || return 1
            [ -f "$pictures/$1" ] && [ ! -L "$pictures/$1" ] || return 1
            [ "$(stat -c %s "$pictures/$1")" -le $((5 * 1024 * 1024)) ] || return 1
            [ "$(head -c 8 "$pictures/$1" | od -An -tx1 | tr -d ' \n')" = 89504e470d0a1a0a ] || return 1
            mkdir -p "$(dirname "$media/$1")"
            cp "$pictures/$1" "$media/$1"
          }
          if [ ! -f "$pictures/manifest.json" ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A bar can't be in a checked path, so it parts the fields where a tab, being blank, wouldn't.
          rows="$(jq -r '.[] | [.example, .before, .after] | join("|")' "$pictures/manifest.json")" \
            || leave_out "The pictures' manifest could not be read."
          count=0
          if [ -z "$rows" ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS='|' read -r example before after; do
            safe_path "$example" && case "$example" in *.svg) ;; *) false ;; esac \
              || leave_out "The pictures' manifest names an example that isn't an SVG path."
            if [ -n "$before" ]; then
              take "$before" || leave_out "A before picture of $example isn't a PNG under 5 MB at a plain path."
              count=$((count + 1))
            fi
            take "$after" || leave_out "An after picture of $example isn't a PNG under 5 MB at a plain path."
            count=$((count + 1))
            [ "$count" -le 80 ] || leave_out "There are more than 80 pictures, too many to show."
            printf '%s|%s|%s\n' "$example" "$before" "$after" >> "$RUNNER_TEMP/pictures.txt"
          done <<< "$rows"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      # If the patch no longer applies to main as it is now, the job says so in its own record and
      # stops without failing, and the retry job sends the build to retry.yml. Once the patch is
      # applied, the workspace holds the change's code and later steps hold the app's token, so
      # nothing after this runs from the workspace: main's script for the description is copied out
      # first.
      - name: Apply the change to main as it is now
        id: commit
        run: |
          mkdir -p "$RUNNER_TEMP/open"
          cp .github/pull-request-body.sh "$RUNNER_TEMP/pull-request-body.sh"
          if ! git apply --index "$RUNNER_TEMP/change/change.patch" 2> "$RUNNER_TEMP/apply.log"; then
            cat "$RUNNER_TEMP/apply.log"
            echo "The change no longer applies to main as it is now." > "$RUNNER_TEMP/open/result.txt"
            tail -n 150 "$RUNNER_TEMP/apply.log" > "$RUNNER_TEMP/open/output.txt"
            echo "applies=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "applies=true" >> "$GITHUB_OUTPUT"
          echo "branch=build/issue-$ISSUE" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.commit.outputs.applies == 'false'
        with:
          name: open
          path: ${{ runner.temp }}/open

      - name: Make the app's token
        id: app
        if: steps.commit.outputs.applies == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}

      # The commit is the app's, as its push is.
      - name: Commit the change as the app's bot
        if: steps.commit.outputs.applies == 'true'
        env:
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          id="$(gh api "users/$APP_SLUG%5Bbot%5D" --jq .id)"
          message="$RUNNER_TEMP/commit.md"
          cat "$RUNNER_TEMP/change/message.md" > "$message" 2> /dev/null || true
          [ -s "$message" ] || echo "Build #$ISSUE" > "$message"
          printf '\n\nCloses #%s\n' "$ISSUE" >> "$message"
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$id+$APP_SLUG[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git -c core.hooksPath=/dev/null commit -q -F "$message"

      # What land.yml needs from this build: the commit it pushes, the commit of main it applied the
      # patch to, the try, who to ask, the app's bot that opens the pull request, and the pictures. It goes up before the push, so it's there
      # before CI can finish.
      - name: Write the build's record
        if: steps.commit.outputs.applies == 'true'
        env:
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          record="$RUNNER_TEMP/pull-request"
          mkdir -p "$record"
          jq -n --argjson issue "$ISSUE" --argjson attempt "$ATTEMPT" --arg requested_by "$REQUESTED_BY" \
            --arg commit "$(git rev-parse HEAD)" --arg base "$(git rev-parse HEAD^)" --arg bot "$APP_SLUG[bot]" \
            '{issue: $issue, attempt: $attempt, requested_by: $requested_by, commit: $commit, base: $base, bot: $bot}' \
            > "$record/build.json"
          cp "$RUNNER_TEMP/pictures.txt" "$RUNNER_TEMP/pictures-left-out.txt" "$record/"
          title="$(head -n 1 "$RUNNER_TEMP/change/message.md" 2> /dev/null || true)"
          [ -n "$title" ] || title="Build #$ISSUE"
          printf '%s\n' "$title" > "$record/title.txt"
          cat "$record/build.json"
      - uses: actions/upload-artifact@v4
        if: steps.commit.outputs.applies == 'true'
        with:
          name: pull-request
          path: ${{ runner.temp }}/pull-request

      # A new try's commit hasn't been judged, so a merge an earlier try set on the branch's open
      # pull request is turned off before it's pushed.
      - name: Push the branch
        if: steps.commit.outputs.applies == 'true'
        env:
          BRANCH: ${{ steps.commit.outputs.branch }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          auto="$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=$GITHUB_REPOSITORY_OWNER:$BRANCH&base=main&state=open" \
            --jq '[.[] | select(.auto_merge != null) | .number] | first // empty')"
          case "$auto" in *[!0-9]*) echo "The open pull request's number isn't a number: $auto"; exit 1 ;; esac
          if [ -n "$auto" ]; then
            gh pr merge "$auto" --repo "$GITHUB_REPOSITORY" --disable-auto
          fi
          git -c core.hooksPath=/dev/null \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push --force origin "HEAD:refs/heads/$BRANCH"

      # The pictures go to the factory-media branch, which holds nothing else and shares no history
      # with main. Each try adds a commit with its own folder, so the links in older descriptions
      # keep working.
      - name: Push the pictures to the factory-media branch
        if: steps.commit.outputs.applies == 'true' && steps.pictures.outputs.count != '0'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_INDEX_FILE="$RUNNER_TEMP/media.index"
          parent=""
          status=0
          git -c http.https://github.com/.extraheader="$auth" \
            ls-remote --exit-code origin refs/heads/factory-media > /dev/null || status=$?
          case "$status" in
            0)
              git -c http.https://github.com/.extraheader="$auth" \
                fetch --no-tags --depth=1 origin refs/heads/factory-media
              parent="$(git rev-parse FETCH_HEAD)"
              git read-tree "$parent"
              ;;
            2) git read-tree --empty ;;
            *) echo "Could not read the factory-media branch."; exit 1 ;;
          esac
          (cd "$RUNNER_TEMP/media" && find . -type f -name '*.png' | sed 's|^\./||') |
          while IFS= read -r path; do
            blob="$(git hash-object -w "$RUNNER_TEMP/media/$path")"
            git update-index --add --cacheinfo "100644,$blob,issue-$ISSUE/attempt-$ATTEMPT/$path"
          done
          tree="$(git write-tree)"
          commit="$(git commit-tree "$tree" ${parent:+-p "$parent"} \
            -m "Pictures for #$ISSUE, attempt $ATTEMPT")"
          git -c core.hooksPath=/dev/null -c http.https://github.com/.extraheader="$auth" \
            push origin "$commit:refs/heads/factory-media"

      # Before CI has run, the description says why the change will need review if the reviews or
      # the classifier have already said so. land.yml writes it again with the rule's verdict once
      # CI has passed.
      - name: Write the pull request's description
        if: steps.commit.outputs.applies == 'true'
        env:
          BUILD_RUN: ${{ github.run_id }}
          CHANGE_DIR: ${{ runner.temp }}/change
          REVIEW_DIR: ${{ runner.temp }}/review
          PICTURES: ${{ runner.temp }}/pictures.txt
          PICTURES_LEFT_OUT: ${{ runner.temp }}/pictures-left-out.txt
        run: |
          export MEDIA_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/raw/factory-media/issue-$ISSUE/attempt-$ATTEMPT"
          "$RUNNER_TEMP/pull-request-body.sh" > "$RUNNER_TEMP/pull-request.md"
          cat "$RUNNER_TEMP/pull-request.md"

      # gh pr view finds a branch's closed or merged pull request when it has no open one, so only
      # GitHub's list of the branch's open pull requests decides whether there's one to update. If
      # there's none, a new one is opened.
      - name: Open or update the pull request
        id: pull
        if: steps.commit.outputs.applies == 'true'
        env:
          BRANCH: ${{ steps.commit.outputs.branch }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          title="$(cat "$RUNNER_TEMP/pull-request/title.txt")"
          number="$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=$GITHUB_REPOSITORY_OWNER:$BRANCH&base=main&state=open" \
            --jq '[.[] | .number] | first // empty')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --body-file "$RUNNER_TEMP/pull-request.md"
            opened=false
          else
            url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "$title" --body-file "$RUNNER_TEMP/pull-request.md")"
            number="${url##*/}"
            opened=true
          fi
          case "$number" in ''|*[!0-9]*) echo "The pull request's number isn't a number: $number"; exit 1 ;; esac
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "opened=$opened" >> "$GITHUB_OUTPUT"

      # A closed pull request is never updated: the build opens a new one and closes any earlier one
      # of its own for the issue (awml #125). So once it has opened a new one, every earlier pull
      # request the app opened from the branch that didn't merge is closed, with a comment naming
      # the new one. One a person already closed gets the comment too, once. A pull request someone
      # else opened, or one that merged, is left alone.
      - name: Close the build's earlier pull requests for this issue
        id: retire
        if: steps.pull.outputs.opened == 'true'
        env:
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_NUMBER: ${{ steps.pull.outputs.number }}
        run: |
          case "$PR_NUMBER" in ''|*[!0-9]*) echo "The pull request must be a number: $PR_NUMBER"; exit 1 ;; esac
          bot="$APP_SLUG[bot]"
          printf '<!-- factory-replaced -->\nReplaced by #%s, the pull request the build of #%s opened in its place.\n' \
            "$PR_NUMBER" "$ISSUE" > "$RUNNER_TEMP/replaced.md"
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?head=$GITHUB_REPOSITORY_OWNER:$BRANCH&state=all" |
            jq -r --arg bot "$bot" --argjson new "$PR_NUMBER" \
              '.[] | select(.user.login == $bot and .number != $new and .merged_at == null) | "\(.number) \(.state)"' |
            while read -r number state; do
              case "$number" in ''|*[!0-9]*) echo "A pull request's number isn't a number: $number"; exit 1 ;; esac
              said="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$number/comments" |
                jq -n --arg bot "$bot" \
                  '[inputs[] | select(.user.login == $bot and (.body | contains("<!-- factory-replaced -->")))] | length')"
              if [ "$said" = 0 ]; then
                gh pr comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/replaced.md"
              fi
              if [ "$state" = open ]; then
                gh pr close "$number" --repo "$GITHUB_REPOSITORY"
              fi
            done

      # Once the pull request is open, the status comment links it. If this job failed after the
      # checks and reviews passed, retry.yml won't hear of it, so this says so here, and in a new
      # comment too, since GitHub sends no notification for an edit. A patch that no longer applies
      # is left to retry.yml.
      - name: Edit the status comment
        if: ${{ !cancelled() && steps.commit.outputs.applies != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          PR_NUMBER: ${{ steps.pull.outputs.number }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          here="$RUNNER_TEMP/status"
          mkdir -p "$here"
          {
            echo "<!-- factory-status -->"
            if [ "$JOB_STATUS" = success ]; then
              printf '**Opened** #%s, which waits for CI. Then the build rule decides whether it merges by itself or waits for a review. [The run](%s)\n' "$PR_NUMBER" "$run_url"
            else
              printf '**The build failed** while opening the pull request (try %s of 3). [The run](%s)\n' "$ATTEMPT" "$run_url"
            fi
          } > "$here/comment.md"
          id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- factory-status -->"))) | .id' |
            tail -n 1)"
          if [ -n "$id" ]; then
            jq -n --rawfile body "$here/comment.md" '{body: $body}' |
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" --input - > /dev/null
          else
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$here/comment.md"
          fi
          if [ "$JOB_STATUS" != success ]; then
            {
              echo "**The build failed while opening the pull request, after its checks and reviews had passed.**"
              echo
              if [ -n "$PR_NUMBER" ]; then
                printf -- '- It opened #%s, but a later step failed. The run says which.\n' "$PR_NUMBER"
              else
                echo "- The run says which step failed."
              fi
              echo "- To try again, remove the build label and add it again."
              echo
              echo "[The run]($run_url)"
            } > "$here/failure.md"
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$here/failure.md"
          fi

  # Starts retry-a-build when this try failed: the draft failed or ran out of time or changed
  # nothing, a check failed, the reviews found something Important before the third try or didn't
  # finish, or the patch no longer applies to main. retry.yml reads why from this run. It doesn't
  # run when the whole run was cancelled because a newer build of the same issue replaced it. It
  # checks out nothing and runs only gh.
  retry:
    needs: [draft, check, review, open]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || github.event.label.name == 'build') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start retry-a-build with why this try failed
        env:
          GH_TOKEN: ${{ github.token }}
          OPEN: ${{ needs.open.result }}
          APPLIES: ${{ needs.open.outputs.applies }}
        run: |
          case "$ISSUE" in ''|*[!0-9]*) echo "The issue must be a number: $ISSUE"; exit 1 ;; esac
          case "$ATTEMPT" in [1-3]) ;; *) echo "The attempt must be 1, 2 or 3: $ATTEMPT"; exit 1 ;; esac
          # The open job ran, so this try reached the end, unless its patch no longer applied. If
          # it failed after that, it said so itself.
          if [ "$OPEN" != skipped ] && [ "$APPLIES" != false ]; then
            echo "The build opened its pull request, or said itself why it couldn't."
            exit 0
          fi
          gh workflow run retry.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f issue="$ISSUE" -f attempt="$ATTEMPT" -f requested_by="$REQUESTED_BY" -f run="$GITHUB_RUN_ID"
