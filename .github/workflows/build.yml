# An issue the maintainer labels build becomes a pull request. The repository is public, so
# everything here sits in one scope: what matters is who may act. Only people with write access,
# and the repository's own app, can add a label, so the label is the decision. The build says on
# the issue that it has started. Claude drafts with a read-only token, and as part of its draft
# redraws the examples the change alters and pictures those that look different. The app then
# pushes the branch and the pictures and opens the pull request. The build runs no checks of its
# own: CI judges the commit when the pull request opens, as it judges every pull request, and
# land.yml, fix.yml and retry.yml each wake on CI finishing, reading GitHub rather than anything
# this workflow writes. A draft that touches .github/ or Claude Code's own files is offered on the
# issue instead, and the build stops.
# Drawn in .github/drawings/issue-to-pull-request.yaml
name: Build from an issue
# Each build's run is named for its issue, so retry.yml counts the builds of an issue by their runs.
run-name: ${{ (github.event_name == 'workflow_dispatch' || github.event.label.name == 'build') && format('Build of issue {0}', inputs.issue || github.event.issue.number) || format('A label added to issue {0}', github.event.issue.number) }}

# Before it works, a repository needs:
# - a GitHub App with read and write access to contents, pull requests and issues, installed on the
#   repository, with its app id in a FACTORY_APP_ID secret and a private key in FACTORY_APP_KEY. It
#   must not have the workflows permission, so GitHub refuses any push of its that changes a
#   workflow, whatever the factory's own guards miss;
# - a CLAUDE_CODE_OAUTH_TOKEN secret, made with `claude setup-token`, so the runs come out of the
#   maintainer's subscription rather than a metered API key;
# - a build label.
#
# The app pushes and opens, because GitHub starts other workflows from what an app does but not
# from what the Actions token does, so CI runs on the pull request. The open job mints the app's
# token, for this repository alone, and gives it only to the steps that push and open. Comments use
# the Actions token.
on:
  issues:
    types: [labeled]
  # retry.yml starts each try after the first with only the issue's number, and a person can start
  # one by hand. The build trusts nothing else from it: it checks the label and the issue's last
  # edit itself.
  workflow_dispatch:
    inputs:
      issue:
        description: The number of the issue to build
        required: true

# Each label added to an issue starts a run, and the app opens an issue with three labels at once. So
# only a build has the issue's group, and a run for any other label can't cancel the build.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || github.event.label.name == 'build') && format('build-issue-{0}', inputs.issue || github.event.issue.number) || format('build-other-label-{0}', github.run_id) }}
  cancel-in-progress: true

env:
  ISSUE: ${{ inputs.issue || github.event.issue.number }}

jobs:
  # Says on the issue that the build has started, in a new comment linking the run. A build started
  # by dispatch first checks, from GitHub's record, that the issue still carries the build label and
  # hasn't been edited since the label was last added, by comparing GraphQL's lastEditedAt with the
  # label's last labelled event. If not, a new comment asks for the label again, and nothing is
  # drafted. It checks out nothing and runs only gh.
  start:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    outputs:
      go: ${{ steps.still.outputs.go }}
    steps:
      - name: "Sort by GitHub's record: does the issue still carry the build label, unedited since it was added?"
        id: still
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          case "$ISSUE" in ''|*[!0-9]*) echo "The issue must be a number: $ISSUE"; exit 1 ;; esac
          if [ "$EVENT" != workflow_dispatch ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          owner="${GITHUB_REPOSITORY%%/*}"
          name="${GITHUB_REPOSITORY#*/}"
          issue="$(gh api graphql -F owner="$owner" -F name="$name" -F number="$ISSUE" -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                issue(number: $number) { lastEditedAt labels(first: 100) { nodes { name } } }
              }
            }' --jq .data.repository.issue)"
          # A rename doesn't change lastEditedAt, so the issue's renamed events count as edits too.
          events="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE/events?per_page=100" \
            --jq '.[] | select((.event == "labeled" and .label.name == "build") or .event == "renamed") | {event, created_at}' | jq -s .)"
          labelled="$(jq -r '[.[] | select(.event == "labeled")] | last | .created_at // ""' <<< "$events")"
          renamed="$(jq -r '[.[] | select(.event == "renamed")] | last | .created_at // ""' <<< "$events")"
          edited="$(jq -r '.lastEditedAt // ""' <<< "$issue")"
          if [[ "$renamed" > "$edited" ]]; then edited="$renamed"; fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if ! jq -e '[.labels.nodes[].name] | index("build")' <<< "$issue" > /dev/null || [ -z "$labelled" ]; then
            why="This issue no longer carries the build label"
          elif [ -n "$edited" ] && ! [[ "$edited" < "$labelled" ]]; then
            why="This issue was edited or renamed after the build label was last added"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '**The build stopped before drafting.** %s, so the build no longer knows the text was approved. To build it as it reads now, remove the build label and add it again. [The run](%s)\n' \
            "$why" "$run_url" > "$RUNNER_TEMP/stopped.md"
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/stopped.md"
          echo "go=false" >> "$GITHUB_OUTPUT"

      - name: Post a new comment that the build has started
        id: started
        if: steps.still.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          printf '**Building this issue.** [The run](%s)\n' "$run_url" > "$RUNNER_TEMP/started.md"
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/started.md"

  # Claude works here with a read-only token, sees only the issue's text if it's unedited since the
  # label was last added, the comments of the repository's own people, and why the last try failed,
  # and hands back a patch. Once its checks pass, it redraws the examples its change alters with
  # .github/picture-drawings.sh, which puts the redrawn SVGs into the change and pictures, before
  # and after, those that look different. The job runs nothing of its own beside the login token:
  # Claude runs its commands, the tests among them, in its sandbox.
  draft:
    needs: start
    if: needs.start.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      issues: read
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
      digest: ${{ steps.pack.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      # The label approves the issue as it reads then. Its author, who may be anyone, can edit it
      # later, so the issue's title and body are read, with GraphQL's lastEditedAt in the same
      # answer, and kept only if it hasn't been edited since the label's last labelled event.
      # Removing and adding the label again approves the text as it reads now (awml #120). The
      # label approves what the page shows, so the issue and its comments are read as GitHub renders
      # them, bodyHTML, never the Markdown behind them, whose HTML comments the page hides (#150).
      # Anyone can comment, but only the comments of the owner, members and collaborators are passed
      # on, so strangers' text never reaches the draft step (awml #5). Main's AGENTS.md and REVIEW.md
      # are kept with them before Claude starts, so a session that edits them still follows main's.
      - name: Keep the issue's text, unedited since the label, and the comments of the repository's own people
        id: keep
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$ISSUE" in ''|*[!0-9]*) echo "The issue must be a number: $ISSUE"; exit 1 ;; esac
          build="$RUNNER_TEMP/build"
          mkdir -p "$build"
          cp AGENTS.md REVIEW.md "$build/"
          cp .github/build-prompt.md .github/sandbox-settings.sh "$RUNNER_TEMP/"
          owner="${GITHUB_REPOSITORY%%/*}"
          name="${GITHUB_REPOSITORY#*/}"
          issue="$(gh api graphql -F owner="$owner" -F name="$name" -F number="$ISSUE" -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                issue(number: $number) { number title bodyHTML lastEditedAt labels(first: 100) { nodes { name } } }
              }
            }' --jq .data.repository.issue)"
          # A rename doesn't change lastEditedAt, so the issue's renamed events count as edits too.
          events="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE/events?per_page=100" \
            --jq '.[] | select((.event == "labeled" and .label.name == "build") or .event == "renamed") | {event, created_at}' | jq -s .)"
          labelled="$(jq -r '[.[] | select(.event == "labeled")] | last | .created_at // ""' <<< "$events")"
          renamed="$(jq -r '[.[] | select(.event == "renamed")] | last | .created_at // ""' <<< "$events")"
          edited="$(jq -r '.lastEditedAt // ""' <<< "$issue")"
          if [[ "$renamed" > "$edited" ]]; then edited="$renamed"; fi
          if [ -z "$labelled" ]; then
            echo "The issue has never had the build label."
            exit 1
          fi
          if [ -n "$edited" ] && ! [[ "$edited" < "$labelled" ]]; then
            echo "The issue was edited or renamed at $edited, after the build label was last added at $labelled, so it isn't drafted from."
            exit 1
          fi
          {
            jq -r '"# #\(.number): \(.title)\n\nLabels: \([.labels.nodes[].name] | join(", "))\n\n\(.bodyHTML // "")\n"' <<< "$issue"
            gh api graphql --paginate -F owner="$owner" -F name="$name" -F number="$ISSUE" -f query='
              query($owner: String!, $name: String!, $number: Int!, $endCursor: String) {
                repository(owner: $owner, name: $name) {
                  issue(number: $number) {
                    comments(first: 100, after: $endCursor) {
                      nodes { authorAssociation author { login } createdAt bodyHTML }
                      pageInfo { hasNextPage endCursor }
                    }
                  }
                }
              }' --jq '.data.repository.issue.comments.nodes[] | select(.authorAssociation | IN("OWNER", "MEMBER", "COLLABORATOR"))
                | "## Comment by \(.author.login // "ghost"), \(.createdAt)\n\n\(.bodyHTML)\n"'
          } > "$build/issue.md"

      # Why the last try failed: the failed tests' log of CI's latest pull_request run on the issue's
      # branch in this repository, if it failed. It's the output of the branch's code, so Claude
      # reads it as untrusted.
      - name: Bring in the failed tests' log of CI's latest run on the issue's branch
        id: failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="build/issue-$ISSUE"
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=$branch&event=pull_request&per_page=20" |
            jq -r --arg repository "$GITHUB_REPOSITORY" '[.workflow_runs[]
              | select(.head_repository.full_name == $repository and .status == "completed")]
              | first | select(. != null and .conclusion == "failure") | .id')"
          case "$run" in
            '') echo "CI hasn't failed on $branch, so there's no failed log."; exit 0 ;;
            *[!0-9]*) echo "CI's run isn't a number: $run"; exit 1 ;;
          esac
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" \
            --jq '.jobs[] | select((.name | startswith("test (")) and .conclusion == "failure") | .id' |
          while read -r job; do
            case "$job" in ''|*[!0-9]*) continue ;; esac
            gh run view --repo "$GITHUB_REPOSITORY" --job "$job" --log-failed || true
          done | tail -n 300 > "$RUNNER_TEMP/failed.log"
          # Only a failed test's log is a reason a test failed: a run that failed by a review alone
          # leaves no failed.md, whose presence tells Claude a test failed.
          if [ -s "$RUNNER_TEMP/failed.log" ]; then mv "$RUNNER_TEMP/failed.log" "$RUNNER_TEMP/build/failed.md"; fi

      # The session runs offline, so nothing it runs can carry data out through a proxy. Its home's
      # Go module cache is filled here, before it starts, by fetching alone: go mod download, from the
      # module proxy alone with no version control to fall back on, runs no module's code. The
      # renderer's packages, at the versions examples/render.sh asks for, go into npm's cache the
      # same way, with their scripts off, from an empty folder, reading no npm config but naming
      # npm's registry, so nothing in the tree, an .npmrc or a node_modules, changes what npx runs,
      # which is only true. A draft that needs a module or package not fetched here fails, which the
      # prompt says.
      - name: Fill the session's Go module and npm caches, by fetching alone
        id: caches
        run: |
          home="$RUNNER_TEMP/session/home"
          mkdir -p "$home"
          HOME="$home" GOTOOLCHAIN=local GOPROXY=https://proxy.golang.org GOVCS='*:off' go mod download
          (cd "$(mktemp -d)" && HOME="$home" npm_config_userconfig=/dev/null npm_config_globalconfig=/dev/null npm_config_registry=https://registry.npmjs.org/ PUPPETEER_SKIP_DOWNLOAD=true npm_config_ignore_scripts=true npx --yes -p @mermaid-js/mermaid-cli@11.4.1 -p mermaid@11.17.2 -- true)

      # Claude Code runs its commands in a sandbox, bubblewrap with socat for its network, so that it
      # can scrub its login token from them, and they can't start without both. Ubuntu's runners
      # restrict the user namespaces bubblewrap needs, so allow them on this throwaway machine, and
      # check bubblewrap works before Claude starts. Installing Claude Code runs nothing from the
      # change.
      - name: Install Claude Code and bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --dev-bind / / --unshare-pid true
          npm install -g @anthropic-ai/claude-code@2.1.312

      # Claude Code holds the maintainer's login token for its own calls, and strips it, with any
      # other credential, from the commands it runs, so text that steers Claude can't send it
      # anywhere (awml #121). It loads only the user's settings and no MCP servers, since Claude
      # Code picks up a settings file or a .mcp.json that appears in its tree while it runs. It reads
      # only the working tree and its own folder, never /proc, and can't change .git. Its log is
      # shown with workflow commands stopped.
      # Its commands run in Claude Code's sandbox, set in the user settings of a home of its own by
      # main's .github/sandbox-settings.sh: each in a PID namespace of its own, where it can't read
      # Claude Code's environment through /proc, offline, and unable to write .git, the runner's files
      # or the baseline the tree is checked against after the session (#131). The scrub forces the
      # permission mode to default, so every tool the session needs is allowed by name.
      # The step is one { } group, which bash parses whole before it starts, and its sandbox can't
      # write the step's own script, "$0", so nothing a command writes there runs after the session.
      - name: Draft the change
        id: draft
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          BUILD_DIR: ${{ runner.temp }}/build
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
          PUPPETEER_SKIP_DOWNLOAD: "true"
          GOPROXY: "off"
          GOFLAGS: -mod=mod
          GOTOOLCHAIN: local
          GOSUMDB: "off"
          npm_config_offline: "true"
        run: |
          {
            stop="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
            echo "::stop-commands::$stop"
            trap 'echo "::$stop::"' EXIT
            mkdir -p "$RUNNER_TEMP/baseline"
            cp .git/config "$RUNNER_TEMP/baseline/git-config"
            stat -c %d:%i "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.git" > "$RUNNER_TEMP/baseline/folders"
            bash "$RUNNER_TEMP/sandbox-settings.sh" "$RUNNER_TEMP/session/home" "$GITHUB_WORKSPACE" workspace "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/change" "$0"
            prompt="$(sed "s|BUILD_DIR|$BUILD_DIR|g" "$RUNNER_TEMP/build-prompt.md")"
            status=0
            HOME="$RUNNER_TEMP/session/home" claude -p "$prompt" --model opus --max-turns 200 --permission-mode default \
              --setting-sources user --strict-mcp-config --add-dir "$BUILD_DIR" \
              --disallowedTools "Read(//proc/**)" "Edit(./.git/**)" "Write(./.git/**)" \
              --allowedTools "Read(./**)" "Read(/$BUILD_DIR/**)" "Edit(./**)" "Edit(/$BUILD_DIR/**)" "Glob" "Grep" \
                "Bash(go:*)" "Bash(gofmt:*)" "Bash(make:*)" "Bash(node:*)" \
                "Bash(.github/picture-drawings.sh:*)" \
                "Bash(git status:*)" "Bash(git diff:*)" "Bash(git log:*)" \
                "Bash(ls:*)" "Bash(cp:*)" "Bash(mkdir:*)" \
              > "$RUNNER_TEMP/draft.log" 2>&1 || status=$?
            cat "$RUNNER_TEMP/draft.log"
            exit "$status"
          }

      # Git runs here, beside no login token, only if .git/config is the copy taken before the
      # session, with no global or system config, no hooks, no fsmonitor, no external diff and no
      # textconv, so nothing a session's commands left in .git or the tree can make git run it.
      - name: Make the patch
        id: patch
        run: |
          git() { GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 command git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c diff.external= "$@"; }
          if ! cmp -s .git/config "$RUNNER_TEMP/baseline/git-config" || [ -e .git/config.worktree ]; then
            echo "The session's tree has a .git config other than the one it started with, so git isn't run on it."
            exit 1
          fi
          if [ "$(stat -c %d:%i "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.git")" != "$(cat "$RUNNER_TEMP/baseline/folders")" ]; then
            echo "The workspace or its .git isn't the folder it was before the session, so git isn't run on it."
            exit 1
          fi
          if [ -n "$(find . -path ./.git -prune -o -name .git -print -quit)" ]; then
            echo "The session left a .git below the top of the tree, which git would take as a submodule, so git isn't run on it."
            exit 1
          fi
          change="$RUNNER_TEMP/change"
          rm -rf "$change"
          mkdir "$change"
          git add -A
          git diff --cached --binary --no-ext-diff --no-textconv > "$change/change.patch"
          for file in message.md pull-request.md; do
            if [ -f "$RUNNER_TEMP/build/$file" ]; then cp "$RUNNER_TEMP/build/$file" "$change/"; fi
          done
          if [ -d "$RUNNER_TEMP/build/pictures" ]; then cp -R "$RUNNER_TEMP/build/pictures" "$change/"; fi
          if [ -s "$change/change.patch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Everything the session wrote is scanned for anything like the login token before it's
      # uploaded, since the artifact is public: only the lines the patch adds are read, since the
      # rest are main's. The drawings carry their fonts and their own data as long runs of base64,
      # which aren't tokens, and nor is a long name with no digit in it, such as a test's. The
      # folder's sha256 is the job's output, which the open job checks the artifact against.
      - name: Keep the change, with its digest, if it carries no login token
        id: pack
        run: |
          change="$RUNNER_TEMP/change"
          if [ -n "$(find "$change" ! -type f ! -type d -print -quit)" ]; then
            echo "The kept change holds a symbolic link or something else that isn't a plain file, so it isn't kept."
            exit 1
          fi
          looks_like_token() {
            LC_ALL=C sed -E 's#base64,[A-Za-z0-9+/]+=*##g; s#data-points="[A-Za-z0-9+/]+=*"##g' |
              LC_ALL=C grep -aoiE 'sk-ant-|[A-Za-z0-9_-]{80,}' | grep -iE 'sk-ant-|[0-9]' > /dev/null
          }
          while IFS= read -r -d '' file; do
            if [ "$file" = "$change/change.patch" ]; then
              if LC_ALL=C grep -a '^+' "$file" | looks_like_token; then
                echo "The draft's patch adds what looks like a login token, so the change isn't kept."
                exit 1
              fi
            elif looks_like_token < "$file"; then
              echo "The draft's ${file#"$change/"} carries what looks like a login token, so the change isn't kept."
              exit 1
            fi
          done < <(find "$change" -type f -print0)
          digest() { (cd "$1" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum) | sha256sum | cut -c 1-64; }
          echo "digest=$(digest "$change")" >> "$GITHUB_OUTPUT"

      # Kept for 30 days, so a draft offered on the issue can be downloaded for that long.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: change
          path: ${{ runner.temp }}/change
          retention-days: 30

  # Pushes the branch and the pictures and opens the pull request, running none of the proposed
  # code and no checks of its own: CI judges the pushed commit. It applies the patch to main as it
  # is now, not the main the draft started from, so a change that landed on main meanwhile, such as
  # one to a workflow the app may not push, isn't pushed back as part of this one. A draft that
  # touches .github/ or Claude Code's own files is offered on the issue instead, and the build
  # stops, since nothing is pushed for CI to fail. A draft that changed nothing, or no longer
  # applies, is said on the issue too.
  open:
    needs: draft
    if: needs.draft.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The Actions token only reads and comments here. The app's token pushes and opens the pull
    # request.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          persist-credentials: false

      # The issue's branch as it is when this job starts, which the push takes a lease on, so a push
      # made meanwhile, by the fixer or a person, is never overwritten. Empty if there's no branch.
      - name: Read the issue's branch's head
        id: branch
        run: |
          case "$ISSUE" in ''|*[!0-9]*) echo "The issue must be a number: $ISSUE"; exit 1 ;; esac
          remote="$(git ls-remote origin "refs/heads/build/issue-$ISSUE")"
          head="${remote%%$'\t'*}"
          if [ -n "$head" ] && ! [[ "$head" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The branch's head isn't a commit id: $head"
            exit 1
          fi
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: change
          path: ${{ runner.temp }}/change

      # The artifact must be the one the draft job gave the digest of, since a job that ran the
      # change's code could have replaced it. Nothing is used before it's checked.
      - name: Check the change is the draft's
        id: verify
        env:
          CHANGE_DIGEST: ${{ needs.draft.outputs.digest }}
        run: |
          digest() { (cd "$1" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum) | sha256sum | cut -c 1-64; }
          if [ "$(digest "$RUNNER_TEMP/change")" != "$CHANGE_DIGEST" ]; then
            echo "The change isn't the one the draft made."
            exit 1
          fi

      # By git alone: the patch is applied to main as it is now, staged, and every name it stages is
      # checked, a renamed file by both its names. Main's script for the description is copied out
      # first, since once the patch is applied the workspace holds the change's code, and nothing
      # after this runs from the workspace. Claude's message, when it changed nothing, is posted
      # with < escaped, mentions broken and cut to 3,000 characters.
      - name: "Sort by git: does the draft change anything, apply, and keep away from .github/ and Claude Code's own files?"
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ needs.draft.outputs.changed }}
        run: |
          stop="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::$stop"
          trap 'echo "::$stop::"' EXIT
          case "$ISSUE" in ''|*[!0-9]*) echo "The issue must be a number: $ISSUE"; exit 1 ;; esac
          cp .github/pull-request-body.sh "$RUNNER_TEMP/pull-request-body.sh"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          say() {
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/said.md"
            echo "outcome=$1" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "$CHANGED" != true ]; then
            {
              printf '**The build changed nothing.** [The run](%s)\n' "$run_url"
              if [ -s "$RUNNER_TEMP/change/message.md" ]; then
                echo
                echo "Claude said:"
                echo
                jq -Rrs '.[0:3000] | gsub("<"; "&lt;") | gsub("@(?=[A-Za-z0-9])"; "@​")' \
                  "$RUNNER_TEMP/change/message.md" | sed 's/^/> /'
              fi
            } > "$RUNNER_TEMP/said.md"
            say nothing
          fi
          if ! git apply --index "$RUNNER_TEMP/change/change.patch"; then
            printf '**The draft no longer applies to main**, which changed while it was drafted, so nothing was pushed. To build it again, remove the build label and add it again. [The run](%s)\n' \
              "$run_url" > "$RUNNER_TEMP/said.md"
            say stale
          fi
          claudes='(^|/)\.claude(/|$)|(^|/)\.mcp\.json$|(^|/)CLAUDE(\.local)?\.md$|(^|/)\.npmrc$|(^|/)\.yarnrc(\.yml)?$|(^|/)node_modules(/|$)'
          if git diff --cached --name-only --no-renames -z | grep -zE "^\.github/|$claudes" > /dev/null ||
            git diff --cached --raw --no-renames | awk '$2 == "120000" { found = 1 } END { exit !found }'; then
            echo "The draft changes files the app never pushes, or makes a symbolic link:"
            git diff --cached --name-only --no-renames -z | grep -zE "^\.github/|$claudes" | tr '\0' '\n' | jq -R . || true
            git diff --cached --raw --no-renames | awk '$2 == "120000" { print "a symbolic link" }' | sort -u
            {
              printf '**The draft changes `.github/`, Claude Code'"'"'s own files** (`.claude/`, `.mcp.json` or a `CLAUDE.md`) **or npm'"'"'s** (`.npmrc`, `.yarnrc` or `node_modules/`), or makes a symbolic link, which the app never pushes, so the build stops here. [The run](%s)\n' "$run_url"
              echo
              echo "To look at it and apply it, in a checkout of \`main\` at $GITHUB_SHA, the commit it was drafted on:"
              echo
              echo '```sh'
              printf 'gh run download %s --repo %s -n change\n' "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY"
              echo 'git apply --index change.patch'
              echo '```'
              echo
              echo "The run keeps the draft for 30 days."
            } > "$RUNNER_TEMP/said.md"
            say offered
          fi
          echo "outcome=push" >> "$GITHUB_OUTPUT"
          echo "branch=build/issue-$ISSUE" >> "$GITHUB_OUTPUT"

      # The draft job ran the change's own code, so its pictures are taken on trust only as far as
      # this: every path is checked, and only PNG files under the size cap are kept. If any picture
      # fails, all are left out and the description says why, since the change itself is still good.
      - name: Check the pictures
        id: pictures
        if: steps.guard.outputs.outcome == 'push'
        run: |
          pictures="$RUNNER_TEMP/change/pictures"
          media="$RUNNER_TEMP/media"
          mkdir -p "$media"
          : > "$RUNNER_TEMP/pictures.txt"
          : > "$RUNNER_TEMP/pictures-left-out.txt"
          leave_out() {
            echo "::warning::$1"
            echo "$1" > "$RUNNER_TEMP/pictures-left-out.txt"
            : > "$RUNNER_TEMP/pictures.txt"
            rm -rf "$media"
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          }
          safe_path() {
            case "$1" in ''|/*|*..*|*[!A-Za-z0-9._/-]*) return 1 ;; esac
          }
          take() {
            safe_path "$1" && case "$1" in *.png) ;; *) return 1 ;; esac || return 1
            [ -f "$pictures/$1" ] && [ ! -L "$pictures/$1" ] || return 1
            [ "$(stat -c %s "$pictures/$1")" -le $((5 * 1024 * 1024)) ] || return 1
            [ "$(head -c 8 "$pictures/$1" | od -An -tx1 | tr -d ' \n')" = 89504e470d0a1a0a ] || return 1
            mkdir -p "$(dirname "$media/$1")"
            cp "$pictures/$1" "$media/$1"
          }
          if [ ! -f "$pictures/manifest.json" ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A bar can't be in a checked path, so it parts the fields where a tab, being blank, wouldn't.
          rows="$(jq -r '.[] | [.example, .before, .after] | join("|")' "$pictures/manifest.json")" \
            || leave_out "The pictures' manifest could not be read."
          count=0
          if [ -z "$rows" ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS='|' read -r example before after; do
            safe_path "$example" && case "$example" in *.svg) ;; *) false ;; esac \
              || leave_out "The pictures' manifest names an example that isn't an SVG path."
            if [ -n "$before" ]; then
              take "$before" || leave_out "A before picture of $example isn't a PNG under 5 MB at a plain path."
              count=$((count + 1))
            fi
            take "$after" || leave_out "An after picture of $example isn't a PNG under 5 MB at a plain path."
            count=$((count + 1))
            [ "$count" -le 80 ] || leave_out "There are more than 80 pictures, too many to show."
            printf '%s|%s|%s\n' "$example" "$before" "$after" >> "$RUNNER_TEMP/pictures.txt"
          done <<< "$rows"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Make the app's token
        id: app
        if: steps.guard.outputs.outcome == 'push'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      # The title and description come from main's pull-request-body.sh. gh pr view finds a branch's
      # closed or merged pull request when it has no open one, so only GitHub's list of the branch's
      # open pull requests decides whether there's one already. If there is, it's given this try's
      # title and description before the push, since the push starts CI, whose reviews and Classify
      # read them, and a squash keeps the new title. Its number is the step's output.
      - name: Give the open pull request this try's title and description, before the push
        id: describe
        if: steps.guard.outputs.outcome == 'push'
        env:
          BRANCH: ${{ steps.guard.outputs.branch }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CHANGE_DIR: ${{ runner.temp }}/change
          PICTURES: ${{ runner.temp }}/pictures.txt
          PICTURES_LEFT_OUT: ${{ runner.temp }}/pictures-left-out.txt
        run: |
          export MEDIA_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/raw/factory-media/issue-$ISSUE/run-$GITHUB_RUN_ID"
          "$RUNNER_TEMP/pull-request-body.sh" > "$RUNNER_TEMP/pull-request.md"
          "$RUNNER_TEMP/pull-request-body.sh" title > "$RUNNER_TEMP/title.txt"
          # Only the app's own pull request from this repository counts: anyone may open one of their
          # own from the branch, which the build leaves alone.
          number="$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=$GITHUB_REPOSITORY_OWNER:$BRANCH&base=main&state=open" |
            jq -r --arg repository "$GITHUB_REPOSITORY" '[.[] | select(.user.login == "awml-factory[bot]" and .user.type == "Bot" and
              .head.repo.full_name == $repository) | .number] | first // empty')"
          case "$number" in *[!0-9]*) echo "The open pull request's number isn't a number: $number"; exit 1 ;; esac
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --title "$(cat "$RUNNER_TEMP/title.txt")" \
              --body-file "$RUNNER_TEMP/pull-request.md"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # The commit is the app's, as its push is. Its message is Claude's, with mentions and closing
      # keywords broken by main's pull-request-body.sh, since a person's squash keeps it, and then the
      # issue it closes.
      # The branch is the issue's own, reused by every try, so a new try's push updates the open
      # pull request. The push takes a lease on the head the job read when it started.
      - name: Commit the change as the app's bot and push the branch
        id: push
        if: steps.guard.outputs.outcome == 'push'
        env:
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          BRANCH: ${{ steps.guard.outputs.branch }}
          BRANCH_HEAD: ${{ steps.branch.outputs.head }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # The other workflows know the factory's commits by awml-factory[bot], so no other app commits.
          if [ "$APP_SLUG" != awml-factory ]; then
            echo "The app is $APP_SLUG, but the factory's commits are known as awml-factory[bot]'s, so nothing is committed."
            exit 1
          fi
          id="$(gh api "users/$APP_SLUG%5Bbot%5D" --jq .id)"
          case "$id" in ''|*[!0-9]*) echo "The app's bot has no user id: $id"; exit 1 ;; esac
          message="$RUNNER_TEMP/commit.md"
          CHANGE_DIR="$RUNNER_TEMP/change" "$RUNNER_TEMP/pull-request-body.sh" message > "$message"
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$id+$APP_SLUG[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false commit -q -F "$message"
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push --force-with-lease="refs/heads/$BRANCH:$BRANCH_HEAD" origin "HEAD:refs/heads/$BRANCH"

      # The pictures go to the factory-media branch, which holds nothing else and shares no history
      # with main. Each run adds a commit with its own folder, so the links in older descriptions
      # keep working.
      - name: Push the pictures to the factory-media branch
        if: steps.guard.outputs.outcome == 'push' && steps.pictures.outputs.count != '0'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_INDEX_FILE="$RUNNER_TEMP/media.index"
          parent=""
          status=0
          git -c http.https://github.com/.extraheader="$auth" \
            ls-remote --exit-code origin refs/heads/factory-media > /dev/null || status=$?
          case "$status" in
            0)
              git -c http.https://github.com/.extraheader="$auth" \
                fetch --no-tags --depth=1 origin refs/heads/factory-media
              parent="$(git rev-parse FETCH_HEAD)"
              git read-tree "$parent"
              ;;
            2) git read-tree --empty ;;
            *) echo "Could not read the factory-media branch."; exit 1 ;;
          esac
          (cd "$RUNNER_TEMP/media" && find . -type f -name '*.png' | sed 's|^\./||') |
          while IFS= read -r path; do
            blob="$(git hash-object -w "$RUNNER_TEMP/media/$path")"
            git update-index --add --cacheinfo "100644,$blob,issue-$ISSUE/run-$GITHUB_RUN_ID/$path"
          done
          tree="$(git write-tree)"
          commit="$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "Pictures for #$ISSUE, run $GITHUB_RUN_ID")"
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false -c http.https://github.com/.extraheader="$auth" \
            push origin "$commit:refs/heads/factory-media"

      # A new one opens once the branch is pushed, with this try's title and description.
      - name: Open a pull request that says Closes #n, unless one is open from the branch already
        id: pull
        if: steps.guard.outputs.outcome == 'push' && steps.describe.outputs.number == ''
        env:
          BRANCH: ${{ steps.guard.outputs.branch }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OPEN_NUMBER: ${{ steps.describe.outputs.number }}
        run: |
          if [ -n "$OPEN_NUMBER" ]; then
            echo "#$OPEN_NUMBER is open from $BRANCH already, and has this try's title and description."
            exit 0
          fi
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "$(cat "$RUNNER_TEMP/title.txt")" --body-file "$RUNNER_TEMP/pull-request.md"
