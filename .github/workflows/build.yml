# Builds the change an issue asks for when the maintainer adds the build label, and opens a pull
# request for it. A change the build rule finds straightforward merges by itself. This is the
# workflow drawn at https://awml.io/chrismdp/issue-to-pull-request.
#
# Only people with write access and the repository's app can add a label, so the label is the
# decision. Claude works in the first job with a read-only token, sees only the issue and the
# comments of the repository's own people, and hands back a patch. A second read-only job applies
# that patch and runs every check from AGENTS.md. Both later jobs start from the commit of main the
# draft started from, so the patch still applies when main moves during a long draft, and the pull
# request catches up like any other. The write-capable job runs none of the proposed code. It judges
# a passing patch against .github/build-rules.yml with the rule as it is on main, and opens the pull
# request.
#
# A change that alters an example's .mmd, or the renderer in examples/render*, is redrawn by the
# check job, after its checks pass: it runs examples/render.sh, hands back the SVGs of the drawings
# that changed as a second patch, and pictures each of them, before and after. The rule judges
# Claude's patch alone. The write-capable job then commits both patches together, pushes the
# pictures to the factory-media branch, which holds only pictures, and shows them in the pull
# request. Claude writes the pull request's description in Markdown, and the job puts why the
# change needs review, and Claude's note, above it.
#
# A change that needs review stays open, and the person who added the label is asked to
# review it, or the repository's owner when the app added the label. A straightforward change is set
# to merge by itself once CI passes, saying why and how to undo it. Main's rule holds every merge
# until CI has passed on the branch.
#
# The repository's GitHub App pushes the branch and the pictures, opens the pull request and sets
# the merge, because GitHub starts other workflows from what an app does but not from what the
# Actions token does. So CI runs on the pull request and shows on it, and the merge starts CI on
# main and the conflict rebase workflow, as a person's merge would. The job mints the app's token
# from the app's two secrets and gives it only to the steps that write with it. Review requests,
# comments and the retry's dispatch use the Actions token.
#
# A build can also be started by hand, by dispatching this one with the issue's number. A build that
# fails its checks, or whose draft fails or runs out of time, starts itself again by dispatch, up to
# three tries in all. Each try after the first brings in the last try's result, with the end of the
# failing check's output, so Claude fixes what failed rather than starting over. After the third try
# it comments on the issue with the reason instead. A draft in which Claude changed nothing isn't
# tried again: it comments with Claude's message. The retry job only reads results and calls the
# GitHub API, and runs nothing from the change.
#
# Before it works, a repository needs:
# - a GitHub App with read and write access to contents, pull requests and issues, installed on the
#   repository, with its app id in a FACTORY_APP_ID secret and a private key in FACTORY_APP_KEY;
# - a CLAUDE_CODE_OAUTH_TOKEN secret, made with `claude setup-token`, so the runs come out of the
#   maintainer's subscription rather than a metered API key;
# - a build label;
# - "Allow auto-merge" turned on in the repository's general settings.
name: Build from an issue

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: The number of the issue to build
        required: true
      attempt:
        description: Which try this is, from 1 to 3
        default: "1"
      previous_run:
        description: The run of the last try, whose result this try is told about
        default: ""
      requested_by:
        description: Who to ask to review the pull request, if it needs a review
        default: ""

# Each label added to an issue starts a run, and the app opens an issue with three labels at once. So
# only a build has the issue's group, and a run for any other label can't cancel the build.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || github.event.label.name == 'build') && format('build-issue-{0}', inputs.issue || github.event.issue.number) || format('build-other-label-{0}', github.run_id) }}
  cancel-in-progress: true

env:
  ISSUE: ${{ inputs.issue || github.event.issue.number }}
  ATTEMPT: ${{ inputs.attempt || '1' }}
  PREVIOUS_RUN: ${{ inputs.previous_run }}
  # Whoever added the label, or started the build by hand. A retry passes them on. A build whose
  # label the app added has the app's bot here, whose name isn't a person's, so the review step asks
  # the owner instead.
  REQUESTED_BY: ${{ inputs.requested_by || github.event.sender.login }}

jobs:
  draft:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      issues: read
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    steps:
      - name: Check the inputs
        run: |
          case "$ISSUE" in ''|*[!0-9]*) echo "The issue must be a number: $ISSUE"; exit 1 ;; esac
          case "$ATTEMPT" in [1-3]) ;; *) echo "The attempt must be 1, 2 or 3: $ATTEMPT"; exit 1 ;; esac
          case "$PREVIOUS_RUN" in *[!0-9]*) echo "The previous run must be a number: $PREVIOUS_RUN"; exit 1 ;; esac

      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Bring in the issue and the comments of the repository's own people
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/build"
          {
            gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" \
              --jq '"# #\(.number): \(.title)\n\nLabels: \([.labels[].name] | join(", "))\n\n\(.body // "")\n"'
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" \
              --jq '.[] | select(.author_association == "OWNER" or .author_association == "MEMBER" or .author_association == "COLLABORATOR")
                    | "## Comment by \(.user.login), \(.created_at)\n\n\(.body)\n"'
          } > "$RUNNER_TEMP/build/issue.md"

      - name: Bring in why the last try failed
        if: env.PREVIOUS_RUN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$RUNNER_TEMP/previous"
          if ! gh run download "$PREVIOUS_RUN" --repo "$GITHUB_REPOSITORY" -n result -D "$previous"; then
            mkdir -p "$previous"
            echo "The last try's draft failed or ran out of time, so its change was never checked." \
              > "$previous/result.txt"
          fi
          {
            echo "## The last try failed (attempt $((ATTEMPT - 1)) of 3)"
            echo
            cat "$previous/result.txt"
            if [ -s "$previous/output.txt" ]; then
              longest="$(grep -o '`*' "$previous/output.txt" | awk '{ if (length($0) > m) m = length($0) } END { print m + 0 }')"
              fence="$(printf '%*s' "$(( longest >= 3 ? longest + 1 : 3 ))" '' | tr ' ' '`')"
              echo
              echo "The end of the failing check's output:"
              echo
              echo "$fence"
              cat "$previous/output.txt"
              echo "$fence"
            fi
          } >> "$RUNNER_TEMP/build/issue.md"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Draft the change
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BUILD_DIR: ${{ runner.temp }}/build
        run: |
          prompt="$(sed "s|BUILD_DIR|$BUILD_DIR|g" .github/build-prompt.md)"
          claude -p "$prompt" --model opus --max-turns 200 --permission-mode acceptEdits \
            --allowedTools "Read" "Edit" "Write" "Glob" "Grep" \
              "Bash(go:*)" "Bash(gofmt:*)" "Bash(make:*)" "Bash(node:*)" \
              "Bash(git status:*)" "Bash(git diff:*)" "Bash(git log:*)" \
              "Bash(ls:*)" "Bash(cp:*)" "Bash(mkdir:*)"

      - name: Make the patch
        id: patch
        run: |
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/build/change.patch"
          if [ -s "$RUNNER_TEMP/build/change.patch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Claude changed nothing:"; cat "$RUNNER_TEMP/build/message.md" 2>/dev/null || true
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: change
          path: |
            ${{ runner.temp }}/build/change.patch
            ${{ runner.temp }}/build/message.md
            ${{ runner.temp }}/build/pull-request.md
            ${{ runner.temp }}/build/review.md

  check:
    needs: draft
    if: needs.draft.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Prepare the result
        run: |
          mkdir -p "$RUNNER_TEMP/result"
          echo "The workflow failed before it could check the proposed change." \
            > "$RUNNER_TEMP/result/result.txt"

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: change
          path: ${{ runner.temp }}/change

      - name: Apply the change
        run: |
          if [ ! -s "$RUNNER_TEMP/change/change.patch" ]; then
            echo "The draft job did not produce a patch." > "$RUNNER_TEMP/result/result.txt"
            exit 1
          fi
          if ! git apply --index "$RUNNER_TEMP/change/change.patch" 2> "$RUNNER_TEMP/apply.log"; then
            cat "$RUNNER_TEMP/apply.log"
            echo "The proposed change could not be applied to main." \
              > "$RUNNER_TEMP/result/result.txt"
            tail -n 150 "$RUNNER_TEMP/apply.log" > "$RUNNER_TEMP/result/output.txt"
            exit 1
          fi

      # Each check's output is kept, so that a failing one's last lines go into the result.
      - name: Run the checks
        run: |
          set -o pipefail
          run_check() {
            echo "$1" > "$RUNNER_TEMP/result/result.txt"
            shift
            if ! "$@" 2>&1 | tee "$RUNNER_TEMP/check.log"; then
              tail -n 150 "$RUNNER_TEMP/check.log" > "$RUNNER_TEMP/result/output.txt"
              exit 1
            fi
          }
          run_check "The Go tests did not pass." go test ./...
          run_check "Go vet did not pass." go vet ./...
          run_check "The example checks did not pass." \
            go run ./cmd/awml check examples/*.yaml examples/tour/*.yaml examples/platforms/*.yaml
          run_check "The WebAssembly tests did not pass." make test-wasm

      # A change to an example's .mmd, or to the renderer, is redrawn here, and each drawing that
      # changed is pictured before and after. The redrawn SVGs go back as drawings.patch, apart from
      # Claude's patch, and the pictures and their manifest go into the result. Only stills are
      # made: a page that moves would be recorded as a GIF in this step, but nothing in this
      # repository moves yet.
      - name: Redraw the examples and picture what changed
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          set -o pipefail
          echo "Redrawing the examples failed." > "$RUNNER_TEMP/result/result.txt"
          if ! .github/picture-drawings.sh "$RUNNER_TEMP/result" 2>&1 | tee "$RUNNER_TEMP/render.log"; then
            tail -n 150 "$RUNNER_TEMP/render.log" > "$RUNNER_TEMP/result/output.txt"
            exit 1
          fi
          echo pass > "$RUNNER_TEMP/result/result.txt"

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: result
          path: ${{ runner.temp }}/result

  open:
    needs: [draft, check]
    if: ${{ always() && needs.draft.result == 'success' && needs.draft.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: build-auto-merge
      cancel-in-progress: false
    # The Actions token only reads and asks for reviews here. The app's token pushes, opens the pull
    # request and sets the merge.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # The rule and its settings come from main, before the change is applied, so the change
      # can't alter how it's judged. This job builds and runs nothing else.
      - name: Build the rule from main
        run: |
          go build -o "$RUNNER_TEMP/build-rule" ./internal/buildrule
          cp .github/build-rules.yml "$RUNNER_TEMP/build-rules.yml"

      - uses: actions/download-artifact@v4
        with:
          name: change
          path: ${{ runner.temp }}/change
      - uses: actions/download-artifact@v4
        with:
          name: result
          path: ${{ runner.temp }}/result

      - name: Read the check result
        run: |
          if [ ! -s "$RUNNER_TEMP/result/result.txt" ]; then
            echo "The check job did not produce a result."
            exit 1
          fi
          if [ "$(cat "$RUNNER_TEMP/result/result.txt")" != pass ]; then
            cat "$RUNNER_TEMP/result/result.txt"
            exit 1
          fi

      # The check job ran the change's own code, so its pictures are taken on trust only as far as
      # this: every path is checked, and only PNG files under the size cap are kept. If any picture
      # fails, all are left out and the description says why, since the change itself is still good.
      - name: Check the pictures
        id: pictures
        run: |
          pictures="$RUNNER_TEMP/result/pictures"
          media="$RUNNER_TEMP/media"
          mkdir -p "$media"
          : > "$RUNNER_TEMP/pictures.txt"
          : > "$RUNNER_TEMP/pictures-left-out.txt"
          leave_out() {
            echo "::warning::$1"
            echo "$1" > "$RUNNER_TEMP/pictures-left-out.txt"
            : > "$RUNNER_TEMP/pictures.txt"
            rm -rf "$media"
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          }
          safe_path() {
            case "$1" in ''|/*|*..*|*[!A-Za-z0-9._/-]*) return 1 ;; esac
          }
          take() {
            safe_path "$1" && case "$1" in *.png) ;; *) return 1 ;; esac || return 1
            [ -f "$pictures/$1" ] && [ ! -L "$pictures/$1" ] || return 1
            [ "$(stat -c %s "$pictures/$1")" -le $((5 * 1024 * 1024)) ] || return 1
            [ "$(head -c 8 "$pictures/$1" | od -An -tx1 | tr -d ' \n')" = 89504e470d0a1a0a ] || return 1
            mkdir -p "$(dirname "$media/$1")"
            cp "$pictures/$1" "$media/$1"
          }
          if [ ! -f "$RUNNER_TEMP/result/drawings.patch" ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ -f "$pictures/manifest.json" ] || leave_out "The check job redrew the examples but made no pictures."
          # A bar can't be in a checked path, so it parts the fields where a tab, being blank, wouldn't.
          rows="$(jq -r '.[] | [.example, .before, .after] | join("|")' "$pictures/manifest.json")" \
            || leave_out "The pictures' manifest could not be read."
          count=0
          if [ -z "$rows" ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS='|' read -r example before after; do
            safe_path "$example" && case "$example" in *.svg) ;; *) false ;; esac \
              || leave_out "The pictures' manifest names an example that isn't an SVG path."
            if [ -n "$before" ]; then
              take "$before" || leave_out "A before picture of $example isn't a PNG under 5 MB at a plain path."
              count=$((count + 1))
            fi
            take "$after" || leave_out "An after picture of $example isn't a PNG under 5 MB at a plain path."
            count=$((count + 1))
            [ "$count" -le 80 ] || leave_out "There are more than 80 pictures, too many to show."
            printf '%s|%s|%s\n' "$example" "$before" "$after" >> "$RUNNER_TEMP/pictures.txt"
          done <<< "$rows"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Make the app's token
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}

      # The commit is the app's, as its push is.
      - name: Find the app's bot
        id: bot
        env:
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          GH_TOKEN: ${{ github.token }}
        run: |
          id="$(gh api "users/$APP_SLUG%5Bbot%5D" --jq .id)"
          echo "name=$APP_SLUG[bot]" >> "$GITHUB_OUTPUT"
          echo "email=$id+$APP_SLUG[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      # The rule judges Claude's patch alone, so redrawn SVGs never push a change over the line
      # limit. The redrawn drawings may then touch only the examples' SVGs, since the rule never saw
      # them.
      - name: Apply and commit the change
        id: commit
        env:
          BOT_NAME: ${{ steps.bot.outputs.name }}
          BOT_EMAIL: ${{ steps.bot.outputs.email }}
        run: |
          git apply --index "$RUNNER_TEMP/change/change.patch"
          "$RUNNER_TEMP/build-rule" -repo . -rules "$RUNNER_TEMP/build-rules.yml" \
            -review "$RUNNER_TEMP/change/review.md" > "$RUNNER_TEMP/verdict.txt"
          if [ -s "$RUNNER_TEMP/result/drawings.patch" ]; then
            judged="$(git write-tree)"
            git apply --index "$RUNNER_TEMP/result/drawings.patch"
            drawn="$(git diff-index --cached --name-status "$judged")"
            if [ -n "$drawn" ] && grep -vE '^[AM]'$'\t''examples/(tour/)?[A-Za-z0-9._-]+\.svg$' <<< "$drawn"; then
              echo "The redrawn drawings touch more than the examples' SVGs."
              exit 1
            fi
          fi
          message="$RUNNER_TEMP/commit.md"
          cat "$RUNNER_TEMP/change/message.md" > "$message" 2> /dev/null || true
          [ -s "$message" ] || echo "Build #$ISSUE" > "$message"
          printf '\n\nCloses #%s\n' "$ISSUE" >> "$message"
          branch="build/issue-$ISSUE"
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git switch -c "$branch"
          git -c core.hooksPath=/dev/null commit -q -F "$message"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Push the branch
        env:
          BRANCH: ${{ steps.commit.outputs.branch }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          git -c core.hooksPath=/dev/null \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push --force origin "HEAD:refs/heads/$BRANCH"

      # The pictures go to the factory-media branch, which holds nothing else and shares no history
      # with main. Each try adds a commit with its own folder, so the links in older descriptions
      # keep working.
      - name: Push the pictures to the factory-media branch
        if: steps.pictures.outputs.count != '0'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_INDEX_FILE="$RUNNER_TEMP/media.index"
          parent=""
          status=0
          git -c http.https://github.com/.extraheader="$auth" \
            ls-remote --exit-code origin refs/heads/factory-media > /dev/null || status=$?
          case "$status" in
            0)
              git -c http.https://github.com/.extraheader="$auth" \
                fetch --no-tags --depth=1 origin refs/heads/factory-media
              parent="$(git rev-parse FETCH_HEAD)"
              git read-tree "$parent"
              ;;
            2) git read-tree --empty ;;
            *) echo "Could not read the factory-media branch."; exit 1 ;;
          esac
          (cd "$RUNNER_TEMP/media" && find . -type f -name '*.png' | sed 's|^\./||') |
          while IFS= read -r path; do
            blob="$(git hash-object -w "$RUNNER_TEMP/media/$path")"
            git update-index --add --cacheinfo "100644,$blob,issue-$ISSUE/attempt-$ATTEMPT/$path"
          done
          tree="$(git write-tree)"
          commit="$(git commit-tree "$tree" ${parent:+-p "$parent"} \
            -m "Pictures for #$ISSUE, attempt $ATTEMPT")"
          git -c core.hooksPath=/dev/null -c http.https://github.com/.extraheader="$auth" \
            push origin "$commit:refs/heads/factory-media"

      - name: Read the verdict
        id: verdict
        run: |
          verdict="$(head -n 1 "$RUNNER_TEMP/verdict.txt")"
          tail -n +2 "$RUNNER_TEMP/verdict.txt" > "$RUNNER_TEMP/reasons.txt"
          case "$verdict" in
            review|straightforward)
              echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "The build rule gave an unknown verdict: $verdict"
              exit 1
              ;;
          esac

      # The description opens with why the change needs review, then Claude's note as written, or
      # with one line saying it merges by itself. Then Claude's description, the pictures, and the
      # issue it closes.
      - name: Write the pull request's description
        env:
          VERDICT: ${{ steps.verdict.outputs.verdict }}
        run: |
          change="$RUNNER_TEMP/change"
          media_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/raw/factory-media/issue-$ISSUE/attempt-$ATTEMPT"
          title="$(head -n 1 "$change/message.md" 2> /dev/null || true)"
          [ -n "$title" ] || title="Build #$ISSUE"
          printf '%s\n' "$title" > "$RUNNER_TEMP/title.txt"
          {
            if [ "$VERDICT" = review ]; then
              echo "## Needs your review because"
              echo
              while IFS= read -r line; do
                [ -n "$line" ] && printf -- '- %s\n' "$line"
              done < "$RUNNER_TEMP/reasons.txt"
              if [ -s "$change/review.md" ] && grep -q '[^[:space:]]' "$change/review.md"; then
                echo
                echo "### Claude's note"
                echo
                cat "$change/review.md"
              fi
            else
              printf 'Merges by itself once CI passes, because the build rule found it straightforward: %s\n' \
                "$(grep -v '^$' "$RUNNER_TEMP/reasons.txt" | paste -sd ' ')"
            fi
            echo
            if [ -s "$change/pull-request.md" ]; then
              cat "$change/pull-request.md"
            else
              tail -n +2 "$change/message.md" 2> /dev/null | sed '/./,$!d'
            fi
            if [ -s "$RUNNER_TEMP/pictures.txt" ]; then
              echo
              echo "## Pictures"
              while IFS='|' read -r example before after; do
                echo
                printf '### `%s`\n\n' "$example"
                echo "| Before | After |"
                echo "| --- | --- |"
                if [ -n "$before" ]; then
                  before_cell="![Before]($media_url/$before)"
                else
                  before_cell="New drawing"
                fi
                printf '| %s | ![After](%s/%s) |\n' "$before_cell" "$media_url" "$after"
              done < "$RUNNER_TEMP/pictures.txt"
            elif [ -s "$RUNNER_TEMP/pictures-left-out.txt" ]; then
              echo
              echo "## Pictures"
              echo
              printf 'The pictures were left out: %s\n' "$(cat "$RUNNER_TEMP/pictures-left-out.txt")"
            fi
            echo
            printf 'Closes #%s\n' "$ISSUE"
          } > "$RUNNER_TEMP/pull-request.md"
          cat "$RUNNER_TEMP/pull-request.md"

      - name: Open or update the pull request
        id: pull
        env:
          BRANCH: ${{ steps.commit.outputs.branch }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          title="$(cat "$RUNNER_TEMP/title.txt")"
          if gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --body-file "$RUNNER_TEMP/pull-request.md"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --head "$BRANCH" \
              --title "$title" --body-file "$RUNNER_TEMP/pull-request.md"
          fi
          number="$(gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" --json number --jq .number)"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Ask for a review
        if: steps.verdict.outputs.verdict == 'review'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pull.outputs.number }}
        run: |
          reviewer="$REQUESTED_BY"
          case "$reviewer" in
            ''|*[!A-Za-z0-9-]*) reviewer="$GITHUB_REPOSITORY_OWNER" ;;
          esac
          if ! gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-reviewer "$reviewer"; then
            echo "::warning::Could not ask $reviewer to review the pull request."
          fi

      - name: Set the pull request to merge once CI passes
        if: steps.verdict.outputs.verdict == 'straightforward'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_NUMBER: ${{ steps.pull.outputs.number }}
        run: |
          {
            echo "Merges by itself once CI passes, because the build rule found it straightforward."
            echo
            echo "The build rule called it straightforward because:"
            echo
            while IFS= read -r line; do
              [ -n "$line" ] && printf -- '- %s\n' "$line"
            done < "$RUNNER_TEMP/reasons.txt"
            echo
            echo "To undo it, use the Revert button on this pull request."
          } > "$RUNNER_TEMP/merge.md"
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash \
            --body-file "$RUNNER_TEMP/merge.md"

  # Runs when the draft failed or ran out of time, or the checks didn't pass, but not when the whole
  # run was cancelled because a newer build of the same issue replaced it. It checks out nothing and
  # runs only gh.
  retry:
    needs: [draft, check, open]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || github.event.label.name == 'build') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      issues: write
    steps:
      - name: Try again, or say why the build failed
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ needs.draft.result }}
          CHANGED: ${{ needs.draft.outputs.changed }}
        run: |
          case "$ISSUE" in ''|*[!0-9]*) echo "The issue must be a number: $ISSUE"; exit 1 ;; esac
          case "$ATTEMPT" in [1-3]) ;; *) echo "The attempt must be 1, 2 or 3: $ATTEMPT"; exit 1 ;; esac
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          here="$RUNNER_TEMP/retry"
          mkdir -p "$here"

          if [ "$DRAFT" = success ] && [ "$CHANGED" != true ]; then
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" -n change -D "$here/change" || true
            {
              echo "**The build changed nothing, so it won't be tried again.**"
              echo
              if [ -s "$here/change/message.md" ]; then
                echo "- Claude left the code as it was, and said why:"
                echo
                cat "$here/change/message.md"
              else
                echo "- Claude left the code as it was, and left no message saying why."
              fi
              echo
              echo "[The run]($run_url)"
            } > "$here/comment.md"
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$here/comment.md"
            exit 0
          fi

          if [ "$DRAFT" = success ]; then
            if gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" -n result -D "$here/result"; then
              reason="$(cat "$here/result/result.txt" 2>/dev/null)"
              [ -n "$reason" ] || reason="The check job did not produce a result."
            else
              reason="The check job did not produce a result."
            fi
            [ "$reason" = pass ] && exit 0
          else
            reason="The draft failed or ran out of time."
          fi
          echo "$reason"

          if [ "$ATTEMPT" -lt 3 ]; then
            gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f issue="$ISSUE" -f attempt="$((ATTEMPT + 1))" -f previous_run="$GITHUB_RUN_ID" \
              -f requested_by="$REQUESTED_BY"
            exit 0
          fi

          {
            echo "**The build failed three times, so it has stopped.**"
            echo
            printf -- '- The last try failed because: %s\n' "$reason"
            echo "- To start afresh, remove the build label and add it again."
            if [ -s "$here/result/output.txt" ]; then
              tail -n 50 "$here/result/output.txt" > "$here/output.txt"
              longest="$(grep -o '`*' "$here/output.txt" | awk '{ if (length($0) > m) m = length($0) } END { print m + 0 }')"
              fence="$(printf '%*s' "$(( longest >= 3 ? longest + 1 : 3 ))" '' | tr ' ' '`')"
              echo
              echo "<details><summary>Output</summary>"
              echo
              echo "$fence"
              cat "$here/output.txt"
              echo "$fence"
              echo
              echo "</details>"
            fi
            echo
            echo "[The run]($run_url)"
          } > "$here/comment.md"
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$here/comment.md"
