# Runs every check from AGENTS.md on every push: it vets and tests the code, checks every example,
# and checks that the WebAssembly build gives the same answers as the CLI. It runs on the oldest Go
# that go.mod allows, and on the newest. The build and rebase workflows push and merge with the
# repository's GitHub App, so their pushes start it as a person's would.
#
# When a check fails on main, a last job reports it. If an issue labelled failing-main is already
# open, it adds this run to that issue and starts nothing, so a main that fails on several pushes
# starts one build. Otherwise the app opens an issue with the end of the failing output, labelled
# build, and GitHub starts the build from that label as it would from a person's. The build retries
# and merges by the same rules as any other. The report job checks out nothing and runs none of the
# code it reports on: it reads the failed jobs' log with gh. It mints the app's token only to open
# the issue, and comments with the Actions token.
#
# Before it works, a repository needs the GitHub App and its two secrets that build.yml lists, and:
# - failing-main and tool labels, which the report job puts on its issue beside build;
# - a ruleset on main that requires both test jobs to pass, so that nothing merges, by hand or by
#   itself, until CI has passed on the branch.
name: CI

on:
  push:
    # The factory-media branch holds only the build's pictures.
    branches-ignore: [factory-media]
  # For running the checks by hand.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        go: ["1.22", stable]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: go vet ./...
      - run: go test ./...
      - run: go run ./cmd/awml check examples/*.yaml examples/tour/*.yaml examples/platforms/*.yaml
      - run: make test-wasm

  report:
    needs: test
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Report the failure on the open issue, or write a new one
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          here="$RUNNER_TEMP/report"
          mkdir -p "$here"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          # The run is still going, so each failed job's log is read on its own. If gh won't show
          # the failed steps of a job in a run that hasn't finished, the job's whole log stands in.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure") | "\(.id)\t\(.name)"' > "$here/jobs.txt"
          while IFS=$'\t' read -r job _; do
            gh run view --repo "$GITHUB_REPOSITORY" --job "$job" --log-failed \
              || gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job/logs"
          done < "$here/jobs.txt" > "$here/log.txt"
          tail -n 150 "$here/log.txt" > "$here/output.txt"

          longest="$(grep -o '`*' "$here/output.txt" | awk '{ if (length($0) > m) m = length($0) } END { print m + 0 }')"
          fence="$(printf '%*s' "$(( longest >= 3 ? longest + 1 : 3 ))" '' | tr ' ' '`')"
          subject="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.message | head -n 1)"
          {
            echo "**The checks failed on main at $GITHUB_SHA, \"$subject\".**"
            echo
            while IFS=$'\t' read -r _ name; do
              printf -- '- The job `%s` failed.\n' "$name"
            done < "$here/jobs.txt"
            echo
            echo "<details><summary>Output</summary>"
            echo
            echo "$fence"
            cat "$here/output.txt"
            echo "$fence"
            echo
            echo "</details>"
          } > "$here/failure.md"
          {
            cat "$here/failure.md"
            echo
            echo "[The run]($run_url)"
          } > "$here/comment.md"

          open="$(gh issue list --repo "$GITHUB_REPOSITORY" --label failing-main --state open \
            --json number --jq '.[0].number // empty')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body-file "$here/comment.md"
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${#subject}" -gt 60 ]; then
            subject="${subject:0:57}..."
          fi
          echo "Main is failing: $subject" > "$here/title.txt"
          {
            cat "$here/failure.md"
            echo
            echo "The build label starts a build of this issue. A fix the build rule finds straightforward merges by itself once CI passes."
            echo
            echo "[The run]($run_url)"
          } > "$here/issue.md"
          echo "new=true" >> "$GITHUB_OUTPUT"

      - name: Make the app's token
        id: app
        if: steps.report.outputs.new == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}

      - name: Open an issue labelled build
        if: steps.report.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          here="$RUNNER_TEMP/report"
          if ! url="$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$(cat "$here/title.txt")" \
            --label failing-main --label tool --label build --body-file "$here/issue.md")"; then
            echo "::error::Could not open an issue about the failing main. Check that the failing-main, tool and build labels exist."
            exit 1
          fi
          echo "Opened $url"
