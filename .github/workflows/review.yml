# Every pull request from a branch of this repository, opened by someone with write access or by the
# repository's own app, is reviewed for bugs and for security each time it's opened or pushed to,
# and each review is posted as a check on its head commit, beside CI. Two fresh Claude sessions read
# the patch against main, with main's REVIEW.md and prompts, never the branch's. A review that finds
# nothing passes, and one with an Important finding fails, so the change takes a fix, or the
# maintainer's deliberate bypass, to merge. One with only Nits or Pre-existing faults is neutral. A
# pull request from a fork gets no review, and neither does one opened by anyone else, since the
# sessions hold the maintainer's login token and read the pull request's description.
# Drawn at https://awml.io/chrismdp/review-a-pull-request
name: Review a pull request

# Before it works, a repository needs the CLAUDE_CODE_OAUTH_TOKEN secret that build.yml lists.
#
# GitHub runs this from main's copy on pull_request_target, whatever the branch holds, so a branch
# can't rewrite how it's reviewed. The jobs hold main's secret and tokens, so no job checks out or
# fetches anything from the pull request's head, or runs it. The review job holds a token that only
# reads, and checks out main. It brings in the patch of the event's head commit through the Actions
# token, as data, and applies it to the commit of main the branch started from, so the sessions read
# the change as the build's own reviews read a build's. The post job holds a token that may only
# write checks, and checks out and runs nothing: it reads the two reviews' findings from the review
# job's artifact, and checks them before it posts them on that same head commit.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

# A push to the pull request replaces the review of the commit before it.
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Two fresh Claude sessions review the patch side by side, one for bugs and one for security,
  # each its own claude run. Neither can run the change's code: they read the patch, applied to
  # main, and the repository, with no tool that runs anything but git's reads.
  review:
    # A fork's pull request, or one opened by anyone without write access, starts nothing here: its
    # author could steer the sessions, which hold the maintainer's login token. Anyone who can read
    # the repository can open a pull request between two of its branches, so the opener must be the
    # owner, a member, a collaborator or the build's app.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) ||
      github.event.pull_request.user.login == 'awml-factory[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The reviews read the patch as data and follow main's prompts and REVIEW.md, so a branch
      # can't rewrite what it's held to. They're kept before the patch is applied. The patch is
      # GitHub's diff of the head commit against the commit of main the branch started from, so it
      # applies there as it is, and `git diff --cached` shows the whole change. A patch that touches
      # Claude Code's own settings, .claude/, .mcp.json or a CLAUDE.md, is refused before any session
      # starts, and no session loads settings or servers from the tree.
      - name: Bring in the pull request's patch against main, and main's REVIEW.md and review prompts
        id: bring
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The head commit isn't a commit id: $HEAD_SHA"
            exit 1
          fi
          review="$RUNNER_TEMP/review"
          mkdir -p "$review"
          cp .github/review-bugs-prompt.md .github/review-security-prompt.md "$RUNNER_TEMP/"
          cp REVIEW.md "$review/REVIEW.md"
          main="$(git rev-parse HEAD)"
          compare="repos/$GITHUB_REPOSITORY/compare/$main...$HEAD_SHA"
          base="$(gh api "$compare" --jq .merge_base_commit.sha)"
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]] || ! git merge-base --is-ancestor "$base" "$main"; then
            echo "The pull request doesn't start from a commit of main: $base"
            exit 1
          fi
          gh api "$compare" -H "Accept: application/vnd.github.diff" > "$review/change.patch"
          jq -r '"# \(.pull_request.title)\n\n\(.pull_request.body // "")"' "$GITHUB_EVENT_PATH" \
            > "$review/pull-request.md"
          git checkout -q --detach "$base"
          git apply --index "$review/change.patch"
          claudes='(^|/)\.claude(/|$)|(^|/)\.mcp\.json$|(^|/)CLAUDE(\.local)?\.md$'
          if git diff --cached --name-only --no-renames -z | grep -zqE "$claudes"; then
            echo "The patch changes Claude Code's own settings, servers or instructions, which a review session would load, so it isn't reviewed:"
            git diff --cached --name-only --no-renames -z | grep -zE "$claudes" | tr '\0' '\n'
            exit 1
          fi

      # Claude Code runs its commands in a sandbox, bubblewrap with socat for its network, so that it
      # can scrub its login token from them, and they can't start without both. Ubuntu's runners
      # restrict the user namespaces bubblewrap needs, so allow them on this throwaway machine, and
      # check bubblewrap works before Claude starts.
      - name: Install Claude Code and bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --dev-bind / / --unshare-pid true
          npm install -g @anthropic-ai/claude-code

      # Each review is its own claude run, started together, so neither sees the other's session.
      # Each session keeps the login token from the commands it runs (awml #121). It loads only the
      # user's settings and no MCP servers, so nothing in the tree can set its hooks or where it
      # sends the token, and it reads only the working tree and its own folder, never /proc, where
      # its own environment holds the token.
      - name: Review the patch for bugs and for security, side by side
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          REVIEW_DIR: ${{ runner.temp }}/review
        run: |
          review() {
            prompt="$(sed "s|REVIEW_DIR|$REVIEW_DIR|g" "$RUNNER_TEMP/$1")"
            claude -p "$prompt" --model opus --max-turns 100 --permission-mode acceptEdits \
              --setting-sources user --strict-mcp-config --add-dir "$REVIEW_DIR" \
              --disallowedTools "Read(//proc/**)" \
              --allowedTools "Read(./**)" "Read(/$REVIEW_DIR/**)" "Write" \
                "Bash(git diff:*)" "Bash(git log:*)" "Bash(git show:*)" "Bash(git status:*)" \
              > "$RUNNER_TEMP/$1.log" 2>&1
          }
          review review-bugs-prompt.md &
          bugs=$!
          review review-security-prompt.md &
          security=$!
          status=0
          wait "$bugs" || status=1
          wait "$security" || status=1
          for log in review-bugs-prompt.md review-security-prompt.md; do
            echo "::group::$log"
            cat "$RUNNER_TEMP/$log.log"
            echo "::endgroup::"
          done
          exit "$status"

      # Findings that carry anything like the login token are refused, never uploaded or posted.
      # Anyone who can read the repository can download the artifact, so they're refused here, before
      # the upload, and again by the post job, which reads the artifact as data.
      - name: Keep the findings only if they carry no login token
        id: keep
        run: |
          for file in bugs.json security.json; do
            if ! jq -e '[.. | strings | select(test("sk-ant-"; "i") or test("[A-Za-z0-9_-]{80,}"))] | length == 0' \
                "$RUNNER_TEMP/review/$file" > /dev/null 2>&1; then
              echo "The review's $file can't be read, or carries what looks like a login token, so it isn't kept."
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: findings
          path: |
            ${{ runner.temp }}/review/bugs.json
            ${{ runner.temp }}/review/security.json

  # Once both reviews are done, posts each as a check on the head commit: passed if it found
  # nothing, failed if it found something Important, and neutral if it found only Nits or
  # Pre-existing faults, with its findings ranked. An Important finding means the change breaks
  # something, so it takes a fix, or the maintainer's deliberate bypass, to merge. Each review's file must be a list of findings, each ranked, or nothing is posted, and
  # findings that carry anything like the login token are refused, never uploaded or posted. Text
  # the reviews wrote goes into the summary with nothing in it that can hide the rest, each title
  # cut to 200 characters and each detail to 2,000.
  post:
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: findings
          path: ${{ runner.temp }}/findings

      - name: Post the Bug review and Security review checks
        id: post
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The head commit isn't a commit id: $HEAD_SHA"
            exit 1
          fi
          findings="$RUNNER_TEMP/findings"
          for file in bugs.json security.json; do
            if ! jq -e 'type == "array" and length <= 50 and all(.[];
                type == "object" and
                (.severity | IN("Important", "Nit", "Pre-existing")) and
                (.file | type == "string") and (.line | type == "number" and . >= 0) and
                (.title | type == "string") and (.detail | type == "string"))' "$findings/$file" > /dev/null; then
              echo "The review left no readable record of its findings in $file."
              exit 1
            fi
            if ! jq -e '[.. | strings | select(test("sk-ant-"; "i") or test("[A-Za-z0-9_-]{80,}"))] | length == 0' \
                "$findings/$file" > /dev/null; then
              echo "A finding in $file carries what looks like a login token, so nothing is posted."
              exit 1
            fi
          done
          check='
            def clean: gsub("[\r\n]+"; " ") | gsub("<"; "&lt;");
            def place: (.file | gsub("`"; "") | clean) + (if .line > 0 then ":\(.line | floor)" else "" end);
            ["Important", "Nit", "Pre-existing"] as $ranks
            | . as $found
            | [$ranks[] as $rank | {rank: $rank, found: [$found[] | select(.severity == $rank)]}
                | select(.found | length > 0)] as $ranked
            | {
                name: $name,
                head_sha: $head_sha,
                status: "completed",
                conclusion: (if any(.[]; .severity == "Important") then "failure" elif length == 0 then "success" else "neutral" end),
                output: {
                  title: (if length == 0 then "Found nothing"
                    else [$ranked[] | "\(.rank): \(.found | length)"] | join(", ") end),
                  summary: (if length == 0 then "The review found nothing that survived a second look."
                    else [$ranked[] | "## \(.rank)\n\n" +
                      ([.found[] | "- In `\(place)`: **\(.title | .[0:200] | clean)** \(.detail | .[0:2000] | clean)"]
                        | join("\n"))]
                      | join("\n\n") end)
                }
              }'
          post() {
            jq --arg name "$1" --arg head_sha "$HEAD_SHA" "$check" "$findings/$2" |
              gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" --input - > /dev/null
          }
          post "Bug review" bugs.json
          post "Security review" security.json
