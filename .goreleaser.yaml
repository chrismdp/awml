# Builds awml for Linux, macOS and Windows, on amd64 and arm64, when a tag v* is pushed.
# Try it locally with: goreleaser release --snapshot --clean
version: 2
project_name: awml

builds:
  - main: ./cmd/awml
    binary: awml
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w"]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, SPEC.md, LICENSE]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
