[project]
name = "awml"
version = "0.1.0"
description = "The Agentic Workflow Modelling Language: agentic workflows described as text and drawn with Mermaid"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["PyYAML"]

[project.scripts]
awml = "awml.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["awml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
