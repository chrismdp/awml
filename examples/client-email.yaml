# This workflow drafts a reply to a client's email. The file holds its design and its office
# implementation, which runs across a Mac mini, synced notes, a phone and Gmail. The consultant,
# the associate and the client are fictional.
awml: "0.5"
title: A client's email, answered with a draft
scopes:
  - { id: private, label: "private: the consultant", processing: any }
  - { id: business, label: "business: the consultant, an associate", processing: { anthropic: any } }
parts:
  - { id: mailbox, kind: connector, label: "The consultant's mailbox", in: private }
  - { id: weekdays, kind: trigger, label: "Weekdays 07:00", wait: PT2H, in: private }
  - { id: bring, kind: code, op: bring-in, label: "Bring in the inbox", in: private }
  - { id: rules, kind: code, op: sort, label: "Sort by rule: is the sender a client?", in: private }
  - { id: engagements, kind: context, label: "The business's engagements", at: notes/engagements, in: business }
  - { id: choose, kind: ai, op: sort, label: "Choose the engagement the email belongs to", in: business }
  - { id: learn, kind: ai, op: learn, label: "Update the engagement's project with what the email says", in: business }
  - { id: project, kind: context, label: "The engagement's project", at: notes/projects, in: business }
  - { id: draft, kind: ai, op: draft, label: "Draft a reply", in: business }
  - { id: drafts, kind: context, label: "Drafts", in: business }
  - { id: edit, kind: person, op: do, label: "Edit the reply and send it", in: private }
  - { id: send, kind: outside, label: "Send the reply: Ask", in: private }
lines:
  - { from: weekdays, to: bring, kind: start }
  - { from: mailbox, to: bring, kind: data }
  - { from: bring, to: rules, kind: data }
  - { from: rules, to: choose, kind: publish, label: "standing rule: a client's email" }
  - { from: engagements, to: choose, kind: data }
  - { from: choose, to: learn, kind: data }
  - { from: learn, to: project, kind: data }
  - { from: project, to: draft, kind: data }
  - { from: draft, to: drafts, kind: data }
  - { from: drafts, to: edit, kind: publish, label: the consultant takes the reply }
  - { from: edit, to: send, kind: data }
  - { from: send, to: mailbox, kind: data }
implementations:
  office:
    label: The consultant's office
    blocks:
      - { id: cowork, label: "Claude Cowork, Mac mini", parts: [weekdays, bring, rules, choose, learn, draft] }
      - { id: files, label: "Synced Markdown notes", parts: [engagements, project] }
      - { id: phone, label: "The consultant's phone", parts: [edit] }
      - { id: gmail, label: "Gmail", parts: [mailbox, drafts, send] }
