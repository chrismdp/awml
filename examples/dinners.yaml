# This workflow plans a family's dinners, fills its shopping basket, copies its pickups and checks
# its bills. The file holds its design and its home implementation, which runs across a server,
# family apps, services and a kitchen screen. The family is fictional.
awml: "0.5"
title: The family's dinners
scopes:
  - { id: carers, label: "carers: + June, Beth" }
  - { id: family, label: "family: parents, kids", in: carers }
  - { id: household, label: "household: parents", in: family }
parts:
  - { id: thu, kind: trigger, label: "Thursday 19:00" }
  - { id: sat, kind: trigger, label: "Saturday 09:00" }
  - { id: daily, kind: trigger, label: "Every day 07:00" }
  - { id: calendar, kind: connector, label: "Nadia's calendar", in: carers }
  - { id: copy, kind: code, op: bring-in, label: "Copy the pickups calendar", in: carers }
  - { id: pickups, kind: context, label: "Pickups", in: carers }
  - { id: screen, kind: surface, label: "Kitchen screen", in: carers }
  - { id: screen_gap, kind: comment, label: "Missing from the design: no scheduled task keeps the screen current" }
  - { id: favourites, kind: context, label: "Favourites, recipes and the shopping list", in: family }
  - { id: plan, kind: ai, label: "Plan next week's dinners", in: family }
  - { id: mealplan, kind: context, label: "Meal plan", in: family }
  - { id: chat, kind: surface, label: "Family chat", in: family }
  - { id: fill, kind: code, op: do, label: "Fill the basket from the plan and the list", in: family }
  - { id: basket, kind: outside, label: "Fill the basket: Allow under £180", in: family }
  - { id: approve, kind: review, label: "Owen's yes to the exact basket", in: family }
  - { id: checkout, kind: outside, label: "Check out: Ask", in: family }
  - { id: shop, kind: connector, label: "Owen's supermarket account", in: family }
  - { id: bank, kind: connector, label: "Joint account, on Owen's consent", in: household }
  - { id: match, kind: code, op: check, label: "Match the account against the bills expected", in: household }
  - { id: parents_chat, kind: surface, label: "Parents' chat", in: household }
lines:
  - { from: thu, to: plan, kind: start }
  - { from: favourites, to: plan, kind: data }
  - { from: plan, to: mealplan, kind: data }
  - { from: mealplan, to: chat, kind: data, label: posted }
  - { from: sat, to: fill, kind: start }
  - { from: mealplan, to: fill, kind: data }
  - { from: favourites, to: fill, kind: data }
  - { from: fill, to: basket, kind: data }
  - { from: basket, to: shop, kind: data }
  - { from: basket, to: approve, kind: data }
  - { from: approve, to: checkout, kind: data, label: "[yes]" }
  - { from: checkout, to: shop, kind: data }
  - { from: calendar, to: copy, kind: data }
  - { from: copy, to: pickups, kind: data }
  - { from: pickups, to: screen, kind: data }
  - { from: mealplan, to: screen, kind: publish, label: "standing rule: dinners to carers" }
  - { from: screen_gap, to: screen, kind: tie }
  - { from: daily, to: match, kind: start }
  - { from: bank, to: match, kind: data }
  - { from: match, to: parents_chat, kind: data }
implementations:
  home:
    label: At home
    blocks:
      - { id: server, label: "Server: claude-sonnet-4-5", parts: [favourites, plan, mealplan, fill, copy, pickups, match, screen_gap] }
      - { id: app, label: "The family messaging app", parts: [approve, chat, parents_chat] }
      - { id: supermarket, label: "The supermarket", parts: [basket, checkout, shop] }
      - { id: calendars, label: "The calendar", parts: [calendar] }
      - { id: wall, label: "The kitchen screen", parts: [screen] }
      - { id: banking, label: "The bank", parts: [bank] }
    comments:
      - { id: scored, label: "For example: scored against the plans the family kept", in: server, ties: [plan] }
      - { id: tried, label: "For example: tried on a second model some weeks", in: server, ties: [plan] }
