# The same workflow as client-email.yaml, by where each part runs. Each block is a platform, with
# its own harness, models, surfaces and triggers: one activity needs four of them here, which is
# normal today. The consultant is fictional.
awml: "0.2"
title: A client's email, by where each part runs
view: platform
groups:
  - { id: cowork, label: "Claude Cowork, Mac mini" }
  - { id: files, label: "Synced Markdown notes" }
  - { id: phone, label: "The consultant's phone" }
  - { id: gmail, label: "Gmail" }
parts:
  - { id: mailbox, kind: connector, label: "The consultant's mailbox", in: gmail }
  - { id: weekdays, kind: trigger, label: "A scheduled task, weekdays 07:00", in: cowork }
  - { id: bring, kind: code, op: bring-in, label: "Bring in the inbox", in: cowork }
  - { id: rules, kind: code, op: sort, label: "Sort by rule: is the sender a client?", in: cowork }
  - { id: engagements, kind: context, label: "The business's engagements", in: files }
  - { id: choose, kind: ai, op: sort, label: "Choose the engagement the email belongs to", in: cowork }
  - { id: learn, kind: ai, op: learn, label: "Update the engagement's project with what the email says", in: cowork }
  - { id: project, kind: context, label: "The engagement's project", in: files }
  - { id: draft, kind: ai, op: draft, label: "Draft a reply", in: cowork }
  - { id: drafts, kind: context, label: "Drafts", in: gmail }
  - { id: edit, kind: person, op: do, label: "Edit the reply and send it", in: phone }
  - { id: send, kind: outside, label: "Send the reply: Ask", in: gmail }
lines:
  - { from: weekdays, to: bring, kind: start }
  - { from: mailbox, to: bring, kind: data }
  - { from: bring, to: rules, kind: data }
  - { from: rules, to: choose, kind: publish, label: "standing rule: a client's email" }
  - { from: engagements, to: choose, kind: data }
  - { from: choose, to: learn, kind: data }
  - { from: learn, to: project, kind: data }
  - { from: project, to: draft, kind: data }
  - { from: draft, to: drafts, kind: data }
  - { from: drafts, to: edit, kind: publish, label: "the consultant takes the reply" }
  - { from: edit, to: send, kind: data }
  - { from: send, to: mailbox, kind: data }
