# A draft, the owner's yes to the exact message, and the send. Ella runs a children's swimming club,
# and is fictional.
awml: "0.1"
title: The club's Friday message
view: scopes
groups:
  - { id: ella, label: "ella: Ella" }
parts:
  - { id: fri, kind: trigger, label: "Friday 16:00" }
  - { id: write, kind: ai, op: draft, label: "Draft the week's message to the parents", in: ella }
  - { id: approve, kind: review, label: "Ella's yes to the exact message", in: ella }
  - { id: send, kind: rule, op: do, label: "Send the message Ella said yes to", in: ella }
  - { id: email, kind: outside, label: "Email the parents: Ask", in: ella }
lines:
  - { from: fri, to: write, kind: start }
  - { from: write, to: approve, kind: data, label: the draft }
  - { from: approve, to: send, kind: data, label: "[yes]" }
  - { from: send, to: email, kind: data }
