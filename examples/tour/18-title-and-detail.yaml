awml: "0.11"
title: Ordering flour
description: |
  Title and detail. Each part's label is a short title, and leaves out what its lines already say.
  A part may also say how it works, why it's shaped as it is and who decided it, which awml draw
  --detail shows in a note tied to it. The bakery and its people are fictional.
scopes:
  - { id: bakery, label: "bakery: Ana, Ben" }
parts:
  - { id: monday, kind: trigger, label: "Every Monday 06:00" }
  - { id: stock, kind: context, label: "Stock levels", in: bakery }
  - { id: check, kind: code, op: check, label: "Is the flour running low?", in: bakery, how: "sacks in stock against the sacks the week's bakes need" }
  - { id: order, kind: code, op: do, label: "Order flour", in: bakery, how: "two sacks from the usual mill", why: "a fixed order stays within the spending limit, so it needs no yes", decided: "Ana, when she set the spending limit in March" }
  - { id: mill, kind: outside, label: "Place the order with the mill: Allow", in: bakery }
lines:
  - { from: monday, to: check, kind: start }
  - { from: stock, to: check, kind: data }
  - { from: check, to: order, kind: start, label: "[running low]" }
  - { from: order, to: mill, kind: start }
