# Check by code. Code matches the joint account against the bills expected and reports what's
# missing or different. It reads and reports, and changes nothing. The parents are fictional.
awml: "0.4"
title: The morning bills check
scopes:
  - { id: parents, label: "parents: Mia, Dev" }
parts:
  - { id: daily, kind: trigger, label: "Every day 07:00" }
  - { id: bank, kind: connector, label: "The joint account, read only, on Mia's consent", in: parents }
  - { id: expected, kind: context, label: "Bills expected", in: parents }
  - { id: match, kind: code, op: check, label: "Match the account against the bills expected", in: parents }
  - { id: chat, kind: surface, label: "Parents' chat", in: parents }
lines:
  - { from: daily, to: match, kind: start }
  - { from: bank, to: match, kind: data }
  - { from: expected, to: match, kind: data }
  - { from: match, to: chat, kind: data, label: "anything missing or different" }
