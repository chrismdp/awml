# Two scopes side by side. Jo keeps the books for a bakery and runs a small pottery shop on the
# side. The two scopes share only Jo, so neither sits inside the other, and the line between them
# is publishing. Jo, the bakery and the shop are fictional.
awml: "0.6"
title: A checklist moves from a client to a side venture
scopes:
  - { id: bakery, label: "bakery: Jo, Ben, Lou" }
  - { id: pottery, label: "pottery: Jo, Kit" }
parts:
  - { id: invoices, kind: context, label: "The bakery's invoices", in: bakery }
  - { id: checklist, kind: context, label: "Jo's checklist for chasing", in: bakery }
  - { id: chase, kind: ai, op: draft, label: "Draft a reminder for each late invoice", in: bakery }
  - { id: shop_notes, kind: context, label: "The shop's notes", in: pottery }
  - { id: remind, kind: ai, op: draft, label: "Draft a reminder for each late order", in: pottery }
lines:
  - { from: invoices, to: chase, kind: data }
  - { from: checklist, to: chase, kind: data }
  - { from: checklist, to: shop_notes, kind: data, label: "the checklist, with no names in it" }
  - { from: shop_notes, to: remind, kind: data }
