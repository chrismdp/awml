awml: "0.10"
title: A checklist moves from a client to a side venture
description: |
  Two scopes side by side. Jo keeps the books for a bakery and runs a small pottery shop on the
  side. The two scopes share only Jo, so neither sits inside the other. A code step in the bakery
  reads Jo's checklist and takes the names out, and hands the copy to a code step in the shop,
  which writes it into the shop's notes. The hand-off between them is publishing. Jo, the bakery
  and the shop are fictional.
