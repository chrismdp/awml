awml: "0.10"
title: A checklist moves from a client to a side venture
description: |
  Two scopes side by side. Jo keeps the books for a bakery and runs a small pottery shop on the
  side. The two scopes share only Jo, so neither sits inside the other. A code step reads Jo's
  checklist, takes the names out and writes the copy into the shop's notes, and that line between
  them is publishing. Jo, the bakery and the shop are fictional.
