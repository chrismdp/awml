# The same workflow as client-email.yaml, by where each part runs. One activity needs five
# platforms here, which is normal today. The consultant is fictional.
awml: "0.1"
title: A client's email, by where each part runs
view: where
groups:
  - { id: server, label: "A server running scheduled jobs" }
  - { id: model, label: "A model, through its API" }
  - { id: files, label: "Markdown notes, synced to each machine" }
  - { id: phone, label: "The consultant's phone" }
  - { id: mailservice, label: "The mail service" }
parts:
  - { id: weekdays, kind: trigger, label: "Weekdays 07:00", in: server }
  - { id: bring, kind: rule, op: bring-in, label: "Bring in the consulting inbox", in: server }
  - { id: rules, kind: rule, op: sort, label: "Sort by rule: newsletters, receipts, sent mail", in: server }
  - { id: choose, kind: ai, op: sort, label: "Choose the engagement the email belongs to", in: model }
  - { id: learn, kind: ai, op: learn, label: "Update the engagement's project with what the email says", in: model }
  - { id: draft, kind: ai, op: draft, label: "Draft a reply", in: model }
  - { id: project, kind: context, label: "The engagement's project", in: files }
  - { id: drafts, kind: context, label: "Drafts", in: files }
  - { id: ask, kind: rule, op: do, label: "Ask the consultant to approve the reply, saying what it is for", in: server }
  - { id: today, kind: surface, label: "Today", in: phone }
  - { id: approve, kind: review, label: "The consultant's yes to the exact reply", in: phone }
  - { id: mailbox, kind: connector, label: "The consultant's mailbox", in: mailservice }
  - { id: send, kind: outside, label: "Send the reply: Ask", in: mailservice }
lines:
  - { from: weekdays, to: bring, kind: start }
  - { from: mailbox, to: bring, kind: data }
  - { from: bring, to: rules, kind: data }
  - { from: rules, to: choose, kind: data, label: no rule matches }
  - { from: choose, to: learn, kind: data }
  - { from: learn, to: project, kind: data }
  - { from: project, to: draft, kind: data }
  - { from: draft, to: drafts, kind: data }
  - { from: drafts, to: ask, kind: data }
  - { from: ask, to: today, kind: data }
  - { from: today, to: approve, kind: data }
  - { from: approve, to: send, kind: data, label: "[yes]" }
  - { from: send, to: mailbox, kind: data }
